name: Apply TTS fix (temporary automation)
on:
  push:
    branches: [fix/live-tts-503]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/live-tts-503
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply TTS fixes
        run: node scripts/apply-tts-fix.mjs
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: live doubt chat TTS - 12s Edge timeout, POST endpoint, chunked speech queue + speechSynthesis fallback"
          git push
