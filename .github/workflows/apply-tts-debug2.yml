name: Apply TTS debug TS fix (temporary automation)
on:
  push:
    branches: [fix/tts-debug2]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tts-debug2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply debug TS fix
        run: node scripts/apply-tts-debug2.mjs
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "debug(tts): fix strict-mode type error in diagnostics (typed messages array)"
          git push
