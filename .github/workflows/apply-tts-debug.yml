name: Apply TTS debug (temporary automation)
on:
  push:
    branches: [fix/tts-debug]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tts-debug
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply TTS debug patch
        run: node scripts/apply-tts-debug.mjs
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "debug(tts): add ?debug=1 per-tier diagnostics endpoint (temporary)"
          git push
