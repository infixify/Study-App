          python3 -c "import sys, textwrap; sys.stdout.write(textwrap.dedent(sys.stdin.read()))" << 'DART_BRIDGE_EOF' > prepwise_app/lib/bridge/app_bridge_handler.dart
          import 'dart:convert';
          import 'package:flutter/services.dart';
          import 'package:flutter/foundation.dart';
          import 'package:permission_handler/permission_handler.dart';
          import 'package:webview_flutter/webview_flutter.dart';
          import '../services/app_toast.dart';
          import '../services/app_blocker_service.dart';
          import '../services/wakelock_service.dart';
          import '../services/pdf_download_service.dart';
          import '../services/notification_service.dart';
          import '../services/google_auth_service.dart';
          import '../services/focus_session_service.dart';

          class AppBridgeHandler {
            final WebViewController webViewController;
            AppBridgeHandler({required this.webViewController});

            Future<void> handleMessage(JavaScriptMessage message) async {
              try {
                final Map<String, dynamic> data = jsonDecode(message.message);
                final String action = data['action'] ?? '';

                switch (action) {
                  case 'nativeGoogleSignIn':
                    await triggerNativeGoogleSignIn();
                    break;

                  case 'startFocusNotification':
                    // Request camera permission if starting Focus Mode
                    try {
                      final camGranted = await Permission.camera.isGranted;
                      if (!camGranted) {
                        await Permission.camera.request();
                      }
                    } catch (_) {}

                    final String subject = data['subject'] ?? 'General';
                    final String mode = data['mode'] ?? 'Study';
                    final int initialSeconds = data['initialSeconds'] ?? 0;
                    final List<String> allowedApps = (data['allowedApps'] as List<dynamic>?)
                        ?.map((e) => e.toString()).toList() ?? [];

                    // 1. Start notification ticker (Flutter side — visible when app is open)
                    await FocusSessionService().startSession(
                      subject: subject,
                      mode: mode,
                      initialSeconds: initialSeconds,
                      onStopClicked: () => triggerInAppStopConfirmation(),
                    );

                    // 2. Start Android ForegroundService — survives app minimize/close
                    //    This handles BOTH the persistent notification AND app blocking in background
                    await AppBlockerService().startStrictTimer(
                      allowedApps,
                      subject: subject,
                      mode: mode,
                    );

                    await WakelockService.enable();
                    HapticFeedback.heavyImpact();
                    break;

                  case 'stopFocusNotification':
                    await FocusSessionService().stopSession();
                    await AppBlockerService().stopStrictTimer();
                    await WakelockService.disable();
                    HapticFeedback.mediumImpact();
                    break;

                  case 'updateCamStatus':
                    final String status = data['status'] ?? 'verified';
                    FocusSessionService().updateCamStatus(status);
                    break;

                  case 'downloadPdf':
                    final String? url = data['url'];
                    final String? title = data['title'];
                    if (url != null && url.isNotEmpty) {
                      await PdfDownloadService.downloadAndOpenPdf(url, customTitle: title);
                    }
                    break;

                  case 'startStrictTimer':
                    final List<String> allowed = (data['allowedApps'] as List<dynamic>?)?.map((e) => e.toString()).toList() ?? [];
                    if (AppBlockerService().isStrictActive) {
                      // Session already running — just update the allowed list
                      await AppBlockerService().updateBlockedApps(allowed);
                    } else {
                      await AppBlockerService().startStrictTimer(allowed);
                    }
                    break;

                  case 'stopStrictTimer':
                    await AppBlockerService().stopStrictTimer();
                    break;

                  case 'vibrate':
                    final String type = data['type'] ?? 'medium';
                    if (type == 'heavy') {
                      HapticFeedback.heavyImpact();
                    } else if (type == 'light') {
                      HapticFeedback.lightImpact();
                    } else {
                      HapticFeedback.mediumImpact();
                    }
                    break;

                  case 'toast':
                    final String msg = data['message'] ?? '';
                    if (msg.isNotEmpty) AppToast.show(msg);
                    break;

                  case 'requestHardwarePermissions':
                    await [Permission.camera, Permission.microphone, Permission.notification].request();
                    break;

                  case 'requestAccessibilityPermission':
                  case 'requestUsagePermission':
                    await AppBlockerService().openAccessibilitySettings();
                    break;

                  case 'checkAccessibilityEnabled':
                  case 'checkUsagePermission':
                    final bool enabled = await AppBlockerService().isAccessibilityEnabled();
                    await webViewController.runJavaScript("(function(){if(typeof window.onAccessibilityStatus==='function'){window.onAccessibilityStatus($enabled);}})();");
                    break;

                  case 'getFCMToken':
                    final token = NotificationService().fcmToken;
                    if (token != null) injectFCMToken(token);
                    break;

                  default:
                    debugPrint("Unknown AppBridge action: $action");
                }
              } catch (e) {
                debugPrint("AppBridge error: $e");
              }
            }

            Future<void> triggerNativeGoogleSignIn() async {
              try {
                final result = await GoogleAuthService().signIn();
                if (result.success && result.idToken != null) {
                  final idToken = result.idToken!;
                  final accessToken = result.accessToken ?? '';
                  AppToast.show("Signed in as ${result.email ?? 'Google account'}!");
                  await webViewController.runJavaScript(
                    "(function(){"
                    "if(typeof window.onNativeGoogleSignInSuccess==='function'){"
                    "  window.onNativeGoogleSignInSuccess('$idToken','$accessToken');"
                    "}else{"
                    "  window.__pendingGoogleTokens={idToken:'$idToken',accessToken:'$accessToken'};"
                    "}"
                    "})();"
                  );
                } else {
                  // Native 1-Tap was cancelled or unavailable. Fallback seamlessly to web login.
                  debugPrint("[GoogleAuth] Native Sign-In unavailable (${result.errorMessage}), web sign-in active.");
                }
              } catch (e) {
                debugPrint("triggerNativeGoogleSignIn error: $e");
              }
            }

            void triggerInAppStopConfirmation() {
              webViewController.runJavaScript("(function(){if(typeof window.onNativeRequestStopFocus==='function'){window.onNativeRequestStopFocus();}})();");
            }

            void injectFCMToken(String token) {
              webViewController.runJavaScript("(function(){if(typeof window.onNativeFCMToken==='function'){window.onNativeFCMToken('$token');}else{window.__pendingFcmToken='$token';}})();");
            }

            void handleNotificationClick(String payload) {
              webViewController.runJavaScript("(function(){if(typeof window.onNotificationDeepLink==='function'){window.onNotificationDeepLink('$payload');}})();");
            }
          }
          DART_BRIDGE_EOF

