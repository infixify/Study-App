          class AppBlockerService {
            static final AppBlockerService _instance = AppBlockerService._internal();
            factory AppBlockerService() => _instance;
            AppBlockerService._internal();

            static const _channel = MethodChannel('com.prepwise/accessibility');
            static const _overlayChannel = MethodChannel('com.prepwise/overlay');

            bool _isStrictActive = false;
            List<String> _allowedApps = [];

            bool get isStrictActive => _isStrictActive;

            List<dynamic> parseJsonArray(String jsonStr) {
              try {
                final decoded = jsonDecode(jsonStr);
                if (decoded is List) return decoded;
              } catch (_) {}
              return [];
            }

            Future<bool> canDrawOverlays() async {
              try {
                return await _overlayChannel.invokeMethod('canDrawOverlays') as bool? ?? false;
              } catch (_) {
                return false;
              }
            }

            Future<void> requestOverlayPermission() async {
              try {
                await _overlayChannel.invokeMethod('requestOverlayPermission');
              } catch (_) {}
            }

            Future<bool> isAccessibilityEnabled() async {
              try {
                return await _channel.invokeMethod('isAccessibilityEnabled') as bool? ?? false;
              } catch (_) {
                return false;
              }
            }

            Future<void> openAccessibilitySettings() async {
              try {
                await _channel.invokeMethod('openAccessibilitySettings');
              } catch (_) {}
            }

            Future<void> openAppInfoSettings() async {
              try {
                await _channel.invokeMethod('openAppInfoSettings');
              } catch (_) {}
            }

            Future<void> startStrictTimer(List<String> allowedPackages) async {
              _isStrictActive = true;
              _allowedApps = List.from(allowedPackages);

              final bool accessOk = await isAccessibilityEnabled();
              if (!accessOk) {
                // Only guide if blocker was intentionally activated
                AppToast.show("Please grant 'Usage Access' in Settings to enable App Blocker");
                await openAccessibilitySettings();
                return;
              }

              try {
                final allInstalledRaw = await const MethodChannel('com.prepwise/apps').invokeMethod('getInstalledApps') as String;
                final List<dynamic> allApps = _parseJsonArray(allInstalledRaw);
                final Set<String> allowedSet = allowedPackages.toSet();
                allowedSet.add('com.prepwise.prepwise');
                allowedSet.add('com.android.systemui');

                final List<String> blockedPackages = allApps
                    .map((a) => a['packageName']?.toString() ?? '')
                    .where((pkg) => pkg.isNotEmpty && !allowedSet.contains(pkg))
                    .toList();

                await _channel.invokeMethod('setBlockedApps', {'blockedApps': blockedPackages});
                await _channel.invokeMethod('setBlockingEnabled', {'enabled': true});
                AppToast.show("Focus Mode Active! Distracting apps will be blocked.");
              } catch (e) {
                debugPrint('[AppBlockerService] Error starting blocker: $e');
              }
            }

            Future<void> stopStrictTimer() async {
              _isStrictActive = false;
              _allowedApps = [];
              try {
                await _channel.invokeMethod('setBlockingEnabled', {'enabled': false});
              } catch (_) {}
            }

            List<dynamic> _parseJsonArray(String raw) {
              try {
                final trimmed = raw.trim();
                if (!trimmed.startsWith('[')) return [];
                final result = <Map<String, dynamic>>[];
                final itemPattern = RegExp(r'\{[^}]+\}');
                for (final match in itemPattern.allMatches(trimmed)) {
                  final item = match.group(0) ?? '';
                  final nameMatch = RegExp(r'"name"\s*:\s*"([^"]*)"').firstMatch(item);
                  final pkgMatch = RegExp(r'"packageName"\s*:\s*"([^"]*)"').firstMatch(item);
                  if (nameMatch != null && pkgMatch != null) {
                    result.add({'name': nameMatch.group(1), 'packageName': pkgMatch.group(1)});
                  }
                }
                return result;
              } catch (_) {
                return [];
              }
            }
          }
