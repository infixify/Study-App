          @pragma('vm:entry-point')
          Future<void> firebaseMessagingBackgroundHandler(RemoteMessage message) async {
            await Firebase.initializeApp();
            debugPrint("Handling background FCM: ${message.messageId}");
          }

          class NotificationService {
            static final NotificationService _instance = NotificationService._internal();
            factory NotificationService() => _instance;
            NotificationService._internal();

            final FirebaseMessaging _fcm = FirebaseMessaging.instance;
            final FlutterLocalNotificationsPlugin _localNotifications = FlutterLocalNotificationsPlugin();

            String? _fcmToken;
            String? get fcmToken => _fcmToken;

            Function(String token)? onTokenReceived;
            Function(String payload)? onNotificationTapped;
            Function()? onFocusStopActionClicked;

            Future<void> initialize({Function(String token)? onTokenReady, Function(String payload)? onNotificationClick, Function()? onFocusStopAction}) async {
              onTokenReceived = onTokenReady;
              onNotificationTapped = onNotificationClick;
              onFocusStopActionClicked = onFocusStopAction;

              try {
                await _fcm.requestPermission(alert: true, badge: true, sound: true, provisional: false);
              } catch (e) {
                debugPrint('FCM requestPermission error: $e');
              }

              const AndroidInitializationSettings androidSettings = AndroidInitializationSettings('@mipmap/ic_launcher');
              await _localNotifications.initialize(
                const InitializationSettings(android: androidSettings),
                onDidReceiveNotificationResponse: (NotificationResponse response) {
                  if (response.actionId == 'STOP_FOCUS_SESSION' || response.payload == 'FOCUS_SESSION_STOP_ACTION') {
                    onFocusStopActionClicked?.call();
                    FocusSessionService().onStopRequested?.call();
                    return;
                  }
                  if (response.payload != null) onNotificationTapped?.call(response.payload!);
                },
              );

              const AndroidNotificationChannel broadcastChannel = AndroidNotificationChannel(
                'prepwise_broadcast_channel',
                'PrepWise Notifications',
                description: 'Important study updates and reminders.',
                importance: Importance.max,
                playSound: true,
                enableVibration: true,
              );
              await _localNotifications.resolvePlatformSpecificImplementation<AndroidFlutterLocalNotificationsPlugin>()?.createNotificationChannel(broadcastChannel);

              await FocusSessionService().initializeNotificationChannel();

              try {
                _fcmToken = await _fcm.getToken();
                if (_fcmToken != null) onTokenReceived?.call(_fcmToken!);
              } catch (e) {
                debugPrint("FCM token error: $e");
              }

              _fcm.onTokenRefresh.listen((newToken) {
                _fcmToken = newToken;
                onTokenReceived?.call(newToken);
              });

              FirebaseMessaging.onMessage.listen((RemoteMessage message) {
                final notification = message.notification;
                final android = message.notification?.android;
                if (notification != null && android != null && !kIsWeb) {
                  _localNotifications.show(
                    notification.hashCode, notification.title, notification.body,
                    const NotificationDetails(android: AndroidNotificationDetails('prepwise_broadcast_channel', 'PrepWise Notifications', icon: '@mipmap/ic_launcher', importance: Importance.max, priority: Priority.high)),
                    payload: jsonEncode(message.data),
                  );
                }
              });

              FirebaseMessaging.onMessageOpenedApp.listen((RemoteMessage message) {
                if (onNotificationTapped != null) onNotificationTapped!(jsonEncode(message.data));
              });
            }
          }
