              // Poll every 500ms - tick timer only when cam not paused
              private var tickCount = 0
              private val tickRunnable = object : Runnable {
                  override fun run() {
                      tickCount++
                      if (!camPaused) {
                          currentElapsedSeconds++
                          if (currentElapsedSeconds % 2 == 0) updateNotification() // update notif every 2s
                          if (tickCount % 2 == 0) updateDotTimer() // update dot timer every 1s
                      }
