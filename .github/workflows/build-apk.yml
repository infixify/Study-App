name: Build PrepWise Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Flutter Wrapper & Build APK
        run: |
          # 1. Create clean Flutter project
          flutter create --org com.prepwise --project-name prepwise prepwise_app
          cd prepwise_app

          # 2. Add dependencies
          flutter pub add webview_flutter wakelock_plus url_launcher

          # 3. Add Android permissions
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"/>\n    <uses-permission android:name="android.permission.VIBRATE"/>' android/app/src/main/AndroidManifest.xml

          # 4. Set minSdk to 21
          sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 21/g' android/app/build.gradle || true
          sed -i 's/minSdk = flutter.minSdk/minSdk = 21/g' android/app/build.gradle || true

          # 5. Write Flutter Entrypoint
          cat << 'DART' > lib/main.dart
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:webview_flutter/webview_flutter.dart';
          import 'package:wakelock_plus/wakelock_plus.dart';
          import 'package:url_launcher/url_launcher.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            SystemChrome.setPreferredOrientations([
              DeviceOrientation.portraitUp,
              DeviceOrientation.portraitDown,
            ]);
            runApp(const PrepWiseApp());
          }

          class PrepWiseApp extends StatelessWidget {
            const PrepWiseApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'PrepWise',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  scaffoldBackgroundColor: const Color(0xFF0F172A),
                ),
                home: const MainWebView(),
              );
            }
          }

          class MainWebView extends StatefulWidget {
            const MainWebView({super.key});

            @override
            State<MainWebView> createState() => _MainWebViewState();
          }

          class _MainWebViewState extends State<MainWebView> {
            late final WebViewController _controller;
            bool _isLoading = true;
            int _progress = 0;

            @override
            void initState() {
              super.initState();
              _controller = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..setBackgroundColor(const Color(0xFF0F172A))
                ..setNavigationDelegate(
                  NavigationDelegate(
                    onProgress: (p) => setState(() => _progress = p),
                    onPageStarted: (url) => setState(() => _isLoading = true),
                    onPageFinished: (url) {
                      setState(() => _isLoading = false);
                      _controller.runJavaScript('''
                        if (!window.AppBridge) {
                          window.AppBridge = {
                            postMessage: function(msg) {
                              if (window.FlutterBridge) {
                                window.FlutterBridge.postMessage(typeof msg === 'string' ? msg : JSON.stringify(msg));
                              }
                            }
                          };
                        }
                      ''');
                    },
                    onNavigationRequest: (request) {
                      if (request.url.endsWith('.pdf')) {
                        launchUrl(Uri.parse(request.url), mode: LaunchMode.externalApplication);
                        return NavigationDecision.prevent;
                      }
                      return NavigationDecision.navigate;
                    },
                  ),
                )
                ..addJavaScriptChannel(
                  'FlutterBridge',
                  onMessageReceived: (JavaScriptMessage message) {
                    try {
                      if (message.message.contains('startStrictTimer')) {
                        WakelockPlus.enable();
                        HapticFeedback.heavyImpact();
                      } else if (message.message.contains('stopStrictTimer')) {
                        WakelockPlus.disable();
                        HapticFeedback.vibrate();
                      } else if (message.message.contains('vibrate')) {
                        HapticFeedback.mediumImpact();
                      }
                    } catch (e) {
                      debugPrint('Bridge error: \$e');
                    }
                  },
                )
                ..loadRequest(Uri.parse('https://study-app-infixify1.vercel.app'));
            }

            @override
            Widget build(BuildContext context) {
              return WillPopScope(
                onWillPop: () async {
                  if (await _controller.canGoBack()) {
                    _controller.goBack();
                    return false;
                  }
                  return true;
                },
                child: Scaffold(
                  backgroundColor: const Color(0xFF0F172A),
                  body: SafeArea(
                    child: Stack(
                      children: [
                        WebViewWidget(controller: _controller),
                        if (_isLoading)
                          LinearProgressIndicator(
                            value: _progress / 100.0,
                            backgroundColor: const Color(0xFF1E293B),
                            color: const Color(0xFF0D9488),
                            minHeight: 3,
                          ),
                      ],
                    ),
                  ),
                ),
              );
            }
          }
          DART

          # 6. Build Release APK
          flutter build apk --release

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: PrepWise-Android-APK
          path: prepwise_app/build/app/outputs/flutter-apk/app-release.apk
