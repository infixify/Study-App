          python3 -c "import sys, textwrap; sys.stdout.write(textwrap.dedent(sys.stdin.read()))" << 'DART_FOCUS_EOF' > prepwise_app/lib/services/focus_session_service.dart
          import 'dart:async';
          import 'package:flutter/foundation.dart';
          import 'package:flutter_local_notifications/flutter_local_notifications.dart';

          class FocusSessionService {
            static final FocusSessionService _instance = FocusSessionService._internal();
            factory FocusSessionService() => _instance;
            FocusSessionService._internal();

            static const int notificationId = 8801;
            static const String channelId = 'prepwise_focus_live_timer';
            static const String channelName = 'Active Focus Session';

            final FlutterLocalNotificationsPlugin _notifications = FlutterLocalNotificationsPlugin();

            bool _isSessionActive = false;
            String _subject = 'General';
            String _mode = 'Practice'; // 'Practice' or 'Study'
            DateTime? _startTime;
            Timer? _tickerTimer;
            String _camStatus = 'verified'; // 'verified' (green) or 'lost' (red)
            int _elapsedSeconds = 0;

            bool get isSessionActive => _isSessionActive;
            String get subject => _subject;
            String get mode => _mode;
            String get camStatus => _camStatus;
            int get elapsedSeconds => _elapsedSeconds;

            // Listeners for UI state
            final ValueNotifier<String> camStatusNotifier = ValueNotifier<String>('verified');
            final ValueNotifier<int> elapsedNotifier = ValueNotifier<int>(0);
            final ValueNotifier<bool> activeNotifier = ValueNotifier<bool>(false);

            // Callback triggered when stop is clicked on notification
            Function()? onStopRequested;

            Future<void> initializeNotificationChannel() async {
              const AndroidNotificationChannel channel = AndroidNotificationChannel(
                channelId,
                channelName,
                description: 'Live continuous notification during active Focus Mode study sessions.',
                importance: Importance.low, // Silent updates: no annoying sound every second
                playSound: false,
                enableVibration: false,
                showBadge: false,
              );

              await _notifications
                  .resolvePlatformSpecificImplementation<AndroidFlutterLocalNotificationsPlugin>()
                  ?.createNotificationChannel(channel);
            }

            /// Start Focus Session Live Notification with Real-Time Stopwatch
            Future<void> startSession({
              required String subject,
              required String mode,
              int? initialSeconds,
              Function()? onStopClicked,
            }) async {
              _isSessionActive = true;
              _subject = subject.isNotEmpty ? subject : 'General';
              _mode = mode.isNotEmpty ? mode : 'Study';
              _startTime = DateTime.now();
              _elapsedSeconds = initialSeconds ?? 0;
              _camStatus = 'verified';
              onStopRequested = onStopClicked;

              activeNotifier.value = true;
              camStatusNotifier.value = 'verified';
              elapsedNotifier.value = _elapsedSeconds;

              debugPrint("[FocusSessionService] Starting session: $_subject ($_mode)");

              await _updateNotification();

              // Start periodic 1-second ticker to sync count-up timer
              _tickerTimer?.cancel();
              _tickerTimer = Timer.periodic(const Duration(seconds: 1), (timer) async {
                if (!_isSessionActive) {
                  timer.cancel();
                  return;
                }
                _elapsedSeconds++;
                elapsedNotifier.value = _elapsedSeconds;
                await _updateNotification();
              });
            }

            /// Updates the camera tracking status (verified = green, lost = red)
            void updateCamStatus(String status) {
              if (_camStatus != status) {
                _camStatus = status;
                camStatusNotifier.value = status;
                debugPrint("[FocusSessionService] Cam status updated to: $status");
              }
            }

            /// Formats seconds to HH:mm:ss or mm:ss
            String _formatTime(int totalSeconds) {
              final int hours = totalSeconds ~/ 3600;
              final int minutes = (totalSeconds % 3600) ~/ 60;
              final int seconds = totalSeconds % 60;

              final String mStr = minutes.toString().padLeft(2, '0');
              final String sStr = seconds.toString().padLeft(2, '0');

              if (hours > 0) {
                final String hStr = hours.toString().padLeft(2, '0');
                return "$hStr:$mStr:$sStr";
              }
              return "$mStr:$sStr";
            }

            Future<void> _updateNotification() async {
              if (!_isSessionActive) return;

              final String timeStr = _formatTime(_elapsedSeconds);
              final String title = "PrepWise Focus Session";
              final String body = "$timeStr - Studying: $_subject | Mode: $_mode";

              final AndroidNotificationDetails androidDetails = AndroidNotificationDetails(
                channelId,
                channelName,
                channelDescription: 'Live count-up stopwatch timer for active focus sessions.',
                importance: Importance.low,
                priority: Priority.low,
                ongoing: true,
                autoCancel: false,
                onlyAlertOnce: true,
                playSound: false,
                enableVibration: false,
                icon: '@mipmap/ic_launcher',
                actions: const <AndroidNotificationAction>[
                  AndroidNotificationAction(
                    'STOP_FOCUS_SESSION',
                    'Stop Focus Session',
                    showsUserInterface: true,
                    cancelNotification: false,
                  ),
                ],
              );

              final NotificationDetails notificationDetails = NotificationDetails(android: androidDetails);

              try {
                await _notifications.show(
                  notificationId,
                  title,
                  body,
                  notificationDetails,
                  payload: 'FOCUS_SESSION_STOP_ACTION',
                );
              } catch (e) {
                debugPrint("[FocusSessionService] Notification update error: $e");
              }
            }

            /// Stop Focus Session and dismiss notification
            Future<void> stopSession() async {
              _isSessionActive = false;
              _tickerTimer?.cancel();
              _tickerTimer = null;
              activeNotifier.value = false;

              try {
                await _notifications.cancel(notificationId);
                debugPrint("[FocusSessionService] Focus session stopped & notification dismissed.");
              } catch (e) {
                debugPrint("[FocusSessionService] Error cancelling notification: $e");
              }
            }
          }
          DART_FOCUS_EOF

          python3 -c "import sys, textwrap; sys.stdout.write(textwrap.dedent(sys.stdin.read()))" << 'DART_PDF_EOF' > prepwise_app/lib/services/pdf_download_service.dart
          import 'dart:io';
          import 'package:http/http.dart' as http;
          import 'package:path_provider/path_provider.dart';
          import 'package:open_filex/open_filex.dart';
          import 'package:url_launcher/url_launcher.dart';
          import 'app_toast.dart';
          import 'package:flutter/foundation.dart';

          class PdfDownloadService {
            static Future<void> downloadAndOpenPdf(String url, {String? customTitle}) async {
              try {
                final safeTitle = (customTitle != null && customTitle.trim().isNotEmpty)
                    ? customTitle.trim().replaceAll(RegExp(r'[^a-zA-Z0-9_\-\. ]'), '_')
                    : "NCERT_Resource_${DateTime.now().millisecondsSinceEpoch}";

                final filename = safeTitle.toLowerCase().endsWith('.pdf') ? safeTitle : "$safeTitle.pdf";

                AppToast.show("Loading NCERT: $filename...");

                final uri = Uri.parse(url);

                // Browser User-Agent and referer headers so ncert.nic.in allows download
                final response = await http.get(
                  uri,
                  headers: {
                    'User-Agent': 'Mozilla/5.0 (Linux; Android 14; Mobile) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36',
                    'Accept': 'application/pdf,application/octet-stream,*/*',
                    'Referer': 'https://ncert.nic.in/',
                  },
                ).timeout(const Duration(seconds: 30));

                if (response.statusCode != 200) {
                  throw Exception("Server returned HTTP ${response.statusCode}");
                }

                // Safe storage path that works on all Android versions (10, 11, 12, 13, 14, 15)
                Directory? targetDir;
                try {
                  final extDir = await getExternalStorageDirectory();
                  if (extDir != null) {
                    final ncertFolder = Directory("${extDir.path}/NCERT");
                    if (!await ncertFolder.exists()) {
                      await ncertFolder.create(recursive: true);
                    }
                    targetDir = ncertFolder;
                  }
                } catch (_) {}

                targetDir ??= await getApplicationDocumentsDirectory();

                final file = File("${targetDir.path}/$filename");
                await file.writeAsBytes(response.bodyBytes);

                AppToast.show("Opening NCERT Textbook...");

                // Open directly in native Android PDF viewer using OpenFilex
                final result = await OpenFilex.open(file.path);
                debugPrint("[PdfDownloadService] OpenFilex result: ${result.type} - ${result.message}");

                if (result.type != ResultType.done) {
                  // Fallback: launch external viewer directly if OpenFilex could not open
                  await launchUrl(Uri.parse(url), mode: LaunchMode.externalApplication);
                }
              } catch (e) {
                debugPrint("[PdfDownloadService] Download error: $e");
                AppToast.show("Opening NCERT in browser...");
                try {
                  await launchUrl(Uri.parse(url), mode: LaunchMode.externalApplication);
                } catch (err) {
                  AppToast.show("Could not open NCERT: $e");
                }
              }
            }
          }
