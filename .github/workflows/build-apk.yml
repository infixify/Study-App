          import 'dart:io';
          import 'package:http/http.dart' as http;
          import 'package:path_provider/path_provider.dart';
          import 'package:open_filex/open_filex.dart';
          import 'package:url_launcher/url_launcher.dart';
          import 'app_toast.dart';
          import 'package:flutter/foundation.dart';

          class PdfDownloadService {
            static Future<void> downloadAndOpenPdf(String url, {String? customTitle}) async {
              try {
                // Transform Google Docs Viewer or Google Drive links to direct download link
                String directUrl = url;
                if (url.contains('docs.google.com/viewer')) {
                  final parsed = Uri.tryParse(url);
                  final embedded = parsed?.queryParameters['url'];
                  if (embedded != null && embedded.isNotEmpty) {
                    directUrl = embedded;
                  }
                }
                if (directUrl.contains('drive.google.com')) {
                  final driveRegex = RegExp(r'/d/([a-zA-Z0-9_-]+)');
                  final match = driveRegex.firstMatch(directUrl);
                  if (match != null) {
                    final fileId = match.group(1);
                    directUrl = "https://drive.google.com/uc?export=download&id=$fileId";
                  }
                }

                final safeTitle = (customTitle != null && customTitle.trim().isNotEmpty)
                    ? customTitle.trim().replaceAll(RegExp(r'[^a-zA-Z0-9_\-\. ]'), '_')
                    : "Study_Resource_${DateTime.now().millisecondsSinceEpoch}";

                final displayTitle = (customTitle != null && customTitle.trim().isNotEmpty)
                    ? customTitle.trim()
                    : "NCERT Document";

                final filename = safeTitle.toLowerCase().endsWith('.pdf') ? safeTitle : "$safeTitle.pdf";

                Directory? targetDir;
                try {
                  final extDir = await getExternalStorageDirectory();
                  if (extDir != null) {
                    final resourceFolder = Directory("${extDir.path}/Resources");
                    if (!await resourceFolder.exists()) {
                      await resourceFolder.create(recursive: true);
                    }
                    targetDir = resourceFolder;
                  }
                } catch (_) {}
                targetDir ??= await getApplicationDocumentsDirectory();

                final file = File("${targetDir.path}/$filename");
                // Instant cache check: If already downloaded and valid, open instantly!
                if (await file.exists() && await file.length() > 2000) {
                  AppToast.show("Opening $displayTitle (Offline)...");
                  final cachedResult = await OpenFilex.open(file.path);
                  if (cachedResult.type == ResultType.done) return;
                }

                AppToast.show("Downloading $displayTitle...");

                final uri = Uri.parse(directUrl);

                final response = await http.get(
                  uri,
                  headers: {
                    'User-Agent': 'Mozilla/5.0 (Linux; Android 14; Mobile) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36',
                    'Accept': 'application/pdf,application/octet-stream,*/*',
                  },
                ).timeout(const Duration(seconds: 45));

                if (response.statusCode != 200) {
                  throw Exception("Server returned HTTP ${response.statusCode}");
                }

                await file.writeAsBytes(response.bodyBytes);

                AppToast.show("Opening $displayTitle in PDF Reader...");

                final result = await OpenFilex.open(file.path);
                debugPrint("[PdfDownloadService] OpenFilex result: ${result.type} - ${result.message}");

                if (result.type != ResultType.done) {
                  await launchUrl(Uri.parse(directUrl), mode: LaunchMode.externalApplication);
                }
              } catch (e) {
                debugPrint("[PdfDownloadService] Download error: $e");
                final displayTitle = (customTitle != null && customTitle.trim().isNotEmpty) ? customTitle.trim() : "Document";
                AppToast.show("Opening $displayTitle in browser...");
                try {
                  await launchUrl(Uri.parse(url), mode: LaunchMode.externalApplication);
                } catch (err) {
                  AppToast.show("Could not open $displayTitle: $e");
                }
              }
            }
          }
