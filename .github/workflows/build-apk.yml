                  if (foreground == "com.android.systemui" || foreground == "com.android.launcher" ||
                      foreground.startsWith("com.google.android.inputmethod")) {
                      showDotView() // show dot on launcher/sysui too
                      return
                  }

                  if (blockedApps.contains(foreground)) {
                      hideDotView() // blocking overlay covers everything - dot not needed
                      if (canDrawOverlay()) {
                          showBlockingOverlay(foreground)
                      } else {
                          redirectToPrepWise()
                      }
                  } else {
                      // Allowed app - show dot as reminder
                      if (overlayView != null) removeOverlay()
                      showDotView()
                  }
