                      })();
                    """);
                    break;

                  case 'requestAccessibilityPermission':
                  case 'requestUsagePermission':
                    await AppBlockerService().openAccessibilitySettings();
                    break;

                  case 'checkAccessibilityEnabled':
                  case 'checkUsagePermission':
                    final bool enabled = await AppBlockerService().isAccessibilityEnabled();
                    await webViewController.runJavaScript("(function(){if(typeof window.onAccessibilityStatus==='function'){window.onAccessibilityStatus($enabled);}})();");
                    break;

                  case 'getFCMToken':
                    final token = NotificationService().fcmToken;
                    if (token != null) {
