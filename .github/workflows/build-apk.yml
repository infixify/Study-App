      - name: Configure Android Manifest and Permissions
        run: |
          cd prepwise_app
          python3 -c "import sys, textwrap; exec(textwrap.dedent(sys.stdin.read()))" << 'PY_MANIFEST'
          import os
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r", encoding="utf-8") as f:
              content = f.read()

          if 'xmlns:tools="http://schemas.android.com/tools"' not in content:
              content = content.replace('<manifest', '<manifest\n    xmlns:tools="http://schemas.android.com/tools"', 1)

          permissions = """
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.VIBRATE"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/>
              <uses-permission android:name="android.permission.PACKAGE_USAGE_STATS" tools:ignore="ProtectedPermissions"/>
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />
              <uses-feature android:name="android.hardware.microphone" android:required="false" />
              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
              </queries>
          """

          fcm_service = """
                  <service
                      android:name=".FocusBlockerService"
                      android:foregroundServiceType="specialUse"
                      android:exported="false" />
                  <receiver
                      android:name=".BootReceiver"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                      </intent-filter>
                  </receiver>
                  <service
                      android:name="io.flutter.plugins.firebase.messaging.FlutterFirebaseMessagingBackgroundService"
                      android:permission="android.permission.BIND_JOB_SERVICE"
                      android:exported="false" />
                  <service
                      android:name="io.flutter.plugins.firebase.messaging.FlutterFirebaseMessagingService"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="com.google.firebase.MESSAGING_EVENT" />
                      </intent-filter>
                  </service>
          """

          if "android.permission.INTERNET" not in content:
              content = content.replace("<application", permissions + "\n    <application", 1)

          if "FlutterFirebaseMessagingBackgroundService" not in content:
              content = content.replace("</application>", fcm_service + "\n    </application>")

          with open(manifest_path, "w", encoding="utf-8") as f:
              f.write(content)
          print("Clean Play-Protect-safe AndroidManifest.xml configured.")
          PY_MANIFEST

      - name: Patch Gradle Configurations (Google Services & Desugaring)
        run: |
          cd prepwise_app
          python3 -c "import sys, textwrap; sys.stdout.write(textwrap.dedent(sys.stdin.read()))" << 'PY_GRADLE' > update_gradle.py
          import re, os

          if os.path.exists("android/settings.gradle.kts"):
              with open("android/settings.gradle.kts", "r") as f:
                  s = f.read()
              plugin_line = '    id("com.google.gms.google-services") version "4.4.1" apply false\n'
              if "com.google.gms.google-services" not in s and "plugins {" in s:
                  s = s.replace("plugins {", "plugins {\n" + plugin_line, 1)
              with open("android/settings.gradle.kts", "w") as f:
                  f.write(s)
          elif os.path.exists("android/settings.gradle"):
              with open("android/settings.gradle", "r") as f:
                  s = f.read()
              plugin_line = "    id 'com.google.gms.google-services' version '4.4.1' apply false\n"
              if "com.google.gms.google-services" not in s and "plugins {" in s:
                  s = s.replace("plugins {", "plugins {\n" + plugin_line, 1)
              with open("android/settings.gradle", "w") as f:
                  f.write(s)

          if os.path.exists("android/app/build.gradle.kts"):
              with open("android/app/build.gradle.kts", "r") as f:
                  a = f.read()
              signing_kts = "    signingConfigs {\\n        getByName(\"debug\") {\\n            storeFile = file(\"debug.keystore\")\\n            storePassword = \"android\"\\n            keyAlias = \"androiddebugkey\"\\n            keyPassword = \"android\"\\n        }\\n    }\\n"
              if 'storeFile = file("debug.keystore")' not in a:
                  a = re.sub(r'android\s*\{', 'android {\n' + signing_kts, a, count=1)
              app_plugin = '    id("com.google.gms.google-services")\n'
              if "com.google.gms.google-services" not in a:
                  m = re.search(r'plugins\s*\{([^}]*)\}', a)
                  if m:
                      a = a[:m.end()-1] + app_plugin + a[m.end()-1:]
                  elif "plugins {" in a:
                      a = a.replace("plugins {", "plugins {\n" + app_plugin, 1)
              if "isCoreLibraryDesugaringEnabled" not in a:
                  a = a.replace("compileOptions {", "compileOptions {\n        isCoreLibraryDesugaringEnabled = true")
              if "coreLibraryDesugaring" not in a:
                  a += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
              a = a.replace("minSdk = flutter.minSdkVersion", "minSdk = 21")
              a = a.replace("minSdkVersion = flutter.minSdkVersion", "minSdkVersion = 21")
              a = re.sub(r'compileSdk\s*=\s*flutter\.compileSdkVersion', 'compileSdk = 36', a)
              a = re.sub(r'compileSdkVersion\s*=\s*flutter\.compileSdkVersion', 'compileSdkVersion = 36', a)
              a = re.sub(r'targetSdk\s*=\s*flutter\.targetSdkVersion', 'targetSdk = 34', a)
              a = re.sub(r'targetSdkVersion\s*=\s*flutter\.targetSdkVersion', 'targetSdkVersion = 34', a)
              with open("android/app/build.gradle.kts", "w") as f:
                  f.write(a)
          elif os.path.exists("android/app/build.gradle"):
              with open("android/app/build.gradle", "r") as f:
                  a = f.read()
              signing_groovy = "    signingConfigs {\\n        debug {\\n            storeFile file(\"debug.keystore\")\\n            storePassword \"android\"\\n            keyAlias \"androiddebugkey\"\\n            keyPassword \"android\"\\n        }\\n    }\\n"
              if 'file("debug.keystore")' not in a:
                  a = re.sub(r'android\s*\{', 'android {\n' + signing_groovy, a, count=1)
              if "apply plugin: 'com.google.gms.google-services'" not in a:
                  a += "\napply plugin: 'com.google.gms.google-services'\n"
              if "coreLibraryDesugaringEnabled" not in a:
                  a = a.replace("compileOptions {", "compileOptions {\n        coreLibraryDesugaringEnabled true")
              if "coreLibraryDesugaring" not in a:
                  a += "\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'\n}\n"
              a = a.replace("minSdkVersion flutter.minSdkVersion", "minSdkVersion 21")
              a = re.sub(r'compileSdkVersion\s+flutter\.compileSdkVersion', 'compileSdkVersion 36', a)
              a = re.sub(r'targetSdkVersion\s+flutter\.targetSdkVersion', 'targetSdkVersion 34', a)
              with open("android/app/build.gradle", "w") as f:
                  f.write(a)

          if os.path.exists("android/build.gradle.kts"):
              with open("android/build.gradle.kts", "r") as f:
                  b = f.read()
              fix_kts = (
                  "\nsubprojects {\n"
                  "    afterEvaluate {\n"
                  "        val androidExt = project.extensions.findByName(\"android\")\n"
                  "        if (androidExt != null) {\n"
                  "            try {\n"
                  "                val m = androidExt.javaClass.getMethod(\"setCompileSdkVersion\", Int::class.javaPrimitiveType)\n"
                  "                m.invoke(androidExt, 36)\n"
                  "            } catch (e: Exception) {\n"
                  "                try {\n"
                  "                    val m2 = androidExt.javaClass.getMethod(\"compileSdkVersion\", Int::class.javaPrimitiveType)\n"
                  "                    m2.invoke(androidExt, 36)\n"
                  "                } catch (e2: Exception) {}\n"
                  "            }\n"
                  "        }\n"
                  "    }\n"
                  "}\n"
              )
              if "subprojects" not in b:
                  b += fix_kts
                  with open("android/build.gradle.kts", "w") as f:
                      f.write(b)

          if os.path.exists("android/build.gradle"):
              with open("android/build.gradle", "r") as f:
                  b = f.read()
              fix_groovy = (
                  "\nsubprojects {\n"
                  "    project.evaluationDependsOn(':app')\n"
                  "    afterEvaluate { project ->\n"
                  "        if (project.hasProperty('android')) {\n"
                  "            project.android {\n"
                  "                compileSdkVersion 36\n"
                  "            }\n"
                  "        }\n"
                  "    }\n"
                  "}\n"
              )
              if "compileSdkVersion 36" not in b:
                  b += fix_groovy
                  with open("android/build.gradle", "w") as f:
                      f.write(b)

          prop_path = "android/gradle.properties"
          if os.path.exists(prop_path):
              with open(prop_path, "a") as f:
                  f.write("\nandroid.useAndroidX=true\nandroid.enableJetifier=true\nandroid.suppressUnsupportedCompileSdk=34,35,36,37\n")
          print("Gradle patching done.")
          PY_GRADLE
          python3 update_gradle.py

      - name: Write Native Kotlin Files
        run: |
          mkdir -p prepwise_app/android/app/src/main/kotlin/com/prepwise/prepwise
          python3 -c "import sys, textwrap; sys.stdout.write(textwrap.dedent(sys.stdin.read()))" << 'KT_MAIN_EOF' > prepwise_app/android/app/src/main/kotlin/com/prepwise/prepwise/MainActivity.kt
          package com.prepwise.prepwise

          import android.app.AppOpsManager
          import android.app.usage.UsageEvents
          import android.app.usage.UsageStatsManager
          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.os.Handler
          import android.os.Looper
          import android.os.Process
          import android.provider.Settings
          import android.widget.Toast
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import org.json.JSONArray
          import org.json.JSONObject

          class MainActivity : FlutterActivity() {
              private val CHANNEL_APPS         = "com.prepwise/apps"
              private val CHANNEL_TOAST        = "com.prepwise/toast"
              private val CHANNEL_OVERLAY      = "com.prepwise/overlay"
              private val CHANNEL_BLOCKER      = "com.prepwise/accessibility"
              private val CHANNEL_FOCUS_SVC    = "com.prepwise/focusblocker"

              private var flutterEngineRef: FlutterEngine? = null

              // Broadcast receiver: FocusBlockerService -> MainActivity -> WebView bridge
              private val stopFocusReceiver = object : android.content.BroadcastReceiver() {
                  override fun onReceive(context: Context, intent: Intent) {
                      if (intent.action == "com.prepwise.ACTION_FOCUS_STOP_WEB_REQUEST") {
                          flutterEngineRef?.let { engine ->
                              io.flutter.plugin.common.MethodChannel(engine.dartExecutor.binaryMessenger, "com.prepwise/mainactivity")
                                  .invokeMethod("triggerStopFocusInWeb", null)
                          }
                      }
                  }
              }

              override fun onNewIntent(intent: Intent) {
                  super.onNewIntent(intent)
                  setIntent(intent)
              }

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  flutterEngineRef = flutterEngine

                  // Register broadcast receiver for focus stop relay
                  val filter = android.content.IntentFilter("com.prepwise.ACTION_FOCUS_STOP_WEB_REQUEST")
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      registerReceiver(stopFocusReceiver, filter, android.content.Context.RECEIVER_NOT_EXPORTED)
                  } else {
                      registerReceiver(stopFocusReceiver, filter)
                  }

                  // -- MainActivity Channel (relay bridge events to Dart) ---------------------
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "com.prepwise/mainactivity")
                      .setMethodCallHandler { _, _ -> } // Dart calls us; we call Dart - no incoming calls needed here

                  // -- Toast Channel ----------------------------------------------------------
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL_TOAST)
                      .setMethodCallHandler { call, result ->
                          if (call.method == "showToast") {
