name: Build PrepWise Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create Flutter App
        run: |
          flutter create --platforms=android --org com.prepwise --project-name prepwise prepwise_app
          cd prepwise_app
          flutter pub add \
            webview_flutter \
            webview_flutter_android \
            "wakelock_plus:^1.2.8" \
            url_launcher \
            permission_handler \
            firebase_core \
            firebase_messaging \
            "flutter_local_notifications:^17.2.4" \
            "google_sign_in:^6.2.2" \
            "open_filex:^4.5.0" \
            "http:^1.2.2" \
            "path_provider:^2.1.4"
          echo "" >> pubspec.yaml
          echo "dependency_overrides:" >> pubspec.yaml
          echo "  permission_handler_android: 12.0.13" >> pubspec.yaml
          echo "  flutter_local_notifications: 17.2.4" >> pubspec.yaml
          flutter pub get

      - name: Inject google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          python3 -c "import sys, textwrap; exec(textwrap.dedent(sys.stdin.read()))" << 'JSON_EOF'
          import os, sys, json
          raw_json = os.environ.get("GOOGLE_SERVICES_JSON", "").strip()
          if not raw_json:
              print("::error::GitHub Secret GOOGLE_SERVICES_JSON is empty or missing! Please add it in Repo Settings -> Secrets -> Actions.")
              sys.exit(1)

          try:
              parsed = json.loads(raw_json)
              print("google-services.json is valid JSON!")
          except Exception as e:
              print(f"::error::GOOGLE_SERVICES_JSON is not valid JSON! Error: {e}")
              sys.exit(1)

          target_path = "prepwise_app/android/app/google-services.json"
          os.makedirs(os.path.dirname(target_path), exist_ok=True)
          with open(target_path, "w", encoding="utf-8") as f:
              json.dump(parsed, f, indent=2)
          print(f"Successfully saved valid {target_path} ({os.path.getsize(target_path)} bytes)")
          JSON_EOF

