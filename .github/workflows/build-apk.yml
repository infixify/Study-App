                        allowedSet.add('com.prepwise.prepwise');
                        allowedSet.add('com.android.systemui');

                        blockedPackages = allApps
                            .map((a) => a['packageName']?.toString() ?? '')
                            .where((pkg) => pkg.isNotEmpty && !allowedSet.contains(pkg))
                            .toList();
                      } catch (_) {}
                    }

                    // Start single unified Kotlin FocusBlockerService (owns foreground notification + native overlay dot + timer)
                    try {
                      await const MethodChannel('com.prepwise/focusblocker').invokeMethod('startFocusBlocker', {
                        'blockedApps': blockedPackages,
                        'subject': subject,
                        'mode': mode,
                        'camEnabled': camEnabled,
