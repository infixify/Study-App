name: Build PrepWise Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create Flutter App
        run: |
          flutter create --platforms=android --org com.prepwise --project-name prepwise prepwise_app
          cd prepwise_app
          flutter pub add \
            webview_flutter \
            webview_flutter_android \
            "wakelock_plus:^1.2.8" \
            url_launcher \
            permission_handler \
            firebase_core \
            firebase_messaging \
            "flutter_local_notifications:^17.2.4" \
            "google_sign_in:^6.2.2" \
            "open_filex:^4.5.0" \
            "http:^1.2.2" \
            "path_provider:^2.1.4"
          echo "" >> pubspec.yaml
          echo "dependency_overrides:" >> pubspec.yaml
          echo "  permission_handler_android: 12.0.13" >> pubspec.yaml
          echo "  flutter_local_notifications: 17.2.4" >> pubspec.yaml
          flutter pub get

      - name: Inject google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          python3 -c "import sys, textwrap; exec(textwrap.dedent(sys.stdin.read()))" << 'JSON_EOF'
          import os, sys, json
          raw_json = os.environ.get("GOOGLE_SERVICES_JSON", "").strip()
          if not raw_json:
              print("::error::GitHub Secret GOOGLE_SERVICES_JSON is empty or missing! Please add it in Repo Settings -> Secrets -> Actions.")
              sys.exit(1)

          try:
              parsed = json.loads(raw_json)
              print("google-services.json is valid JSON!")
          except Exception as e:
              print(f"::error::GOOGLE_SERVICES_JSON is not valid JSON! Error: {e}")
              sys.exit(1)

          target_path = "prepwise_app/android/app/google-services.json"
          os.makedirs(os.path.dirname(target_path), exist_ok=True)
          with open(target_path, "w", encoding="utf-8") as f:
              json.dump(parsed, f, indent=2)
          print(f"Successfully saved valid {target_path} ({os.path.getsize(target_path)} bytes)")
          JSON_EOF

      - name: Configure Android Manifest and Permissions
        run: |
          cd prepwise_app
          python3 -c "import sys, textwrap; exec(textwrap.dedent(sys.stdin.read()))" << 'PY_MANIFEST'
          import os
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r", encoding="utf-8") as f:
              content = f.read()

          if 'xmlns:tools="http://schemas.android.com/tools"' not in content:
              content = content.replace('<manifest', '<manifest\n    xmlns:tools="http://schemas.android.com/tools"', 1)

          permissions = """
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.VIBRATE"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/>
              <uses-permission android:name="android.permission.PACKAGE_USAGE_STATS" tools:ignore="ProtectedPermissions"/>
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />
              <uses-feature android:name="android.hardware.microphone" android:required="false" />
              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
              </queries>
          """

          fcm_service = """
                  <service
                      android:name=".FocusBlockerService"
                      android:foregroundServiceType="specialUse"
                      android:exported="false" />
                  <receiver
                      android:name=".BootReceiver"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                      </intent-filter>
                  </receiver>
                  <service
                      android:name="io.flutter.plugins.firebase.messaging.FlutterFirebaseMessagingBackgroundService"
                      android:permission="android.permission.BIND_JOB_SERVICE"
                      android:exported="false" />
                  <service
                      android:name="io.flutter.plugins.firebase.messaging.FlutterFirebaseMessagingService"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="com.google.firebase.MESSAGING_EVENT" />
                      </intent-filter>
                  </service>
          """

          if "android.permission.INTERNET" not in content:
              content = content.replace("<application", permissions + "\n    <application", 1)

          if "FlutterFirebaseMessagingBackgroundService" not in content:
              content = content.replace("</application>", fcm_service + "\n    </application>")

          with open(manifest_path, "w", encoding="utf-8") as f:
              f.write(content)
          print("Clean Play-Protect-safe AndroidManifest.xml configured.")
          PY_MANIFEST

      - name: Patch Gradle Configurations (Google Services & Desugaring)
        run: |
          cd prepwise_app
          python3 -c "import sys, textwrap; sys.stdout.write(textwrap.dedent(sys.stdin.read()))" << 'PY_GRADLE' > update_gradle.py
          import re, os

          if os.path.exists("android/settings.gradle.kts"):
              with open("android/settings.gradle.kts", "r") as f:
                  s = f.read()
              plugin_line = '    id("com.google.gms.google-services") version "4.4.1" apply false\n'
              if "com.google.gms.google-services" not in s and "plugins {" in s:
                  s = s.replace("plugins {", "plugins {\n" + plugin_line, 1)
              with open("android/settings.gradle.kts", "w") as f:
                  f.write(s)
          elif os.path.exists("android/settings.gradle"):
              with open("android/settings.gradle", "r") as f:
                  s = f.read()
              plugin_line = "    id 'com.google.gms.google-services' version '4.4.1' apply false\n"
              if "com.google.gms.google-services" not in s and "plugins {" in s:
                  s = s.replace("plugins {", "plugins {\n" + plugin_line, 1)
              with open("android/settings.gradle", "w") as f:
                  f.write(s)

          if os.path.exists("android/app/build.gradle.kts"):
              with open("android/app/build.gradle.kts", "r") as f:
                  a = f.read()
              app_plugin = '    id("com.google.gms.google-services")\n'
              if "com.google.gms.google-services" not in a:
                  m = re.search(r'plugins\s*\{([^}]*)\}', a)
                  if m:
                      a = a[:m.end()-1] + app_plugin + a[m.end()-1:]
                  elif "plugins {" in a:
                      a = a.replace("plugins {", "plugins {\n" + app_plugin, 1)
              if "isCoreLibraryDesugaringEnabled" not in a:
                  a = a.replace("compileOptions {", "compileOptions {\n        isCoreLibraryDesugaringEnabled = true")
              if "coreLibraryDesugaring" not in a:
                  a += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
              a = a.replace("minSdk = flutter.minSdkVersion", "minSdk = 21")
              a = a.replace("minSdkVersion = flutter.minSdkVersion", "minSdkVersion = 21")
              a = re.sub(r'compileSdk\s*=\s*flutter\.compileSdkVersion', 'compileSdk = 36', a)
              a = re.sub(r'compileSdkVersion\s*=\s*flutter\.compileSdkVersion', 'compileSdkVersion = 36', a)
              a = re.sub(r'targetSdk\s*=\s*flutter\.targetSdkVersion', 'targetSdk = 34', a)
              a = re.sub(r'targetSdkVersion\s*=\s*flutter\.targetSdkVersion', 'targetSdkVersion = 34', a)
              with open("android/app/build.gradle.kts", "w") as f:
                  f.write(a)
          elif os.path.exists("android/app/build.gradle"):
              with open("android/app/build.gradle", "r") as f:
                  a = f.read()
              if "apply plugin: 'com.google.gms.google-services'" not in a:
                  a += "\napply plugin: 'com.google.gms.google-services'\n"
              if "coreLibraryDesugaringEnabled" not in a:
                  a = a.replace("compileOptions {", "compileOptions {\n        coreLibraryDesugaringEnabled true")
              if "coreLibraryDesugaring" not in a:
                  a += "\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'\n}\n"
              a = a.replace("minSdkVersion flutter.minSdkVersion", "minSdkVersion 21")
              a = re.sub(r'compileSdkVersion\s+flutter\.compileSdkVersion', 'compileSdkVersion 36', a)
              a = re.sub(r'targetSdkVersion\s+flutter\.targetSdkVersion', 'targetSdkVersion 34', a)
              with open("android/app/build.gradle", "w") as f:
                  f.write(a)

          if os.path.exists("android/build.gradle.kts"):
              with open("android/build.gradle.kts", "r") as f:
                  b = f.read()
              fix_kts = (
                  "\nsubprojects {\n"
                  "    afterEvaluate {\n"
                  "        val androidExt = project.extensions.findByName(\"android\")\n"
                  "        if (androidExt != null) {\n"
                  "            try {\n"
                  "                val m = androidExt.javaClass.getMethod(\"setCompileSdkVersion\", Int::class.javaPrimitiveType)\n"
                  "                m.invoke(androidExt, 36)\n"
                  "            } catch (e: Exception) {\n"
                  "                try {\n"
                  "                    val m2 = androidExt.javaClass.getMethod(\"compileSdkVersion\", Int::class.javaPrimitiveType)\n"
                  "                    m2.invoke(androidExt, 36)\n"
                  "                } catch (e2: Exception) {}\n"
                  "            }\n"
                  "        }\n"
                  "    }\n"
                  "}\n"
              )
              if "subprojects" not in b:
                  b += fix_kts
                  with open("android/build.gradle.kts", "w") as f:
                      f.write(b)

          if os.path.exists("android/build.gradle"):
              with open("android/build.gradle", "r") as f:
                  b = f.read()
              fix_groovy = (
                  "\nsubprojects {\n"
                  "    project.evaluationDependsOn(':app')\n"
                  "    afterEvaluate { project ->\n"
                  "        if (project.hasProperty('android')) {\n"
                  "            project.android {\n"
                  "                compileSdkVersion 36\n"
                  "            }\n"
                  "        }\n"
                  "    }\n"
                  "}\n"
              )
              if "compileSdkVersion 36" not in b:
                  b += fix_groovy
                  with open("android/build.gradle", "w") as f:
                      f.write(b)

          prop_path = "android/gradle.properties"
          if os.path.exists(prop_path):
              with open(prop_path, "a") as f:
                  f.write("\nandroid.useAndroidX=true\nandroid.enableJetifier=true\nandroid.suppressUnsupportedCompileSdk=34,35,36,37\n")
          print("Gradle patching done.")
          PY_GRADLE
          python3 update_gradle.py

      - name: Write Native Kotlin Files
        run: |
          mkdir -p prepwise_app/android/app/src/main/kotlin/com/prepwise/prepwise
          python3 -c "import sys, textwrap; sys.stdout.write(textwrap.dedent(sys.stdin.read()))" << 'KT_MAIN_EOF' > prepwise_app/android/app/src/main/kotlin/com/prepwise/prepwise/MainActivity.kt
          package com.prepwise.prepwise

          import android.app.AppOpsManager
          import android.app.usage.UsageEvents
          import android.app.usage.UsageStatsManager
          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.os.Handler
          import android.os.Looper
          import android.os.Process
          import android.provider.Settings
          import android.widget.Toast
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import org.json.JSONArray
          import org.json.JSONObject

          class MainActivity : FlutterActivity() {
              private val CHANNEL_APPS         = "com.prepwise/apps"
              private val CHANNEL_TOAST        = "com.prepwise/toast"
              private val CHANNEL_OVERLAY      = "com.prepwise/overlay"
              private val CHANNEL_BLOCKER      = "com.prepwise/accessibility"
              private val CHANNEL_FOCUS_SVC    = "com.prepwise/focusblocker"

              override fun onNewIntent(intent: Intent) {
                  super.onNewIntent(intent)
                  setIntent(intent)
              }

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)

                  // ── Toast Channel ──────────────────────────────────────────────────────────
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL_TOAST)
                      .setMethodCallHandler { call, result ->
                          if (call.method == "showToast") {
                              Toast.makeText(applicationContext, call.argument<String>("message") ?: "", Toast.LENGTH_SHORT).show()
                              result.success(true)
                          } else result.notImplemented()
                      }

                  // ── Installed Apps Channel ─────────────────────────────────────────────────
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL_APPS)
                      .setMethodCallHandler { call, result ->
                          if (call.method == "getInstalledApps") {
                              try {
                                  val pm = packageManager
                                  val intent = Intent(Intent.ACTION_MAIN, null).addCategory(Intent.CATEGORY_LAUNCHER)
                                  val apps = pm.queryIntentActivities(intent, 0)
                                  val arr = JSONArray()
                                  for (app in apps) {
                                      arr.put(JSONObject().apply {
                                          put("name", app.loadLabel(pm).toString())
                                          put("packageName", app.activityInfo.packageName)
                                      })
                                  }
                                  result.success(arr.toString())
                              } catch (e: Exception) { result.error("APPS_ERROR", e.message, null) }
                          } else result.notImplemented()
                      }

                  // ── Overlay Permission Channel ─────────────────────────────────────────────
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL_OVERLAY)
                      .setMethodCallHandler { call, result ->
                          when (call.method) {
                              "canDrawOverlays" ->
                                  result.success(if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) Settings.canDrawOverlays(this) else true)
                              "requestOverlayPermission" -> {
                                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(this))
                                      startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                                  result.success(true)
                              }
                              else -> result.notImplemented()
                          }
                      }

                  // ── Usage Stats / Accessibility Channel ───────────────────────────────────
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL_BLOCKER)
                      .setMethodCallHandler { call, result ->
                          when (call.method) {
                              "isAccessibilityEnabled", "hasUsagePermission" ->
                                  result.success(hasUsageStatsPermission())
                              "openAccessibilitySettings", "openUsageSettings" -> {
                                  try {
                                      startActivity(Intent(Settings.ACTION_USAGE_ACCESS_SETTINGS))
                                      result.success(true)
                                  } catch (e: Exception) { result.error("SETTINGS_ERROR", e.message, null) }
                              }
                              // Legacy in-process blocker calls — kept for compatibility, no-op now
                              "setBlockedApps", "setBlockingEnabled" -> result.success(true)
                              else -> result.notImplemented()
                          }
                      }

                  // ── FocusBlockerService Channel ────────────────────────────────────────────
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL_FOCUS_SVC)
                      .setMethodCallHandler { call, result ->
                          when (call.method) {
                              "startFocusBlocker" -> {
                                  val blocked = call.argument<List<String>>("blockedApps") ?: emptyList()
                                  val subject = call.argument<String>("subject") ?: "General"
                                  val mode    = call.argument<String>("mode")    ?: "Study"
                                  val intent  = Intent(this, FocusBlockerService::class.java).apply {
                                      action = FocusBlockerService.ACTION_START
                                      putStringArrayListExtra(FocusBlockerService.EXTRA_BLOCKED_APPS, ArrayList(blocked))
                                      putExtra(FocusBlockerService.EXTRA_SUBJECT, subject)
                                      putExtra(FocusBlockerService.EXTRA_MODE, mode)
                                  }
                                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O)
                                      startForegroundService(intent)
                                  else
                                      startService(intent)
                                  result.success(true)
                              }
                              "stopFocusBlocker" -> {
                                  startService(Intent(this, FocusBlockerService::class.java).apply {
                                      action = FocusBlockerService.ACTION_STOP
                                  })
                                  result.success(true)
                              }
                              "updateBlockedApps" -> {
                                  val blocked = call.argument<List<String>>("blockedApps") ?: emptyList()
                                  startService(Intent(this, FocusBlockerService::class.java).apply {
                                      action = FocusBlockerService.ACTION_UPDATE_BLOCKED
                                      putStringArrayListExtra(FocusBlockerService.EXTRA_BLOCKED_APPS, ArrayList(blocked))
                                  })
                                  result.success(true)
                              }
                              "setCamStatus" -> {
                                  // Pause/resume Kotlin timer based on cam status from web
                                  val status = call.argument<String>("status") ?: "verified"
                                  startService(Intent(this, FocusBlockerService::class.java).apply {
                                      action = FocusBlockerService.ACTION_SET_CAM_STATUS
                                      putExtra(FocusBlockerService.EXTRA_CAM_STATUS, status)
                                  })
                                  result.success(true)
                              }
                              "getElapsedSeconds" -> {
                                  // Return current elapsed seconds from Kotlin service for sync
                                  result.success(FocusBlockerService.currentElapsedSeconds)
                              }
                              else -> result.notImplemented()
                          }
                      }
              }

              private fun hasUsageStatsPermission(): Boolean {
                  return try {
                      val appOps = getSystemService(Context.APP_OPS_SERVICE) as AppOpsManager
                      val mode = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q)
                          appOps.unsafeCheckOpNoThrow(AppOpsManager.OPSTR_GET_USAGE_STATS, Process.myUid(), packageName)
                      else
                          appOps.checkOpNoThrow(AppOpsManager.OPSTR_GET_USAGE_STATS, Process.myUid(), packageName)
                      mode == AppOpsManager.MODE_ALLOWED
                  } catch (e: Exception) { false }
              }
          }
          KT_MAIN_EOF

          python3 -c "import sys, textwrap; sys.stdout.write(textwrap.dedent(sys.stdin.read()))" << 'KT_SERVICE_EOF' > prepwise_app/android/app/src/main/kotlin/com/prepwise/prepwise/FocusBlockerService.kt
          package com.prepwise.prepwise

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.app.usage.UsageEvents
          import android.app.usage.UsageStatsManager
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.provider.Settings
          import android.view.Gravity
          import android.view.View
          import android.view.WindowManager
          import android.widget.LinearLayout
          import android.widget.TextView
          import androidx.core.app.NotificationCompat

          class FocusBlockerService : Service() {

              companion object {
                  const val ACTION_START          = "com.prepwise.ACTION_FOCUS_START"
                  const val ACTION_STOP           = "com.prepwise.ACTION_FOCUS_STOP"
                  const val ACTION_UPDATE_BLOCKED = "com.prepwise.ACTION_UPDATE_BLOCKED"
                  const val ACTION_SET_CAM_STATUS = "com.prepwise.ACTION_SET_CAM_STATUS"
                  const val EXTRA_BLOCKED_APPS    = "blocked_apps"
                  const val EXTRA_SUBJECT         = "subject"
                  const val EXTRA_MODE            = "mode"
                  const val EXTRA_CAM_STATUS      = "cam_status"
                  const val NOTIF_ID              = 9901
                  const val CHANNEL_ID            = "prepwise_focus_blocker"

                  // Shared elapsed seconds — readable from MainActivity for sync
                  @Volatile var currentElapsedSeconds: Int = 0
              }

              private val handler = Handler(Looper.getMainLooper())
              private var blockedApps: List<String> = emptyList()
              private var subject = "General"
              private var mode = "Study"
              // camPaused = true means cam lost — timer freezes (but service keeps running)
              private var camPaused = false

              // Overlay state
              private var windowManager: WindowManager? = null
              private var overlayView: View? = null
              private var lastBlockedPkg: String? = null
              private val overlayDismissHandler = Handler(Looper.getMainLooper())

              // Poll every 500ms — tick timer only when cam not paused
              private val tickRunnable = object : Runnable {
                  override fun run() {
                      if (!camPaused) {
                          currentElapsedSeconds++
                          if (currentElapsedSeconds % 2 == 0) updateNotification() // update notif every 2s
                      }
                      checkAndBlock()
                      handler.postDelayed(this, 500)
                  }
              }

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  windowManager = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  createNotificationChannel()
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  when (intent?.action) {
                      ACTION_START -> {
                          val apps = intent.getStringArrayListExtra(EXTRA_BLOCKED_APPS) ?: arrayListOf()
                          blockedApps = apps.toList()
                          subject = intent.getStringExtra(EXTRA_SUBJECT) ?: "General"
                          mode = intent.getStringExtra(EXTRA_MODE) ?: "Study"
                          currentElapsedSeconds = 0
                          camPaused = false
                          startForeground(NOTIF_ID, buildNotification())
                          handler.removeCallbacks(tickRunnable)
                          handler.post(tickRunnable)
                      }
                      ACTION_STOP -> {
                          handler.removeCallbacks(tickRunnable)
                          removeOverlay()
                          currentElapsedSeconds = 0
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.N) {
                              stopForeground(STOP_FOREGROUND_REMOVE)
                          } else {
                              @Suppress("DEPRECATION") stopForeground(true)
                          }
                          stopSelf()
                      }
                      ACTION_UPDATE_BLOCKED -> {
                          val apps = intent.getStringArrayListExtra(EXTRA_BLOCKED_APPS) ?: arrayListOf()
                          blockedApps = apps.toList()
                      }
                      ACTION_SET_CAM_STATUS -> {
                          val status = intent.getStringExtra(EXTRA_CAM_STATUS) ?: "verified"
                          camPaused = status != "verified"
                          // Update notification immediately to reflect paused state
                          updateNotification()
                      }
                  }
                  return START_STICKY
              }

              // ── Core blocking logic ─────────────────────────────────────────────────────

              private fun checkAndBlock() {
                  if (!hasUsagePermission()) return
                  val foreground = getForegroundPackage() ?: return
                  if (foreground == packageName) {
                      // User is in PrepWise — remove overlay if showing
                      if (overlayView != null) removeOverlay()
                      return
                  }
                  if (foreground == "com.android.systemui" || foreground == "com.android.launcher" ||
                      foreground.startsWith("com.google.android.inputmethod")) return

                  if (blockedApps.contains(foreground)) {
                      if (canDrawOverlay()) {
                          // Show hard overlay — blocks any interaction with the app below
                          showBlockingOverlay(foreground)
                      } else {
                          // Fallback: aggressive redirect without overlay permission
                          redirectToPrepWise()
                      }
                  } else {
                      // App is allowed — remove any stale overlay
                      if (overlayView != null) removeOverlay()
                  }
              }

              private fun canDrawOverlay(): Boolean =
                  Build.VERSION.SDK_INT < Build.VERSION_CODES.M || Settings.canDrawOverlays(this)

              private fun showBlockingOverlay(blockedPkg: String) {
                  if (overlayView != null && lastBlockedPkg == blockedPkg) return // already showing for same app
                  removeOverlay()
                  lastBlockedPkg = blockedPkg

                  val appName = try {
                      packageManager.getApplicationLabel(
                          packageManager.getApplicationInfo(blockedPkg, 0)
                      ).toString()
                  } catch (e: Exception) { blockedPkg }

                  // Build a full-screen overlay layout programmatically
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setBackgroundColor(Color.parseColor("#EF0F172A")) // dark navy, semi-opaque
                      setPadding(64, 64, 64, 64)
                  }

                  val lockIcon = TextView(this).apply {
                      text = "\uD83D\uDD12" // 🔒 emoji
                      textSize = 56f
                      gravity = Gravity.CENTER
                      setTextColor(Color.WHITE)
                  }

                  val titleText = TextView(this).apply {
                      text = "Focus Mode Active"
                      textSize = 22f
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                      typeface = android.graphics.Typeface.DEFAULT_BOLD
                      setPadding(0, 24, 0, 12)
                  }

                  val bodyText = TextView(this).apply {
                      text = "\"$appName\" is blocked during your study session.\nStay focused — you're doing great!"
                      textSize = 15f
                      setTextColor(Color.parseColor("#94A3B8"))
                      gravity = Gravity.CENTER
                      setPadding(0, 0, 0, 40)
                  }

                  val returnBtn = TextView(this).apply {
                      text = "Return to PrepWise \u2192"
                      textSize = 16f
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                      setPadding(48, 28, 48, 28)
                      background = android.graphics.drawable.GradientDrawable().apply {
                          setColor(Color.parseColor("#0D9488")) // teal
                          cornerRadius = 36f
                      }
                      setOnClickListener {
                          removeOverlay()
                          redirectToPrepWise()
                      }
                  }

                  layout.addView(lockIcon)
                  layout.addView(titleText)
                  layout.addView(bodyText)
                  layout.addView(returnBtn)

                  val overlayType = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O)
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                  else
                      @Suppress("DEPRECATION") WindowManager.LayoutParams.TYPE_SYSTEM_ALERT

                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.MATCH_PARENT,
                      overlayType,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                          WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = 0; y = 0
                  }

                  try {
                      windowManager?.addView(layout, params)
                      overlayView = layout
                      // No auto-redirect — user taps "Return to PrepWise" when ready
                  } catch (e: Exception) {
                      // WindowManager failed — fall back to redirect
                      redirectToPrepWise()
                  }
              }

              private fun removeOverlay() {
                  overlayDismissHandler.removeCallbacksAndMessages(null)
                  overlayView?.let {
                      try { windowManager?.removeView(it) } catch (_: Exception) {}
                      overlayView = null
                      lastBlockedPkg = null
                  }
              }

              private fun redirectToPrepWise() {
                  val launch = packageManager.getLaunchIntentForPackage(packageName) ?: return
                  launch.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_REORDER_TO_FRONT)
                  startActivity(launch)
              }

              // ── Helpers ─────────────────────────────────────────────────────────────────

              private fun getForegroundPackage(): String? {
                  return try {
                      val usm = getSystemService(Context.USAGE_STATS_SERVICE) as UsageStatsManager
                      val now = System.currentTimeMillis()
                      val events = usm.queryEvents(now - 2000, now)
                      val event = UsageEvents.Event()
                      var pkg: String? = null
                      while (events.hasNextEvent()) {
                          events.getNextEvent(event)
                          if (event.eventType == UsageEvents.Event.ACTIVITY_RESUMED) {
                              pkg = event.packageName
                          }
                      }
                      pkg
                  } catch (e: Exception) { null }
              }

              private fun hasUsagePermission(): Boolean {
                  return try {
                      val appOps = getSystemService(Context.APP_OPS_SERVICE) as android.app.AppOpsManager
                      val mode = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q)
                          appOps.unsafeCheckOpNoThrow(android.app.AppOpsManager.OPSTR_GET_USAGE_STATS, android.os.Process.myUid(), packageName)
                      else
                          appOps.checkOpNoThrow(android.app.AppOpsManager.OPSTR_GET_USAGE_STATS, android.os.Process.myUid(), packageName)
                      mode == android.app.AppOpsManager.MODE_ALLOWED
                  } catch (e: Exception) { false }
              }

              // ── Notification ─────────────────────────────────────────────────────────────

              private fun buildNotification(): Notification {
                  val e = currentElapsedSeconds
                  val h = e / 3600
                  val m = (e % 3600) / 60
                  val s = e % 60
                  val time = if (h > 0) String.format("%02d:%02d:%02d", h, m, s) else String.format("%02d:%02d", m, s)
                  val statusText = if (camPaused) "⏸ Paused — come back into camera view" else "Distracting apps are blocked. Tap to open PrepWise."
                  val openIntent = Intent(this, MainActivity::class.java).apply {
                      flags = Intent.FLAG_ACTIVITY_SINGLE_TOP or Intent.FLAG_ACTIVITY_CLEAR_TOP
                  }
                  val pi = PendingIntent.getActivity(this, 0, openIntent, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                  val stopIntent = Intent(this, FocusBlockerService::class.java).apply { action = ACTION_STOP }
                  val stopPi = PendingIntent.getService(this, 1, stopIntent, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                  return NotificationCompat.Builder(this, CHANNEL_ID)
                      .setSmallIcon(android.R.drawable.ic_lock_idle_alarm)
                      .setContentTitle("Focus: $subject | $mode  $time")
                      .setContentText(statusText)
                      .setContentIntent(pi)
                      .setOngoing(true)
                      .setOnlyAlertOnce(true)
                      .setPriority(NotificationCompat.PRIORITY_LOW)
                      .addAction(android.R.drawable.ic_delete, "Stop", stopPi)
                      .build()
              }

              private fun updateNotification() {
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.notify(NOTIF_ID, buildNotification())
              }

              private fun createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val ch = NotificationChannel(CHANNEL_ID, "Focus Session Blocker", NotificationManager.IMPORTANCE_LOW).apply {
                          description = "Keeps focus session active and blocks distracting apps."
                          setShowBadge(false)
                      }
                      getSystemService(NotificationManager::class.java).createNotificationChannel(ch)
                  }
              }

              override fun onDestroy() {
                  handler.removeCallbacks(tickRunnable)
                  overlayDismissHandler.removeCallbacksAndMessages(null)
                  removeOverlay()
                  currentElapsedSeconds = 0
                  super.onDestroy()
              }
          }
          KT_SERVICE_EOF

