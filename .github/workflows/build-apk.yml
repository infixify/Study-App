                    final String accessToken = data['accessToken'] ?? '';
                    final String userId = data['userId'] ?? '';
                    if (accessToken.isNotEmpty && userId.isNotEmpty) {
                      try {
                        await const MethodChannel('com.prepwise/focusblocker')
                            .invokeMethod('storeSupabaseSession', {
                          'accessToken': accessToken,
                          'userId': userId,
                        });
                      } catch (_) {}
                    }
                    break;

                  case 'checkActiveSession':
                    try {
                      final activeMap = await const MethodChannel('com.prepwise/focusblocker')
                          .invokeMethod<Map<dynamic, dynamic>>('getActiveSession');
                      if (activeMap != null && activeMap['isActive'] == true) {
                        final int secs = activeMap['elapsedSeconds'] as int? ?? 0;
                        final String subj = activeMap['subject'] as String? ?? 'General';
                        final String md = activeMap['mode'] as String? ?? 'Study';
                        final bool cam = activeMap['camEnabled'] == true;
                        final bool blk = activeMap['blockerEnabled'] == true;

                        FocusSessionService().syncFromNative(
                          subject: subj,
                          mode: md,
                          elapsedSeconds: secs,
                          camEnabled: cam,
                          blockerEnabled: blk,
