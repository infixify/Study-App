          python3 -c "import sys, textwrap; sys.stdout.write(textwrap.dedent(sys.stdin.read()))" << 'DART_WEB_EOF' > prepwise_app/lib/screens/webview_screen.dart
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:permission_handler/permission_handler.dart';
          import 'package:webview_flutter/webview_flutter.dart';
          import 'package:webview_flutter_android/webview_flutter_android.dart';
          import 'package:url_launcher/url_launcher.dart';
          import '../bridge/app_bridge_handler.dart';
          import '../services/notification_service.dart';
          import '../services/app_blocker_service.dart';
          import '../services/pdf_download_service.dart';
          import '../services/focus_session_service.dart';
          import '../widgets/floating_focus_dot.dart';
          import '../services/app_toast.dart';

          class WebViewScreen extends StatefulWidget {
            const WebViewScreen({super.key});
            @override
            State<WebViewScreen> createState() => _WebViewScreenState();
          }

          class _WebViewScreenState extends State<WebViewScreen> with WidgetsBindingObserver {
            late final WebViewController _controller;
            late final AppBridgeHandler _bridgeHandler;

            bool _isLoading = true;
            double _progress = 0.0;
            bool _hasError = false;
            DateTime? _lastBackPressTime;
            static const _appsChannel = MethodChannel('com.prepwise/apps');

            static const String appUrl = "https://study-app-infixify1.vercel.app";

            @override
            void initState() {
              super.initState();
              WidgetsBinding.instance.addObserver(this);
              _requestStartupPermissions();
              _initWebView();
              _initNotifications();
            }

            Future<void> _requestStartupPermissions() async {
              try {
                // Prompt user for Camera, Microphone, and Notification permissions at launch
                // so Camera Verified Focus Mode and Alerts work without background failure.
                await [
                  Permission.camera,
                  Permission.microphone,
                  Permission.notification,
                ].request();
              } catch (e) {
                debugPrint("Startup permissions error: $e");
              }
            }

            void _initWebView() {
              late final PlatformWebViewControllerCreationParams params;
              if (WebViewPlatform.instance is AndroidWebViewPlatform) {
                params = AndroidWebViewControllerCreationParams();
              } else {
                params = const PlatformWebViewControllerCreationParams();
              }

              final WebViewController controller = WebViewController.fromPlatformCreationParams(params);

              controller
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..setBackgroundColor(const Color(0xFF0F172A))
                ..setUserAgent("Mozilla/5.0 (Linux; Android 14; Mobile) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Mobile Safari/537.36")
                ..setNavigationDelegate(NavigationDelegate(
                  onProgress: (int progress) => setState(() => _progress = progress / 100.0),
                  onPageStarted: (String url) => setState(() { _isLoading = true; _hasError = false; }),
                  onPageFinished: (String url) {
                    setState(() => _isLoading = false);
                    controller.runJavaScript("""
                      (function(){
                        if(!window.AppBridge){
                          window.AppBridge = {
                            postMessage: function(msg) {
                              if(window.FlutterBridge) {
                                window.FlutterBridge.postMessage(typeof msg === 'string' ? msg : JSON.stringify(msg));
                              }
                            }
                          };
                        }
                      })();
                    """);
                    final token = NotificationService().fcmToken;
                    if (token != null) _bridgeHandler.injectFCMToken(token);
                    _injectInstalledApps();
                  },
                  onWebResourceError: (WebResourceError error) {
                    if (error.isForMainFrame ?? true) setState(() { _hasError = true; _isLoading = false; });
                  },
                  onNavigationRequest: (NavigationRequest request) {
                    final url = request.url;

                    // 1. Intercept non-http protocols
                    if (url.startsWith('intent://') || url.startsWith('tel:') || url.startsWith('mailto:') || url.startsWith('whatsapp:') || url.startsWith('market:')) {
                      try { launchUrl(Uri.parse(url), mode: LaunchMode.externalApplication); } catch (_) {}
                      return NavigationDecision.prevent;
                    }

                    // 2. Intercept NCERT and other PDF downloads
                    if (url.toLowerCase().endsWith('.pdf') ||
                        url.contains('application/pdf') ||
                        url.contains('ncert.nic.in/textbook/pdf')) {
                      PdfDownloadService.downloadAndOpenPdf(url);
                      return NavigationDecision.prevent;
                    }

                    // Allow all normal web navigation including Google OAuth (accounts.google.com) and Supabase
                    return NavigationDecision.navigate;
                  },
                ));

              if (controller.platform is AndroidWebViewController) {
                AndroidWebViewController.enableDebugging(false);
                final androidController = controller.platform as AndroidWebViewController;
                androidController.setMediaPlaybackRequiresUserGesture(false);
                androidController.setOnPlatformPermissionRequest((request) => request.grant());
              }

              _bridgeHandler = AppBridgeHandler(webViewController: controller);
              controller.addJavaScriptChannel('FlutterBridge', onMessageReceived: _bridgeHandler.handleMessage);
              controller.loadRequest(Uri.parse(appUrl));
              _controller = controller;
            }

            Future<void> _injectInstalledApps() async {
              try {
                final String jsonStr = await _appsChannel.invokeMethod('getInstalledApps');
                final escaped = jsonStr.replaceAll("'", "\\'");
                await _controller.runJavaScript("window.__nativeInstalledApps=JSON.parse('$escaped');if(window.onInstalledAppsReady)window.onInstalledAppsReady(window.__nativeInstalledApps);");
              } catch (e) {
                debugPrint('InstalledApps injection error: $e');
              }
            }

            void _initNotifications() {
              NotificationService().initialize(
                onTokenReady: (token) { if (!_isLoading) _bridgeHandler.injectFCMToken(token); },
                onNotificationClick: (payload) => _bridgeHandler.handleNotificationClick(payload),
                onFocusStopAction: () => _bridgeHandler.triggerInAppStopConfirmation(),
              );
            }

            @override
            void didChangeAppLifecycleState(AppLifecycleState state) {
              if (state == AppLifecycleState.paused || state == AppLifecycleState.inactive) {
                AppBlockerService().onAppExitedToBackground();
              }
            }

            @override
            void dispose() {
              WidgetsBinding.instance.removeObserver(this);
              super.dispose();
            }

            Future<void> _handlePopScope(bool didPop) async {
              if (didPop) return;
              if (await _controller.canGoBack()) {
                await _controller.goBack();
                return;
              }
              final now = DateTime.now();
              if (_lastBackPressTime == null || now.difference(_lastBackPressTime!) > const Duration(seconds: 2)) {
                _lastBackPressTime = now;
                AppToast.show("Press back again to exit PrepWise");
                return;
              }
              Navigator.of(context).pop();
            }

            @override
            Widget build(BuildContext context) {
              return PopScope(
                canPop: false,
                onPopInvokedWithResult: (didPop, result) => _handlePopScope(didPop),
                child: Scaffold(
                  backgroundColor: const Color(0xFF0F172A),
                  body: SafeArea(
                    child: Stack(children: [
                      RefreshIndicator(
                        color: const Color(0xFF0D9488),
                        backgroundColor: const Color(0xFF1E293B),
                        onRefresh: () async => await _controller.reload(),
                        child: WebViewWidget(controller: _controller),
                      ),
                      if (_isLoading && _progress < 1.0)
                        Positioned(
                          top: 0, left: 0, right: 0,
                          child: LinearProgressIndicator(
                            value: _progress,
                            backgroundColor: Colors.transparent,
                            valueColor: const AlwaysStoppedAnimation<Color>(Color(0xFF0D9488)),
                            minHeight: 2.5,
                          ),
                        ),
                      if (_hasError)
                        Container(
                          color: const Color(0xFF0F172A),
                          width: double.infinity,
                          height: double.infinity,
                          padding: const EdgeInsets.all(24),
                          child: Column(mainAxisAlignment: MainAxisAlignment.center, children: [
                            const Icon(Icons.wifi_off_rounded, size: 64, color: Color(0xFFF59E0B)),
                            const SizedBox(height: 16),
                            const Text("Connection Interrupted", style: TextStyle(color: Colors.white, fontSize: 18, fontWeight: FontWeight.bold)),
                            const SizedBox(height: 8),
                            const Text("Unable to connect to PrepWise servers. Check your internet connection.", textAlign: TextAlign.center, style: TextStyle(color: Color(0xFF94A3B8), fontSize: 13)),
                            const SizedBox(height: 24),
                            ElevatedButton.icon(
                              style: ElevatedButton.styleFrom(
                                backgroundColor: const Color(0xFF0D9488),
                                foregroundColor: Colors.white,
                                padding: const EdgeInsets.symmetric(horizontal: 24, vertical: 12),
                                shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(12)),
                              ),
                              onPressed: () { setState(() { _hasError = false; _isLoading = true; }); _controller.loadRequest(Uri.parse(appUrl)); },
                              icon: const Icon(Icons.refresh_rounded),
                              label: const Text("Retry Connection", style: TextStyle(fontWeight: FontWeight.bold)),
                            ),
                          ]),
                        ),
                      const FloatingFocusDot(),
                    ]),
                  ),
                ),
              );
            }
          }
          DART_WEB_EOF

