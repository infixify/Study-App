              private fun formatElapsed(secs: Int): String {
                  val h = secs / 3600; val m = (secs % 3600) / 60; val s = secs % 60
                  return if (h > 0) String.format("%02d:%02d:%02d", h, m, s) else String.format("%02d:%02d", m, s)
              }

              private fun expandNativeDot() {
                  dotExpanded = true
                  val container = dotView ?: return
                  container.findViewWithTag<android.view.View>("compact")?.visibility = View.GONE
                  container.findViewWithTag<android.view.View>("expanded")?.visibility = View.VISIBLE
                  // Resize WindowManager params to fit card
                  dotParams?.let { p ->
                      val density = resources.displayMetrics.density
                      p.width = (260 * density).toInt()
                      p.height = android.widget.FrameLayout.LayoutParams.WRAP_CONTENT
                      p.flags = p.flags and WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE.inv()
                      try { windowManager?.updateViewLayout(container, p) } catch (_: Exception) {}
                  }
              }

              private fun collapseNativeDot() {
                  dotExpanded = false
                  val container = dotView ?: return
                  container.findViewWithTag<android.view.View>("compact")?.visibility = View.VISIBLE
                  container.findViewWithTag<android.view.View>("expanded")?.visibility = View.GONE
                  val px = (44 * resources.displayMetrics.density).toInt()
                  dotParams?.let { p ->
                      p.width = px; p.height = px
                      p.flags = p.flags or WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                      try { windowManager?.updateViewLayout(container, p) } catch (_: Exception) {}
                  }
              }

              private fun showFloatingDot() {
                  if (dotView != null) return
                  val density = resources.displayMetrics.density
                  val px = (44 * density).toInt()

                  val dot = buildDotView()

                  // Touch: tap = expand/collapse, drag = reposition
                  var startX = 0f; var startY = 0f
                  var initialX = 0; var initialY = 0
                  var moved = false
                  dot.setOnTouchListener { v, event ->
                      val p = dotParams ?: return@setOnTouchListener false
                      when (event.action) {
                          android.view.MotionEvent.ACTION_DOWN -> {
                              startX = event.rawX; startY = event.rawY
                              initialX = p.x; initialY = p.y
                              moved = false; true
                          }
                          android.view.MotionEvent.ACTION_MOVE -> {
                              val dx = (event.rawX - startX).toInt()
                              val dy = (event.rawY - startY).toInt()
                              if (Math.abs(dx) > 8 || Math.abs(dy) > 8) {
                                  moved = true
                                  p.x = initialX + dx; p.y = initialY + dy
                                  try { windowManager?.updateViewLayout(v, p) } catch (_: Exception) {}
                              }
                              true
                          }
                          android.view.MotionEvent.ACTION_UP -> {
                              if (!moved) {
                                  if (dotExpanded) collapseNativeDot() else expandNativeDot()
                              }
                              true
                          }
                          else -> false
                      }
                  }

                  val overlayType = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O)
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                  else
                      @Suppress("DEPRECATION") WindowManager.LayoutParams.TYPE_SYSTEM_ALERT

                  val params = WindowManager.LayoutParams(
                      px, px, overlayType,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = 24; y = 180
                  }

                  try {
                      windowManager?.addView(dot, params)
                      dotView = dot
                      dotParams = params
                  } catch (_: Exception) {}
              }

              private fun updateFloatingDotColor() {
                  val container = dotView ?: return
                  val color = if (camVerified) Color.parseColor("#10B981") else Color.parseColor("#EF4444")
                  // Update compact circle color
                  val compact = container.findViewWithTag<android.widget.FrameLayout>("compact")
                  (compact?.getChildAt(0)?.background as? android.graphics.drawable.GradientDrawable)?.setColor(color)
                  // Update expanded status dot + text
                  container.findViewWithTag<android.view.View>("statusDot")?.let {
                      (it.background as? android.graphics.drawable.GradientDrawable)?.setColor(color)
                  }
                  container.findViewWithTag<TextView>("statusTv")?.let {
                      it.text = if (camVerified) "\u2713 $mode - Cam Verified" else "\u23F8 $mode - Cam Lost"
                      it.setTextColor(color)
                  }
              }

              private fun updateDotTimer() {
                  val container = dotView ?: return
                  container.findViewWithTag<TextView>("timerTv")?.text = formatElapsed(currentElapsedSeconds)
              }

              private fun showDotView() {
                  dotView?.let { if (it.visibility != View.VISIBLE) it.visibility = View.VISIBLE }
                      ?: run { if (canDrawOverlay()) showFloatingDot() }
              }

              private fun hideDotView() {
                  dotView?.visibility = View.GONE
              }

              private fun removeFloatingDot() {
                  dotView?.let {
                      try { windowManager?.removeView(it) } catch (_: Exception) {}
                      dotView = null
                      dotParams = null
                  }
              }

              private fun redirectToPrepWise() {
                  val launch = packageManager.getLaunchIntentForPackage(packageName) ?: return
                  launch.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_REORDER_TO_FRONT)
                  startActivity(launch)
              }

              // -- Helpers -----------------------------------------------------------------

              private fun getForegroundPackage(): String? {
                  return try {
                      val usm = getSystemService(Context.USAGE_STATS_SERVICE) as UsageStatsManager
                      val now = System.currentTimeMillis()
                      val events = usm.queryEvents(now - 2000, now)
                      val event = UsageEvents.Event()
                      var pkg: String? = null
                      while (events.hasNextEvent()) {
                          events.getNextEvent(event)
                          if (event.eventType == UsageEvents.Event.ACTIVITY_RESUMED) {
                              pkg = event.packageName
                          }
                      }
                      pkg
                  } catch (e: Exception) { null }
              }

              private fun hasUsagePermission(): Boolean {
                  return try {
                      val appOps = getSystemService(Context.APP_OPS_SERVICE) as android.app.AppOpsManager
                      val mode = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q)
                          appOps.unsafeCheckOpNoThrow(android.app.AppOpsManager.OPSTR_GET_USAGE_STATS, android.os.Process.myUid(), packageName)
                      else
                          appOps.checkOpNoThrow(android.app.AppOpsManager.OPSTR_GET_USAGE_STATS, android.os.Process.myUid(), packageName)
                      mode == android.app.AppOpsManager.MODE_ALLOWED
                  } catch (e: Exception) { false }
              }

              // -- Notification -------------------------------------------------------------

              private fun buildNotification(): Notification {
                  val e = currentElapsedSeconds
                  val h = e / 3600
                  val m = (e % 3600) / 60
                  val s = e % 60
                  val time = if (h > 0) String.format("%02d:%02d:%02d", h, m, s) else String.format("%02d:%02d", m, s)
                  val statusText = if (camPaused) "Paused - come back into camera view" else "Distracting apps are blocked. Tap to open PrepWise."
                  val openIntent = Intent(this, MainActivity::class.java).apply {
                      flags = Intent.FLAG_ACTIVITY_SINGLE_TOP or Intent.FLAG_ACTIVITY_CLEAR_TOP
                  }
                  val pi = PendingIntent.getActivity(this, 0, openIntent, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                  val stopReqIntent = Intent(this, FocusBlockerService::class.java).apply { action = ACTION_STOP_REQUEST }
                  val stopPi = PendingIntent.getService(this, 1, stopReqIntent, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                  return NotificationCompat.Builder(this, CHANNEL_ID)
                      .setSmallIcon(android.R.drawable.ic_lock_idle_alarm)
                      .setContentTitle("Focus: $subject | $mode  $time")
                      .setContentText(statusText)
                      .setContentIntent(pi)
                      .setOngoing(true)
                      .setOnlyAlertOnce(true)
                      .setPriority(NotificationCompat.PRIORITY_LOW)
                      .addAction(android.R.drawable.ic_delete, "Stop Focus Mode", stopPi)
                      .build()
              }

              private fun updateNotification() {
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.notify(NOTIF_ID, buildNotification())
              }

              private fun createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val ch = NotificationChannel(CHANNEL_ID, "Focus Session Blocker", NotificationManager.IMPORTANCE_LOW).apply {
                          description = "Keeps focus session active and blocks distracting apps."
                          setShowBadge(false)
                      }
                      getSystemService(NotificationManager::class.java).createNotificationChannel(ch)
                  }
              }

              // -- Stop Request -> Web App ------------------------------------------------
              // When user taps "Stop Focus Mode" in notification, we do not kill the service
              // immediately - instead we signal the web app to run the full stop+log flow.
              // The web app calls stopFocusNotification which then sends ACTION_STOP.
              private fun sendStopRequestToWebApp() {
                  // Try to signal via broadcast to MainActivity which relays to WebView bridge
                  val intent = Intent("com.prepwise.ACTION_FOCUS_STOP_WEB_REQUEST")
                  intent.setPackage(packageName)
                  sendBroadcast(intent)

                  // Also bring PrepWise to foreground so user sees the log popup
                  val launch = packageManager.getLaunchIntentForPackage(packageName)
                  if (launch != null) {
                      launch.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_SINGLE_TOP or Intent.FLAG_ACTIVITY_CLEAR_TOP)
                      startActivity(launch)
                  }
              }

              override fun onDestroy() {
                  handler.removeCallbacks(tickRunnable)
                  overlayDismissHandler.removeCallbacksAndMessages(null)
                  removeOverlay()
                  removeFloatingDot()
                  currentElapsedSeconds = 0
                  super.onDestroy()
              }
          }
          KT_SERVICE_EOF

