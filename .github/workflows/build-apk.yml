                          if (path.includes('/focus') || (document.body && document.body.innerText.includes('Focus Mode'))) {
                            if (window.AppBridge) {
                              window.AppBridge.postMessage(JSON.stringify({action: 'checkActiveSession'}));
                            }
                          }
                          syncDashboardTodayStudy();
                          syncLeaderboardStrictHours();
                        }

                        if (!window.__routeHookAttached) {
                          window.__routeHookAttached = true;
                          var origPush = history.pushState;
                          history.pushState = function() {
                            origPush.apply(this, arguments);
                            setTimeout(handleRouteChange, 80);
                          };
                          var origReplace = history.replaceState;
                          history.replaceState = function() {
                            origReplace.apply(this, arguments);
                            setTimeout(handleRouteChange, 80);
                          };
                          window.addEventListener('popstate', function() {
                            setTimeout(handleRouteChange, 80);
                          });
                        }

                        // 3. Rename "Today Focus" to "Today Study" and ensure combined study time is displayed
                        function syncDashboardTodayStudy() {
                          document.querySelectorAll('span, div, p').forEach(function(el) {
                            if (el.children.length === 0 && (el.innerText || el.textContent || '').trim() === 'Today Focus') {
                              el.innerText = 'Today Study';
                              el.textContent = 'Today Study';
                            }
                          });
                        }

                        // 4. Leaderboard: show strictly verified study hours (both toggles ON) for current user
                        function syncLeaderboardStrictHours() {
                          if (!window.location.pathname.includes('/leaderboard')) return;
                          try {
                            var raw = localStorage.getItem('prepwise_strict_sessions') || '[]';
                            var list = JSON.parse(raw);
                            var now = Date.now();
                            var weekMs = 7 * 24 * 60 * 60 * 1000;
                            var strictSecs = 0;
                            for (var i = 0; i < list.length; i++) {
                              var it = list[i];
                              if (it.timestamp && (now - it.timestamp) < weekMs) {
                                strictSecs += (it.seconds || 0);
                              }
                            }
                            var strictH = (strictSecs / 3600).toFixed(1);

                            document.querySelectorAll('div').forEach(function(card) {
                              var t = card.innerText || card.textContent || '';
                              if (t.includes('(You)') && t.includes('this week')) {
                                card.querySelectorAll('p').forEach(function(p) {
                                  var pt = p.innerText || p.textContent || '';
                                  if (pt.includes('day streak') && pt.includes('this week')) {
                                    var spl = pt.split('\u00B7');
                                    if (spl.length >= 2) {
                                      p.innerText = spl[0].trim() + ' \u00B7 ' + strictH + 'h verified this week';
                                    }
                                  }
                                });
                              }
                            });
                          } catch(e) {}
                        }

                        syncDashboardTodayStudy();
                        syncLeaderboardStrictHours();

                        if (!window.__prepwiseDomSyncObserver) {
                          window.__prepwiseDomSyncObserver = new MutationObserver(function() {
                            syncDashboardTodayStudy();
                            syncLeaderboardStrictHours();
                          });
                          window.__prepwiseDomSyncObserver.observe(document.body, { childList: true, subtree: true });
                        }
                      })();
                    """);

                    // Sync active session if running in background/foreground
                    await _checkAndSyncActiveSession();

                    // Check if a session was stopped & saved directly while in background or dead and log to Supabase
                    await _checkAndLogPendingSessions();
                  },
                  onWebResourceError: (WebResourceError error) {
                    if (error.isForMainFrame ?? true) {
                      setState(() {
                        _hasError = true;
                        _isLoading = false;
                      });
                    }
                  },
                  onNavigationRequest: (NavigationRequest request) {
                    final url = request.url;

                    // 1. Intercept non-http protocols
                    if (url.startsWith('intent://') || url.startsWith('tel:') || url.startsWith('mailto:') || url.startsWith('whatsapp:') || url.startsWith('market:')) {
                      try {
                        launchUrl(Uri.parse(url), mode: LaunchMode.externalApplication);
                      } catch (_) {}
                      return NavigationDecision.prevent;
                    }

                    // 2. Intercept NCERT, direct PDFs, and Google Docs Viewer PDF requests
                    if (url.toLowerCase().endsWith('.pdf') ||
                        url.contains('application/pdf') ||
                        url.contains('ncert.nic.in/textbook/pdf') ||
                        (url.contains('docs.google.com/viewer') && (url.contains('ncert.nic.in') || url.contains('.pdf')))) {
                      String targetPdf = url;
                      if (url.contains('docs.google.com/viewer')) {
                        final parsed = Uri.tryParse(url);
                        targetPdf = parsed?.queryParameters['url'] ?? url;
                      }
                      PdfDownloadService.downloadAndOpenPdf(targetPdf);
                      return NavigationDecision.prevent;
                    }

                    // Allow all normal web navigation including Google OAuth and Supabase
                    return NavigationDecision.navigate;
                  },
                ))
                ..addJavaScriptChannel(
                  'FlutterBridge',
                  onMessageReceived: (JavaScriptMessage message) {
                    _bridgeHandler.handleMessage(message);
                  },
                )
                ..addJavaScriptChannel(
                  'AppBridge',
                  onMessageReceived: (JavaScriptMessage message) {
                    _bridgeHandler.handleMessage(message);
                  },
                );

              if (controller.platform is AndroidWebViewController) {
                AndroidWebViewController.enableDebugging(false);
                final androidController = controller.platform as AndroidWebViewController;
                androidController.setMediaPlaybackRequiresUserGesture(false);
              }

              _controller = controller;
              _bridgeHandler = AppBridgeHandler(webViewController: _controller);
              _controller.loadRequest(Uri.parse(appUrl));
            }

            Future<void> _injectInstalledApps() async {
              try {
                final String appsJson = await _appsChannel.invokeMethod('getInstalledApps');
                await _controller.runJavaScript("""
                  (function() {
                    try {
                      var raw = $appsJson;
                      window.__nativeInstalledApps = Array.isArray(raw) ? raw : JSON.parse(raw);
                      if (typeof window.onInstalledAppsReady === 'function') {
                        window.onInstalledAppsReady(window.__nativeInstalledApps);
                      }
                    } catch(e) {}
                  })();
                """);
              } catch (_) {}
            }

            Future<void> _initNotifications() async {
              await NotificationService().initialize(
                onNotificationClick: (String payload) {
                  if (payload.isNotEmpty) {
                    _controller.runJavaScript("""
                      (function(){
                        if (typeof window.onNotificationDeepLink === 'function') {
                          window.onNotificationDeepLink('$payload');
                        }
                      })();
                    """);
                  }
                },
                onFocusStopAction: () {
                  _bridgeHandler.triggerInAppStopDirect();
                },
              );
            }

            Future<void> _checkAndSyncActiveSession() async {
              try {
                final active = await const MethodChannel('com.prepwise/focusblocker')
                    .invokeMethod<Map<dynamic, dynamic>>('getActiveSession');
                if (active != null && active['isActive'] == true) {
                  final int secs = active['elapsedSeconds'] as int? ?? 0;
                  final String subj = active['subject'] as String? ?? 'General';
                  final String md = active['mode'] as String? ?? 'Study';
                  final bool cam = active['camEnabled'] == true;
                  final bool blk = active['blockerEnabled'] == true;

                  FocusSessionService().syncFromNative(
                    subject: subj,
                    mode: md,
                    elapsedSeconds: secs,
                    camEnabled: cam,
                    blockerEnabled: blk,
                  );

                  _startPeriodicTimerSync();

                  await _controller.runJavaScript("""
                    (function(){
                      window.__activeNativeSession = {
                        subject: '$subj',
                        mode: '$md',
                        elapsedSeconds: $secs,
                        camEnabled: $cam,
                        blockerEnabled: $blk
                      };
                      if (typeof window.onNativeRestoreActiveSession === 'function') {
                        window.onNativeRestoreActiveSession(window.__activeNativeSession);
                      }
                      if (typeof window.onNativeFocusTimerSync === 'function') {
                        window.onNativeFocusTimerSync($secs);
                      }
                    })();
                  """);
                } else {
                  _stopPeriodicTimerSync();
                  FocusSessionService().stopSession();
                }
              } catch (_) {}
            }

            void _startPeriodicTimerSync() {
              _syncTimer?.cancel();
              _syncTimer = Timer.periodic(const Duration(seconds: 1), (_) async {
                try {
                  final int? secs = await const MethodChannel('com.prepwise/focusblocker')
                      .invokeMethod<int>('getElapsedSeconds');
                  if (secs != null && secs >= 0) {
                    _controller.runJavaScript("""
                      (function(){
                        if (window.__activeNativeSession) {
                          window.__activeNativeSession.elapsedSeconds = $secs;
                        }
                        if (typeof window.onNativeFocusTimerSync === 'function') {
                          window.onNativeFocusTimerSync($secs);
                        }
                      })();
                    """);
                  }
                } catch (_) {}
              });
            }

            void _stopPeriodicTimerSync() {
              _syncTimer?.cancel();
              _syncTimer = null;
            }

            // Pending session retry is handled entirely by Kotlin via retryPendingSession MethodChannel.
            // Kotlin shows a toast and logs directly to Supabase — no JS involved.
            Future<void> _checkAndLogPendingSessions() async {
              try {
                await const MethodChannel('com.prepwise/focusblocker')
                    .invokeMethod('retryPendingSession');
              } catch (e) {
                debugPrint("Error retrying pending session via Kotlin: $e");
              }
            }

            @override
            Widget build(BuildContext context) {
              return PopScope(
                canPop: false,
                onPopInvokedWithResult: (didPop, result) async {
                  if (didPop) return;
                  if (await _controller.canGoBack()) {
                    _controller.goBack();
                    return;
                  }
                  final now = DateTime.now();
                  if (_lastBackPressTime == null || now.difference(_lastBackPressTime!) > const Duration(seconds: 2)) {
                    _lastBackPressTime = now;
                    AppToast.show("Press back again to exit PrepWise");
                    return;
                  }
                  SystemNavigator.pop();
                },
                child: Scaffold(
                  backgroundColor: const Color(0xFF0F172A),
                  body: SafeArea(
                    child: Stack(
                      children: [
                        WebViewWidget(controller: _controller),
                        // Task 4: Isolated ValueListenableBuilder prevents whole-screen rebuilding on progress ticks
                        ValueListenableBuilder<double>(
                          valueListenable: _progressNotifier,
                          builder: (context, progress, _) {
                            if (progress >= 1.0 || !_isLoading) return const SizedBox.shrink();
                            return Positioned(
                              top: 0,
                              left: 0,
                              right: 0,
                              child: LinearProgressIndicator(
                                value: progress > 0 ? progress : null,
                                backgroundColor: Colors.transparent,
                                valueColor: const AlwaysStoppedAnimation<Color>(Color(0xFF0D9488)),
                                minHeight: 2.5,
                              ),
                            );
                          },
                        ),
                        if (_hasError)
                          Container(
                            color: const Color(0xFF0F172A),
                            child: Center(
                              child: Padding(
                                padding: const EdgeInsets.all(24.0),
                                child: Column(
                                  mainAxisSize: MainAxisSize.min,
                                  children: [
                                    const Icon(Icons.wifi_off_rounded, color: Colors.white70, size: 56),
                                    const SizedBox(height: 16),
                                    const Text(
                                      "Unable to load PrepWise",
                                      style: TextStyle(color: Colors.white, fontSize: 18, fontWeight: FontWeight.bold),
                                    ),
                                    const SizedBox(height: 8),
                                    const Text(
                                      "Please check your internet connection and try again.",
                                      textAlign: TextAlign.center,
                                      style: TextStyle(color: Colors.white60, fontSize: 13),
                                    ),
                                    const SizedBox(height: 24),
                                    ElevatedButton.icon(
                                      style: ElevatedButton.styleFrom(
                                        backgroundColor: const Color(0xFF0D9488),
                                        foregroundColor: Colors.white,
                                        padding: const EdgeInsets.symmetric(horizontal: 24, vertical: 12),
                                        shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(12)),
                                      ),
                                      onPressed: () {
                                        setState(() {
                                          _isLoading = true;
                                          _hasError = false;
                                        });
                                        _controller.reload();
                                      },
                                      icon: const Icon(Icons.refresh),
                                      label: const Text("Retry"),
                                    ),
                                  ],
                                ),
                              ),
                            ),
                          ),
                      ],
                    ),
                  ),
                ),
              );
            }
          }

          extension AppBridgeHandlerExtension on AppBridgeHandler {
            void injectFCMToken(String token) {
              webViewController.runJavaScript("""
                (function(){
                  try {
                    if (typeof window.onNativeFCMToken === 'function') {
                      window.onNativeFCMToken('$token');
                    }
                  } catch(e) {}
                })();
              """);
            }
          }
          DART_WEB_EOF

      - name: Accept Android Licenses and Ensure SDK 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" || true

      - name: Print SHA-1 Fingerprint (for Firebase + Google Cloud Console)
        run: |
          echo "=== DEBUG KEYSTORE SHA-1 (add this to Firebase + Google Cloud Console) ==="
          keytool -list -v \
            -keystore ~/.android/debug.keystore \
            -alias androiddebugkey \
            -storepass android \
            -keypass android 2>/dev/null | grep -A1 "SHA1:"
          echo "========================================================================"

      - name: Build Release APK
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          cd prepwise_app
          # Extract Web OAuth Client ID (client_type=3) from google-services.json for GoogleSignIn serverClientId
          GOOGLE_SERVER_CLIENT_ID=$(python3 -c "
          import json, os
          cid = os.environ.get('GOOGLE_WEB_CLIENT_ID', '').strip()
          if not cid and os.path.exists('android/app/google-services.json'):
              with open('android/app/google-services.json') as f:
                  d = json.load(f)
              clients = d.get('client', [{}])[0].get('oauth_client', [])
              cid = next((c.get('client_id', '') for c in clients if c.get('client_type') == 3), '')
          if not cid:
              cid = '759640583420-8scrqq26ucmjkpbkv52komi9f7s3og11.apps.googleusercontent.com'
          print(cid)
          ")
          echo "========================================================================"
          echo "Google Server Web Client ID: $GOOGLE_SERVER_CLIENT_ID"
          if [ -z "$GOOGLE_SERVER_CLIENT_ID" ]; then
              echo "WARNING: GOOGLE_SERVER_CLIENT_ID is empty! Google ID Token will not be generated on Android."
              echo "Ensure your google-services.json contains client_type: 3 OR set secret GOOGLE_WEB_CLIENT_ID."
          fi
          echo "========================================================================"
          flutter build apk --release --dart-define=GOOGLE_SERVER_CLIENT_ID=$GOOGLE_SERVER_CLIENT_ID

      - name: Verify Final Built APK Signing SHA-1
        continue-on-error: true
        run: |
          echo "========================================================================"
          echo "=== ACTUAL BUILT APK SIGNING CERTIFICATE SHA-1 ==="
          APK_FILE="prepwise_app/build/app/outputs/flutter-apk/app-release.apk"
          if [ -f "$APK_FILE" ]; then
              keytool -printcert -jarfile "$APK_FILE" 2>&1 | grep -iE "(SHA1|SHA-1)" || true
          fi
          echo "========================================================================"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: PrepWise-Android-APK
          path: prepwise_app/build/app/outputs/flutter-apk/app-release.apk



