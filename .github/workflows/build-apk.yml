name: Build PrepWise Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Flutter Wrapper & Build APK
        run: |
          flutter create --org com.prepwise --project-name prepwise prepwise_app
          cd prepwise_app
          flutter pub add webview_flutter webview_flutter_android wakelock_plus url_launcher permission_handler
          
          python3 -c "
          with open('android/app/src/main/AndroidManifest.xml') as f:
              c = f.read()
          perms = '''    <uses-permission android:name=\"android.permission.INTERNET\"/>
              <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\"/>
              <uses-permission android:name=\"android.permission.WAKE_LOCK\"/>
              <uses-permission android:name=\"android.permission.VIBRATE\"/>
              <uses-permission android:name=\"android.permission.CAMERA\"/>
              <uses-permission android:name=\"android.permission.RECORD_AUDIO\"/>
              <uses-permission android:name=\"android.permission.MODIFY_AUDIO_SETTINGS\"/>
              <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\"/>
              <uses-feature android:name=\"android.hardware.camera\" android:required=\"false\" />
              <uses-feature android:name=\"android.hardware.camera.autofocus\" android:required=\"false\" />
              <uses-feature android:name=\"android.hardware.microphone\" android:required=\"false\" />
          '''
          c = c.replace('<application', perms + '    <application')
          with open('android/app/src/main/AndroidManifest.xml', 'w') as f:
              f.write(c)
          "
          
          sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 21/g' android/app/build.gradle || true
          sed -i 's/minSdk = flutter.minSdk/minSdk = 21/g' android/app/build.gradle || true
          
          cat << 'DART_CODE' > lib/main.dart
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:webview_flutter/webview_flutter.dart';
          import 'package:webview_flutter_android/webview_flutter_android.dart';
          import 'package:wakelock_plus/wakelock_plus.dart';
          import 'package:url_launcher/url_launcher.dart';
          import 'package:permission_handler/permission_handler.dart';

          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            await SystemChrome.setPreferredOrientations([
              DeviceOrientation.portraitUp,
              DeviceOrientation.portraitDown,
            ]);
            runApp(const PrepWiseApp());
          }

          class PrepWiseApp extends StatelessWidget {
            const PrepWiseApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'PrepWise',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  scaffoldBackgroundColor: const Color(0xFF0F172A),
                ),
                home: const MainWebView(),
              );
            }
          }

          class MainWebView extends StatefulWidget {
            const MainWebView({super.key});

            @override
            State<MainWebView> createState() => _MainWebViewState();
          }

          class _MainWebViewState extends State<MainWebView> {
            late final WebViewController _controller;
            bool _isLoading = true;
            int _progress = 0;

            @override
            void initState() {
              super.initState();
              _requestAllPermissions();
              _setupWebView();
            }

            Future<void> _requestAllPermissions() async {
              try {
                await [
                  Permission.notification,
                  Permission.camera,
                  Permission.microphone,
                ].request();
              } catch (e) {
                debugPrint('Permission error: $e');
              }
            }

            void _setupWebView() {
              late final PlatformWebViewControllerCreationParams params;
              if (WebViewPlatform.instance is AndroidWebViewPlatform) {
                params = AndroidWebViewControllerCreationParams();
              } else {
                params = const PlatformWebViewControllerCreationParams();
              }

              final WebViewController controller =
                  WebViewController.fromPlatformCreationParams(params);

              controller
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..setBackgroundColor(const Color(0xFF0F172A))
                ..setNavigationDelegate(
                  NavigationDelegate(
                    onProgress: (p) => setState(() => _progress = p),
                    onPageStarted: (url) => setState(() => _isLoading = true),
                    onPageFinished: (url) {
                      setState(() => _isLoading = false);
                      _controller.runJavaScript('''
                        if (!window.AppBridge) {
                          window.AppBridge = {
                            postMessage: function(msg) {
                              if (window.FlutterBridge) {
                                window.FlutterBridge.postMessage(typeof msg === 'string' ? msg : JSON.stringify(msg));
                              }
                            }
                          };
                        }
                      ''');
                    },
                    onNavigationRequest: (request) {
                      final url = request.url;
                      if (url.startsWith('intent://') || url.startsWith('tel:') || url.startsWith('mailto:')) {
                        try {
                          launchUrl(Uri.parse(url), mode: LaunchMode.externalApplication);
                        } catch (_) {}
                        return NavigationDecision.prevent;
                      }
                      if (url.endsWith('.pdf')) {
                        launchUrl(Uri.parse(url), mode: LaunchMode.externalApplication);
                        return NavigationDecision.prevent;
                      }
                      return NavigationDecision.navigate;
                    },
                  ),
                )
                ..addJavaScriptChannel(
                  'FlutterBridge',
                  onMessageReceived: (JavaScriptMessage message) async {
                    try {
                      if (message.message.contains('startStrictTimer')) {
                        WakelockPlus.enable();
                        HapticFeedback.heavyImpact();
                      } else if (message.message.contains('stopStrictTimer')) {
                        WakelockPlus.disable();
                        HapticFeedback.vibrate();
                      } else if (message.message.contains('vibrate')) {
                        HapticFeedback.mediumImpact();
                      } else if (message.message.contains('requestCamera') || message.message.contains('requestPermissions')) {
                        await [Permission.camera, Permission.microphone].request();
                      }
                    } catch (e) {
                      debugPrint('Bridge error: $e');
                    }
                  },
                );

              if (controller.platform is AndroidWebViewController) {
                final androidController = controller.platform as AndroidWebViewController;
                androidController.setMediaPlaybackRequiresUserGesture(false);
                androidController.setOnPlatformPermissionRequest((request) {
                  request.grant();
                });
              }

              controller.loadRequest(Uri.parse('https://study-app-infixify1.vercel.app'));
              _controller = controller;
            }

            @override
            Widget build(BuildContext context) {
              return WillPopScope(
                onWillPop: () async {
                  if (await _controller.canGoBack()) {
                    _controller.goBack();
                    return false;
                  }
                  return true;
                },
                child: Scaffold(
                  backgroundColor: const Color(0xFF0F172A),
                  body: SafeArea(
                    child: Stack(
                      children: [
                        WebViewWidget(controller: _controller),
                        if (_isLoading)
                          LinearProgressIndicator(
                            value: _progress / 100.0,
                            backgroundColor: const Color(0xFF1E293B),
                            color: const Color(0xFF0D9488),
                            minHeight: 3,
                          ),
                      ],
                    ),
                  ),
                ),
              );
            }
          }
          DART_CODE

          flutter build apk --release

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: PrepWise-Android-APK
          path: prepwise_app/build/app/outputs/flutter-apk/app-release.apk
