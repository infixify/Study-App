name: Build PrepWise Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create Flutter App
        run: |
          flutter create --platforms=android --org com.prepwise --project-name prepwise prepwise_app
          cd prepwise_app
          flutter pub add \
            webview_flutter \
            webview_flutter_android \
            "wakelock_plus:^1.2.8" \
            url_launcher \
            permission_handler \
            firebase_core \
            firebase_messaging \
            "flutter_local_notifications:^17.2.4" \
            "google_sign_in:^6.2.2" \
            "open_filex:^4.5.0" \
            "http:^1.2.2" \
            "path_provider:^2.1.4" \
            "fluttertoast:^8.2.8"
          echo "" >> pubspec.yaml
          echo "dependency_overrides:" >> pubspec.yaml
          echo "  permission_handler_android: 12.0.13" >> pubspec.yaml
          echo "  flutter_local_notifications: 17.2.4" >> pubspec.yaml
          flutter pub get

      - name: Inject google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          python3 - << 'JSON_EOF'
          import os, sys, json

          raw_json = os.environ.get("GOOGLE_SERVICES_JSON", "").strip()
          if not raw_json:
              print("::error::GitHub Secret GOOGLE_SERVICES_JSON is empty or missing! Please add it in Repo Settings -> Secrets -> Actions.")
              sys.exit(1)

          try:
              parsed = json.loads(raw_json)
              print("google-services.json is valid JSON!")
          except Exception as e:
              print(f"::error::GOOGLE_SERVICES_JSON is not valid JSON! Error: {e}")
              sys.exit(1)

          target_path = "prepwise_app/android/app/google-services.json"
          os.makedirs(os.path.dirname(target_path), exist_ok=True)
          with open(target_path, "w", encoding="utf-8") as f:
              json.dump(parsed, f, indent=2)
          print(f"Successfully saved valid {target_path} ({os.path.getsize(target_path)} bytes)")
          JSON_EOF

      - name: Configure Android Manifest and Permissions
        run: |
          cd prepwise_app
          python3 - << 'PY_MANIFEST'
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r", encoding="utf-8") as f:
              content = f.read()

          permissions = """
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.VIBRATE"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES"/>
              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />
              <uses-feature android:name="android.hardware.microphone" android:required="false" />
          """

          fcm_service = """
                  <service
                      android:name="io.flutter.plugins.firebase.messaging.FlutterFirebaseMessagingBackgroundService"
                      android:permission="android.permission.BIND_JOB_SERVICE"
                      android:exported="false" />
                  <service
                      android:name="io.flutter.plugins.firebase.messaging.FlutterFirebaseMessagingService"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="com.google.firebase.MESSAGING_EVENT" />
                      </intent-filter>
                  </service>
          """

          if "android.permission.INTERNET" not in content:
              content = content.replace("<application", permissions + "\n    <application", 1)

          if "FlutterFirebaseMessagingBackgroundService" not in content:
              content = content.replace("</application>", fcm_service + "\n    </application>")

          with open(manifest_path, "w", encoding="utf-8") as f:
              f.write(content)
          print("AndroidManifest.xml successfully updated.")
          PY_MANIFEST

      - name: Patch Gradle Configurations (Google Services & Desugaring)
        run: |
          cd prepwise_app
          cat << 'PY_GRADLE' > update_gradle.py
          import re, os

          if os.path.exists("android/settings.gradle.kts"):
              with open("android/settings.gradle.kts", "r") as f:
                  s = f.read()
              plugin_line = '    id("com.google.gms.google-services") version "4.4.1" apply false\n'
              if "com.google.gms.google-services" not in s and "plugins {" in s:
                  s = s.replace("plugins {", "plugins {\n" + plugin_line, 1)
              with open("android/settings.gradle.kts", "w") as f:
                  f.write(s)
              print("settings.gradle.kts patched")
          elif os.path.exists("android/settings.gradle"):
              with open("android/settings.gradle", "r") as f:
                  s = f.read()
              plugin_line = "    id 'com.google.gms.google-services' version '4.4.1' apply false\n"
              if "com.google.gms.google-services" not in s and "plugins {" in s:
                  s = s.replace("plugins {", "plugins {\n" + plugin_line, 1)
              with open("android/settings.gradle", "w") as f:
                  f.write(s)
              print("settings.gradle patched")

          if os.path.exists("android/app/build.gradle.kts"):
              with open("android/app/build.gradle.kts", "r") as f:
                  a = f.read()
              app_plugin = '    id("com.google.gms.google-services")\n'
              if "com.google.gms.google-services" not in a:
                  m = re.search(r'plugins\s*\{([^}]*)\}', a)
                  if m:
                      a = a[:m.end()-1] + app_plugin + a[m.end()-1:]
                  elif "plugins {" in a:
                      a = a.replace("plugins {", "plugins {\n" + app_plugin, 1)

              if "isCoreLibraryDesugaringEnabled" not in a:
                  a = a.replace("compileOptions {", "compileOptions {\n        isCoreLibraryDesugaringEnabled = true")

              if "coreLibraryDesugaring" not in a:
                  a += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'

              a = a.replace("minSdk = flutter.minSdkVersion", "minSdk = 21")
              a = a.replace("minSdkVersion = flutter.minSdkVersion", "minSdkVersion = 21")
              with open("android/app/build.gradle.kts", "w") as f:
                  f.write(a)
              print("app/build.gradle.kts patched")
          elif os.path.exists("android/app/build.gradle"):
              with open("android/app/build.gradle", "r") as f:
                  a = f.read()
              if "apply plugin: 'com.google.gms.google-services'" not in a:
                  a += "\napply plugin: 'com.google.gms.google-services'\n"
              if "coreLibraryDesugaringEnabled" not in a:
                  a = a.replace("compileOptions {", "compileOptions {\n        coreLibraryDesugaringEnabled true")
              if "coreLibraryDesugaring" not in a:
                  a += "\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'\n}\n"
              a = a.replace("minSdkVersion flutter.minSdkVersion", "minSdkVersion 21")
              with open("android/app/build.gradle", "w") as f:
                  f.write(a)
              print("app/build.gradle patched")
          PY_GRADLE
          python3 update_gradle.py

      - name: Write Services and Widgets
        run: |
          mkdir -p prepwise_app/lib/services
          mkdir -p prepwise_app/lib/widgets

          cat << 'EOF' > prepwise_app/lib/services/google_auth_service.dart
          import 'package:flutter/foundation.dart';
          import 'package:google_sign_in/google_sign_in.dart';

          class GoogleAuthResult {
            final bool success;
            final String? idToken;
            final String? accessToken;
            final String? email;
            final String? displayName;
            final String? errorMessage;

            GoogleAuthResult({
              required this.success,
              this.idToken,
              this.accessToken,
              this.email,
              this.displayName,
              this.errorMessage,
            });
          }

          class GoogleAuthService {
            static final GoogleAuthService _instance = GoogleAuthService._internal();
            factory GoogleAuthService() => _instance;
            GoogleAuthService._internal();

            final GoogleSignIn _googleSignIn = GoogleSignIn(
              scopes: ['email', 'profile', 'openid'],
            );

            Future<GoogleAuthResult> signIn() async {
              try {
                debugPrint('[GoogleAuthService] Launching 1-Tap Google Account Picker...');
                await _googleSignIn.signOut();
                final GoogleSignInAccount? account = await _googleSignIn.signIn();
                if (account == null) {
                  return GoogleAuthResult(success: false, errorMessage: 'User cancelled Google Sign-In');
                }
                final GoogleSignInAuthentication auth = await account.authentication;
                return GoogleAuthResult(
                  success: true,
                  idToken: auth.idToken,
                  accessToken: auth.accessToken,
                  email: account.email,
                  displayName: account.displayName,
                );
              } catch (e) {
                debugPrint('[GoogleAuthService] Error: $e');
                return GoogleAuthResult(success: false, errorMessage: e.toString());
              }
            }
          }
          EOF

          cat << 'EOF' > prepwise_app/lib/services/focus_session_service.dart
          import 'dart:async';
          import 'package:flutter/foundation.dart';
          import 'package:flutter_local_notifications/flutter_local_notifications.dart';

          class FocusSessionService {
            static final FocusSessionService _instance = FocusSessionService._internal();
            factory FocusSessionService() => _instance;
            FocusSessionService._internal();

            static const int notificationId = 8801;
            static const String channelId = 'prepwise_focus_live_timer';
            static const String channelName = 'Active Focus Session';

            final FlutterLocalNotificationsPlugin _notifications = FlutterLocalNotificationsPlugin();

            bool _isSessionActive = false;
            String _subject = 'General';
            String _mode = 'Study';
            Timer? _tickerTimer;
            String _camStatus = 'verified';
            int _elapsedSeconds = 0;

            bool get isSessionActive => _isSessionActive;
            final ValueNotifier<String> camStatusNotifier = ValueNotifier<String>('verified');
            final ValueNotifier<int> elapsedNotifier = ValueNotifier<int>(0);
            final ValueNotifier<bool> activeNotifier = ValueNotifier<bool>(false);

            Function()? onStopRequested;

            Future<void> initializeNotificationChannel() async {
              const AndroidNotificationChannel channel = AndroidNotificationChannel(
                channelId,
                channelName,
                description: 'Live continuous notification during active Focus Mode study sessions.',
                importance: Importance.low,
                playSound: false,
                enableVibration: false,
                showBadge: false,
              );
              await _notifications
                  .resolvePlatformSpecificImplementation<AndroidFlutterLocalNotificationsPlugin>()
                  ?.createNotificationChannel(channel);
            }

            Future<void> startSession({
              required String subject,
              required String mode,
              int? initialSeconds,
              Function()? onStopClicked,
            }) async {
              _isSessionActive = true;
              _subject = subject.isNotEmpty ? subject : 'General';
              _mode = mode.isNotEmpty ? mode : 'Study';
              _elapsedSeconds = initialSeconds ?? 0;
              _camStatus = 'verified';
              onStopRequested = onStopClicked;

              activeNotifier.value = true;
              camStatusNotifier.value = 'verified';
              elapsedNotifier.value = _elapsedSeconds;

              await _updateNotification();

              _tickerTimer?.cancel();
              _tickerTimer = Timer.periodic(const Duration(seconds: 1), (timer) async {
                if (!_isSessionActive) {
                  timer.cancel();
                  return;
                }
                _elapsedSeconds++;
                elapsedNotifier.value = _elapsedSeconds;
                await _updateNotification();
              });
            }

            void updateCamStatus(String status) {
              if (_camStatus != status) {
                _camStatus = status;
                camStatusNotifier.value = status;
              }
            }

            String _formatTime(int totalSeconds) {
              final int hours = totalSeconds ~/ 3600;
              final int minutes = (totalSeconds % 3600) ~/ 60;
              final int seconds = totalSeconds % 60;
              final String mStr = minutes.toString().padLeft(2, '0');
              final String sStr = seconds.toString().padLeft(2, '0');
              if (hours > 0) {
                return "${hours.toString().padLeft(2, '0')}:$mStr:$sStr";
              }
              return "$mStr:$sStr";
            }

            Future<void> _updateNotification() async {
              if (!_isSessionActive) return;
              final String timeStr = _formatTime(_elapsedSeconds);
              final String title = "🎯 PrepWise Focus Session";
              final String body = "⏱️ $timeStr  •  Studying: $_subject | Mode: $_mode";

              final AndroidNotificationDetails androidDetails = AndroidNotificationDetails(
                channelId,
                channelName,
                channelDescription: 'Live count-up stopwatch timer for active focus sessions.',
                importance: Importance.low,
                priority: Priority.low,
                ongoing: true,
                autoCancel: false,
                onlyAlertOnce: true,
                playSound: false,
                enableVibration: false,
                icon: '@mipmap/ic_launcher',
                actions: const <AndroidNotificationAction>[
                  AndroidNotificationAction(
                    'STOP_FOCUS_SESSION',
                    '🛑 Stop Focus Session',
                    showsUserInterface: true,
                    cancelNotification: false,
                  ),
                ],
              );

              try {
                await _notifications.show(
                  notificationId,
                  title,
                  body,
                  NotificationDetails(android: androidDetails),
                  payload: 'FOCUS_SESSION_STOP_ACTION',
                );
              } catch (e) {
                debugPrint("[FocusSessionService] Notification error: $e");
              }
            }

            Future<void> stopSession() async {
              _isSessionActive = false;
              _tickerTimer?.cancel();
              _tickerTimer = null;
              activeNotifier.value = false;
              try {
                await _notifications.cancel(notificationId);
              } catch (_) {}
            }
          }
          EOF

          cat << 'EOF' > prepwise_app/lib/services/pdf_download_service.dart
          import 'dart:io';
          import 'package:http/http.dart' as http;
          import 'package:path_provider/path_provider.dart';
          import 'package:open_filex/open_filex.dart';
          import 'package:fluttertoast/fluttertoast.dart';
          import 'package:flutter/foundation.dart';

          class PdfDownloadService {
            static Future<void> downloadAndOpenPdf(String url, {String? customTitle}) async {
              try {
                final safeTitle = (customTitle != null && customTitle.trim().isNotEmpty)
                    ? customTitle.trim().replaceAll(RegExp(r'[^a-zA-Z0-9_\-\. ]'), '_')
                    : "PrepWise_Resource_${DateTime.now().millisecondsSinceEpoch}";
                final filename = safeTitle.toLowerCase().endsWith('.pdf') ? safeTitle : "$safeTitle.pdf";

                Fluttertoast.showToast(msg: "Downloading: $filename...", toastLength: Toast.LENGTH_SHORT);
                final uri = Uri.parse(url);
                final response = await http.get(uri);
                if (response.statusCode != 200) throw Exception("HTTP ${response.statusCode}");

                Directory? targetDir;
                try {
                  if (Platform.isAndroid) {
                    final publicDownload = Directory('/storage/emulated/0/Download/PrepWise');
                    if (!await publicDownload.exists()) await publicDownload.create(recursive: true);
                    targetDir = publicDownload;
                  }
                } catch (_) {}
                targetDir ??= await getApplicationDocumentsDirectory();

                final file = File("${targetDir.path}/$filename");
                await file.writeAsBytes(response.bodyBytes);

                Fluttertoast.showToast(msg: "✓ Saved to Downloads/PrepWise! Opening...", toastLength: Toast.LENGTH_LONG);
                await OpenFilex.open(file.path);
              } catch (e) {
                debugPrint("PDF download error: $e");
                Fluttertoast.showToast(msg: "Download failed: $e", toastLength: Toast.LENGTH_LONG);
              }
            }
          }
          EOF

          cat << 'EOF' > prepwise_app/lib/widgets/floating_focus_dot.dart
          import 'package:flutter/material.dart';
          import '../services/focus_session_service.dart';

          class FloatingFocusDot extends StatefulWidget {
            const FloatingFocusDot({super.key});
            @override
            State<FloatingFocusDot> createState() => _FloatingFocusDotState();
          }

          class _FloatingFocusDotState extends State<FloatingFocusDot> with SingleTickerProviderStateMixin {
            late AnimationController _pulseController;
            late Animation<double> _pulseAnimation;
            double _posX = 20.0;
            double _posY = 120.0;
            bool _isExpanded = false;

            @override
            void initState() {
              super.initState();
              _pulseController = AnimationController(vsync: this, duration: const Duration(milliseconds: 1400))..repeat(reverse: true);
              _pulseAnimation = Tween<double>(begin: 0.9, end: 1.25).animate(CurvedAnimation(parent: _pulseController, curve: Curves.easeInOut));
            }

            @override
            void dispose() {
              _pulseController.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              final focusService = FocusSessionService();
              return ValueListenableBuilder<bool>(
                valueListenable: focusService.activeNotifier,
                builder: (context, isActive, _) {
                  if (!isActive) return const SizedBox.shrink();
                  return ValueListenableBuilder<String>(
                    valueListenable: focusService.camStatusNotifier,
                    builder: (context, camStatus, _) {
                      final bool isVerified = camStatus == 'verified';
                      final Color statusColor = isVerified ? const Color(0xFF10B981) : const Color(0xFFEF4444);
                      final Color glowColor = isVerified ? const Color(0x6610B981) : const Color(0x66EF4444);

                      return Positioned(
                        left: _posX,
                        top: _posY,
                        child: GestureDetector(
                          onPanUpdate: (details) {
                            setState(() {
                              _posX = (_posX + details.delta.dx).clamp(10.0, MediaQuery.of(context).size.width - (_isExpanded ? 280.0 : 50.0));
                              _posY = (_posY + details.delta.dy).clamp(40.0, MediaQuery.of(context).size.height - (_isExpanded ? 200.0 : 80.0));
                            });
                          },
                          onTap: () => setState(() => _isExpanded = !_isExpanded),
                          child: Material(
                            color: Colors.transparent,
                            child: AnimatedContainer(
                              duration: const Duration(milliseconds: 250),
                              padding: _isExpanded ? const EdgeInsets.all(14) : const EdgeInsets.all(4),
                              decoration: BoxDecoration(
                                color: _isExpanded ? const Color(0xF01E293B) : const Color(0xEE0F172A),
                                borderRadius: BorderRadius.circular(_isExpanded ? 18 : 24),
                                border: Border.all(color: statusColor.withValues(alpha: 0.8), width: _isExpanded ? 1.5 : 2.0),
                                boxShadow: [BoxShadow(color: glowColor, blurRadius: _isExpanded ? 16 : 10, spreadRadius: _isExpanded ? 2 : 1)],
                              ),
                              child: _isExpanded ? _buildExpandedCard(isVerified, statusColor) : _buildCompactDot(statusColor),
                            ),
                          ),
                        ),
                      );
                    },
                  );
                },
              );
            }

            Widget _buildCompactDot(Color statusColor) {
              return AnimatedBuilder(
                animation: _pulseAnimation,
                builder: (context, child) {
                  return Container(
                    width: 32,
                    height: 32,
                    alignment: Alignment.center,
                    child: Stack(
                      alignment: Alignment.center,
                      children: [
                        Transform.scale(
                          scale: _pulseAnimation.value,
                          child: Container(width: 24, height: 24, decoration: BoxDecoration(shape: BoxShape.circle, color: statusColor.withValues(alpha: 0.25))),
                        ),
                        Container(width: 14, height: 14, decoration: BoxDecoration(shape: BoxShape.circle, color: statusColor)),
                      ],
                    ),
                  );
                },
              );
            }

            Widget _buildExpandedCard(bool isVerified, Color statusColor) {
              return SizedBox(
                width: 260,
                child: Column(
                  mainAxisSize: MainAxisSize.min,
                  crossAxisAlignment: CrossAxisAlignment.start,
                  children: [
                    Row(
                      mainAxisAlignment: MainAxisAlignment.spaceBetween,
                      children: [
                        Row(children: [
                          Container(width: 10, height: 10, decoration: BoxDecoration(shape: BoxShape.circle, color: statusColor)),
                          const SizedBox(width: 8),
                          const Text("Cam Verification", style: TextStyle(color: Colors.white, fontSize: 13, fontWeight: FontWeight.bold)),
                        ]),
                        GestureDetector(
                          onTap: () => setState(() => _isExpanded = false),
                          child: const Icon(Icons.close_rounded, size: 16, color: Colors.white70),
                        ),
                      ],
                    ),
                    const SizedBox(height: 12),
                    Container(
                      padding: const EdgeInsets.all(10),
                      decoration: BoxDecoration(
                        color: isVerified ? const Color(0x1A10B981) : const Color(0x1AEF4444),
                        borderRadius: BorderRadius.circular(10),
                        border: Border.all(color: isVerified ? const Color(0x3310B981) : const Color(0x33EF4444)),
                      ),
                      child: Row(
                        children: [
                          Icon(isVerified ? Icons.face_rounded : Icons.face_retouching_off_rounded, color: statusColor, size: 24),
                          const SizedBox(width: 10),
                          Expanded(
                            child: Text(
                              isVerified ? "Your face is under tracking. Keep going!" : "We can't see your face, your focus session timer is paused.",
                              style: TextStyle(color: isVerified ? const Color(0xFFD1FAE5) : const Color(0xFFFEE2E2), fontSize: 12, fontWeight: FontWeight.w500),
                            ),
                          ),
                        ],
                      ),
                    ),
                    const SizedBox(height: 8),
                    const Center(child: Text("Tap dot to collapse • Drag anywhere", style: TextStyle(color: Colors.white38, fontSize: 10))),
                  ],
                ),
              );
            }
          }
          EOF

      - name: Write notification_service.dart
        run: |
          cat << 'EOF' > prepwise_app/lib/services/notification_service.dart
          import 'dart:convert';
          import 'package:firebase_core/firebase_core.dart';
          import 'package:firebase_messaging/firebase_messaging.dart';
          import 'package:flutter_local_notifications/flutter_local_notifications.dart';
          import 'package:flutter/foundation.dart';
          import 'focus_session_service.dart';

          @pragma('vm:entry-point')
          Future<void> firebaseMessagingBackgroundHandler(RemoteMessage message) async {
            await Firebase.initializeApp();
            debugPrint("Handling background FCM message: ${message.messageId}");
          }

          class NotificationService {
            static final NotificationService _instance = NotificationService._internal();
            factory NotificationService() => _instance;
            NotificationService._internal();

            final FirebaseMessaging _fcm = FirebaseMessaging.instance;
            final FlutterLocalNotificationsPlugin _localNotifications = FlutterLocalNotificationsPlugin();

            String? _fcmToken;
            String? get fcmToken => _fcmToken;

            Function(String token)? onTokenReceived;
            Function(String payload)? onNotificationTapped;
            Function()? onFocusStopActionClicked;

            Future<void> initialize({
              Function(String token)? onTokenReady,
              Function(String payload)? onNotificationClick,
              Function()? onFocusStopAction,
            }) async {
              onTokenReceived = onTokenReady;
              onNotificationTapped = onNotificationClick;
              onFocusStopActionClicked = onFocusStopAction;

              try {
                await _fcm.requestPermission(alert: true, badge: true, sound: true);
              } catch (_) {}

              const AndroidInitializationSettings androidSettings =
                  AndroidInitializationSettings('@mipmap/ic_launcher');
              const InitializationSettings initSettings =
                  InitializationSettings(android: androidSettings);

              await _localNotifications.initialize(
                initSettings,
                onDidReceiveNotificationResponse: (NotificationResponse response) {
                  if (response.actionId == 'STOP_FOCUS_SESSION' || response.payload == 'FOCUS_SESSION_STOP_ACTION') {
                    if (onFocusStopActionClicked != null) onFocusStopActionClicked!();
                    final focusService = FocusSessionService();
                    if (focusService.onStopRequested != null) focusService.onStopRequested!();
                    return;
                  }
                  if (response.payload != null && onNotificationTapped != null) {
                    onNotificationTapped!(response.payload!);
                  }
                },
              );

              const AndroidNotificationChannel broadcastChannel = AndroidNotificationChannel(
                'prepwise_broadcast_channel',
                'PrepWise Notifications',
                description: 'Important study updates, broadcasts, and reminders.',
                importance: Importance.max,
                playSound: true,
                enableVibration: true,
              );

              await _localNotifications
                  .resolvePlatformSpecificImplementation<AndroidFlutterLocalNotificationsPlugin>()
                  ?.createNotificationChannel(broadcastChannel);

              await FocusSessionService().initializeNotificationChannel();

              try {
                _fcmToken = await _fcm.getToken();
                if (_fcmToken != null && onTokenReceived != null) {
                  onTokenReceived!(_fcmToken!);
                }
              } catch (_) {}

              _fcm.onTokenRefresh.listen((newToken) {
                _fcmToken = newToken;
                if (onTokenReceived != null) onTokenReceived!(newToken);
              });

              FirebaseMessaging.onMessage.listen((RemoteMessage message) {
                RemoteNotification? notification = message.notification;
                AndroidNotification? android = message.notification?.android;
                if (notification != null && android != null && !kIsWeb) {
                  _localNotifications.show(
                    notification.hashCode,
                    notification.title,
                    notification.body,
                    NotificationDetails(
                      android: AndroidNotificationDetails(
                        broadcastChannel.id,
                        broadcastChannel.name,
                        channelDescription: broadcastChannel.description,
                        icon: '@mipmap/ic_launcher',
                        importance: Importance.max,
                        priority: Priority.high,
                        playSound: true,
                      ),
                    ),
                    payload: jsonEncode(message.data),
                  );
                }
              });

              FirebaseMessaging.onMessageOpenedApp.listen((RemoteMessage message) {
                if (onNotificationTapped != null) onNotificationTapped!(jsonEncode(message.data));
              });
            }
          }
          EOF

      - name: Write Kotlin MainActivity
        run: |
          mkdir -p prepwise_app/android/app/src/main/kotlin/com/prepwise/prepwise
          cat << 'EOF' > prepwise_app/android/app/src/main/kotlin/com/prepwise/prepwise/MainActivity.kt
          package com.prepwise.prepwise

          import android.content.Intent
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import org.json.JSONArray
          import org.json.JSONObject

          class MainActivity : FlutterActivity() {
              private val CHANNEL = "com.prepwise/apps"

              override fun onNewIntent(intent: Intent) {
                  super.onNewIntent(intent)
                  setIntent(intent)
              }

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->
                      if (call.method == "getInstalledApps") {
                          try {
                              val pm = packageManager
                              val intent = Intent(Intent.ACTION_MAIN, null)
                              intent.addCategory(Intent.CATEGORY_LAUNCHER)
                              val apps = pm.queryIntentActivities(intent, 0)
                              val jsonArray = JSONArray()
                              for (app in apps) {
                                  val obj = JSONObject()
                                  obj.put("name", app.loadLabel(pm).toString())
                                  obj.put("packageName", app.activityInfo.packageName)
                                  jsonArray.put(obj)
                              }
                              result.success(jsonArray.toString())
                          } catch (e: Exception) {
                              result.error("APPS_ERROR", e.message, null)
                          }
                      } else {
                          result.notImplemented()
                      }
                  }
              }
          }
          EOF

      - name: Write Main Dart Code
        run: |
          cat << 'EOF' > prepwise_app/lib/main.dart
          import 'dart:convert';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:firebase_core/firebase_core.dart';
          import 'package:firebase_messaging/firebase_messaging.dart';
          import 'package:webview_flutter/webview_flutter.dart';
          import 'package:webview_flutter_android/webview_flutter_android.dart';
          import 'package:wakelock_plus/wakelock_plus.dart';
          import 'package:url_launcher/url_launcher.dart';
          import 'package:permission_handler/permission_handler.dart';
          import 'services/notification_service.dart';
          import 'services/focus_session_service.dart';
          import 'services/google_auth_service.dart';
          import 'services/pdf_download_service.dart';
          import 'widgets/floating_focus_dot.dart';

          @pragma('vm:entry-point')
          Future<void> _firebaseBackgroundHandler(RemoteMessage message) async {
            await Firebase.initializeApp();
            debugPrint('BG FCM: ${message.messageId}');
          }

          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            await SystemChrome.setPreferredOrientations([DeviceOrientation.portraitUp]);
            SystemChrome.setSystemUIOverlayStyle(const SystemUiOverlayStyle(
              statusBarColor: Colors.transparent,
              statusBarIconBrightness: Brightness.light,
              systemNavigationBarColor: Color(0xFF0F172A),
              systemNavigationBarIconBrightness: Brightness.light,
            ));
            try {
              await Firebase.initializeApp();
              FirebaseMessaging.onBackgroundMessage(_firebaseBackgroundHandler);
              debugPrint('Firebase initialized OK');
            } catch (e) {
              debugPrint('Firebase init failed: $e');
            }
            runApp(const PrepWiseApp());
          }

          class PrepWiseApp extends StatelessWidget {
            const PrepWiseApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'PrepWise',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(scaffoldBackgroundColor: const Color(0xFF0F172A)),
                home: const MainWebView(),
              );
            }
          }

          class MainWebView extends StatefulWidget {
            const MainWebView({super.key});
            @override
            State<MainWebView> createState() => _MainWebViewState();
          }

          class _MainWebViewState extends State<MainWebView> {
            late final WebViewController _controller;
            bool _isLoading = true;
            int _progress = 0;
            bool _webViewReady = false;
            String? _pendingFcmToken;
            static const _appsChannel = MethodChannel('com.prepwise/apps');

            @override
            void initState() {
              super.initState();
              _requestAllPermissions();
              _setupWebView();
              _initFCM();
            }

            Future<void> _requestAllPermissions() async {
              try {
                await [Permission.notification, Permission.camera, Permission.microphone].request();
              } catch (e) {
                debugPrint('Permission error: $e');
              }
            }

            Future<void> _initFCM() async {
              try {
                await NotificationService().initialize(
                  onTokenReady: (token) {
                    if (_webViewReady) {
                      _injectFcmToken(token);
                    } else {
                      _pendingFcmToken = token;
                    }
                  },
                  onNotificationClick: (payload) {
                    debugPrint('Notification tapped: $payload');
                  },
                  onFocusStopAction: () {
                    _triggerInAppStopConfirmation();
                  },
                );
              } catch (e) {
                debugPrint('FCM init error: $e');
              }
            }

            void _triggerInAppStopConfirmation() {
              _controller.runJavaScript("""
                (function() {
                  if (typeof window.onNativeRequestStopFocus === 'function') {
                    window.onNativeRequestStopFocus();
                  } else {
                    console.log('[NativeBridge] window.onNativeRequestStopFocus not found');
                  }
                })();
              """);
            }

            Future<void> _injectFcmToken(String token) async {
              try {
                await _controller.runJavaScript('''
                  (function() {
                    var token = '$token';
                    try { localStorage.setItem('prepwise_native_fcm_token', token); } catch(e) {}
                    if (typeof window.onNativeFCMToken === 'function') {
                      window.onNativeFCMToken(token);
                    } else {
                      window.__pendingFcmToken = token;
                    }
                  })();
                ''');
              } catch (e) {
                debugPrint('FCM token inject error: $e');
              }
            }

            Future<void> _injectInstalledApps() async {
              try {
                final String jsonStr = await _appsChannel.invokeMethod('getInstalledApps');
                final escaped = jsonStr.replaceAll("'", "\\'");
                await _controller.runJavaScript(
                  "window.__nativeInstalledApps = JSON.parse('$escaped'); "
                  "if (window.onInstalledAppsReady) window.onInstalledAppsReady(window.__nativeInstalledApps);",
                );
              } catch (e) {
                debugPrint('InstalledApps error: $e');
              }
            }

            void _setupWebView() {
              late final PlatformWebViewControllerCreationParams params;
              if (WebViewPlatform.instance is AndroidWebViewPlatform) {
                params = AndroidWebViewControllerCreationParams();
              } else {
                params = const PlatformWebViewControllerCreationParams();
              }

              final controller = WebViewController.fromPlatformCreationParams(params);

              controller
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..setBackgroundColor(const Color(0xFF0F172A))
                ..setNavigationDelegate(NavigationDelegate(
                  onProgress: (p) => setState(() => _progress = p),
                  onPageStarted: (url) => setState(() => _isLoading = true),
                  onPageFinished: (url) {
                    setState(() {
                      _isLoading = false;
                      _webViewReady = true;
                    });
                    _controller.runJavaScript('''
                      if (!window.AppBridge) {
                        window.AppBridge = {
                          postMessage: function(msg) {
                            if (window.FlutterBridge) {
                              window.FlutterBridge.postMessage(typeof msg === 'string' ? msg : JSON.stringify(msg));
                            }
                          }
                        };
                      }
                    ''');
                    _injectInstalledApps();
                    if (_pendingFcmToken != null) {
                      _injectFcmToken(_pendingFcmToken!);
                      _pendingFcmToken = null;
                    }
                  },
                  onNavigationRequest: (request) {
                    final url = request.url;
                    if (url.startsWith('intent://') ||
                        url.startsWith('tel:') ||
                        url.startsWith('mailto:') ||
                        url.startsWith('whatsapp:') ||
                        url.startsWith('market:')) {
                      try { launchUrl(Uri.parse(url), mode: LaunchMode.externalApplication); } catch (_) {}
                      return NavigationDecision.prevent;
                    }
                    if (url.endsWith('.pdf') || url.contains('/pdf/') || url.contains('type=pdf') || url.contains('application/pdf')) {
                      PdfDownloadService.downloadAndOpenPdf(url);
                      return NavigationDecision.prevent;
                    }
                    return NavigationDecision.navigate;
                  },
                ))
                ..addJavaScriptChannel('FlutterBridge',
                  onMessageReceived: (JavaScriptMessage message) async {
                    try {
                      final data = jsonDecode(message.message) as Map<String, dynamic>;
                      final action = data['action'] as String? ?? '';

                      if (action == 'nativeGoogleSignIn') {
                        final res = await GoogleAuthService().signIn();
                        if (res.success && res.idToken != null) {
                          final idToken = res.idToken!;
                          final accessToken = res.accessToken ?? '';
                          await _controller.runJavaScript("""
                            (function() {
                              if (typeof window.onNativeGoogleSignInSuccess === 'function') {
                                window.onNativeGoogleSignInSuccess('$idToken', '$accessToken');
                              }
                            })();
                          """);
                        } else {
                          final err = res.errorMessage ?? 'Google Sign-In failed';
                          await _controller.runJavaScript("""
                            (function() {
                              if (typeof window.onNativeGoogleSignInError === 'function') {
                                window.onNativeGoogleSignInError('$err');
                              }
                            })();
                          """);
                        }
                      }
                      else if (action == 'startFocusNotification') {
                        final subject = data['subject'] as String? ?? 'General';
                        final mode = data['mode'] as String? ?? 'Study';
                        final initialSeconds = data['initialSeconds'] as int? ?? 0;
                        await FocusSessionService().startSession(
                          subject: subject,
                          mode: mode,
                          initialSeconds: initialSeconds,
                          onStopClicked: () => _triggerInAppStopConfirmation(),
                        );
                        WakelockPlus.enable();
                        HapticFeedback.heavyImpact();
                      } else if (action == 'stopFocusNotification') {
                        await FocusSessionService().stopSession();
                        WakelockPlus.disable();
                        HapticFeedback.mediumImpact();
                      }
                      else if (action == 'updateCamStatus') {
                        final status = data['status'] as String? ?? 'verified';
                        FocusSessionService().updateCamStatus(status);
                      }
                      else if (action == 'downloadPdf') {
                        final pdfUrl = data['url'] as String? ?? '';
                        final title = data['title'] as String?;
                        if (pdfUrl.isNotEmpty) {
                          await PdfDownloadService.downloadAndOpenPdf(pdfUrl, customTitle: title);
                        }
                      }
                      else if (action == 'startStrictTimer') {
                        WakelockPlus.enable();
                        HapticFeedback.heavyImpact();
                      } else if (action == 'stopStrictTimer') {
                        WakelockPlus.disable();
                        HapticFeedback.vibrate();
                      }
                      else if (action == 'vibrate') {
                        final type = data['type'] as String? ?? 'medium';
                        if (type == 'heavy') HapticFeedback.heavyImpact();
                        else if (type == 'light') HapticFeedback.lightImpact();
                        else HapticFeedback.mediumImpact();
                      }
                      else if (action == 'requestCamera' || action == 'requestPermissions') {
                        await [Permission.camera, Permission.microphone, Permission.notification].request();
                      }
                      else if (action == 'getInstalledApps') {
                        await _injectInstalledApps();
                      }
                    } catch (e) {
                      debugPrint('Bridge error: $e');
                    }
                  },
                );

              if (controller.platform is AndroidWebViewController) {
                final androidController = controller.platform as AndroidWebViewController;
                androidController.setMediaPlaybackRequiresUserGesture(false);
                androidController.setOnPlatformPermissionRequest((request) => request.grant());
              }

              controller.loadRequest(Uri.parse('https://study-app-infixify1.vercel.app'));
              _controller = controller;
            }

            @override
            Widget build(BuildContext context) {
              return WillPopScope(
                onWillPop: () async {
                  if (await _controller.canGoBack()) { _controller.goBack(); return false; }
                  return true;
                },
                child: Scaffold(
                  backgroundColor: const Color(0xFF0F172A),
                  body: SafeArea(
                    child: Stack(children: [
                      WebViewWidget(controller: _controller),
                      if (_isLoading)
                        LinearProgressIndicator(
                          value: _progress / 100.0,
                          backgroundColor: const Color(0xFF1E293B),
                          color: const Color(0xFF0D9488),
                          minHeight: 3,
                        ),
                      const FloatingFocusDot(),
                    ]),
                  ),
                ),
              );
            }
          }
          EOF

