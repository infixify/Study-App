                channelName,
                description: 'Live continuous notification during active Focus Mode study sessions.',
                importance: Importance.low,
                playSound: false,
                enableVibration: false,
                showBadge: false,
              );

              await _notifications
                  .resolvePlatformSpecificImplementation<AndroidFlutterLocalNotificationsPlugin>()
                  ?.createNotificationChannel(channel);
            }

            /// Start Focus Session Live Notification with Real-Time Epoch Stopwatch
            Future<void> startSession({
              required String subject,
              required String mode,
              bool camEnabled = false,
              bool blockerEnabled = false,
              int? initialSeconds,
              Function()? onStopClicked,
              Function(int seconds)? onTick,
            }) async {
              _isSessionActive = true;
              _camEnabled = camEnabled;
              _blockerEnabled = blockerEnabled;
              _subject = subject.isNotEmpty ? subject : 'General';
              _mode = mode.isNotEmpty ? mode : 'Practice';
              _isPaused = false;
              _camStatus = 'verified';
              _pausedDurationMs = 0;

              final int initSecs = initialSeconds ?? 0;
              _startTimestampMs = DateTime.now().millisecondsSinceEpoch - (initSecs * 1000);

              onStopRequested = onStopClicked;
              onTimerTick = onTick;

              activeNotifier.value = true;
              camEnabledNotifier.value = camEnabled;
              camStatusNotifier.value = 'verified';
              elapsedNotifier.value = initSecs;

              // Persist active session in case app is swiped away (Option 2)
              _persistSessionState();

              debugPrint("[FocusSessionService] Starting session: $_subject ($_mode), cam: $camEnabled, blocker: $blockerEnabled");

              await _updateNotification();

              // Start 1-second ticker derived from Epoch Timestamp
              _tickerTimer?.cancel();
              _tickerTimer = Timer.periodic(const Duration(seconds: 1), (timer) async {
                if (!_isSessionActive) {
                  timer.cancel();
                  return;
                }
                final int currentSecs = elapsedSeconds;
                elapsedNotifier.value = currentSecs;
                if (onTimerTick != null) {
                  onTimerTick!(currentSecs);
                }
                await _updateNotification();
              });
            }

            void pauseSession() {
              if (_isSessionActive && !_isPaused) {
                _isPaused = true;
                _pauseStartMs = DateTime.now().millisecondsSinceEpoch;
                _updateNotification();
              }
            }

            void resumeSession() {
              if (_isSessionActive && _isPaused) {
                _isPaused = false;
                _pausedDurationMs += (DateTime.now().millisecondsSinceEpoch - _pauseStartMs);
                _updateNotification();
              }
            }

            void updateCamStatus(String status) {
              if (_camStatus != status) {
                _camStatus = status;
                camStatusNotifier.value = status;
                if (status == 'lost') {
                  pauseSession();
                } else if (status == 'verified') {
                  resumeSession();
                }
                _updateNotification();
              }
            }

            String _formatTime(int totalSeconds) {
              final int hours = totalSeconds ~/ 3600;
              final int minutes = (totalSeconds % 3600) ~/ 60;
              final int seconds = totalSeconds % 60;

              final String mStr = minutes.toString().padLeft(2, '0');
              final String sStr = seconds.toString().padLeft(2, '0');

              if (hours > 0) {
                final String hStr = hours.toString().padLeft(2, '0');
                return "$hStr:$mStr:$sStr";
              }
              return "$mStr:$sStr";
            }

            Future<void> _updateNotification() async {
              // Kotlin FocusBlockerService is the foreground service and owns the single notification (NOTIF_ID = 9901).
              // Suppress Flutter duplicate notification to prevent dual notification banners.
              return;
            }

            Future<void> stopSession() async {
              _isSessionActive = false;
              _isPaused = false;
              _tickerTimer?.cancel();
              _tickerTimer = null;

              activeNotifier.value = false;
              camEnabledNotifier.value = false;

              _clearPersistedSession();

              try {
                await _notifications.cancel(notificationId);
              } catch (_) {}

              debugPrint("[FocusSessionService] Session stopped.");
            }

            Future<void> _persistSessionState() async {
              // Session state is persisted directly in native Android SharedPreferences by FocusBlockerService
            }

            Future<void> _clearPersistedSession() async {
              // Cleared by FocusBlockerService / MainActivity
            }
          }
