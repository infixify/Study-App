name: Build PrepWise Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create Flutter App
        run: |
          flutter create --platforms=android --org com.prepwise --project-name prepwise prepwise_app
          cd prepwise_app
          flutter pub add \
            webview_flutter \
            webview_flutter_android \
            "wakelock_plus:^1.2.8" \
            url_launcher \
            permission_handler \
            firebase_core \
            firebase_messaging \
            "flutter_local_notifications:^17.2.4" \
            "google_sign_in:^6.2.2" \
            "open_filex:^4.5.0" \
            "http:^1.2.2" \
            "path_provider:^2.1.4"
          echo "" >> pubspec.yaml
          echo "dependency_overrides:" >> pubspec.yaml
          echo "  permission_handler_android: 12.0.13" >> pubspec.yaml
          echo "  flutter_local_notifications: 17.2.4" >> pubspec.yaml
          flutter pub get

      - name: Inject google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          python3 - << 'JSON_EOF'
          import os, sys, json

          raw_json = os.environ.get("GOOGLE_SERVICES_JSON", "").strip()
          if not raw_json:
              print("::error::GitHub Secret GOOGLE_SERVICES_JSON is empty or missing!")
              sys.exit(1)

          try:
              parsed = json.loads(raw_json)
              print("google-services.json is valid JSON!")
          except Exception as e:
              print(f"::error::GOOGLE_SERVICES_JSON is not valid JSON: {e}")
              sys.exit(1)

          target_path = "prepwise_app/android/app/google-services.json"
          os.makedirs(os.path.dirname(target_path), exist_ok=True)
          with open(target_path, "w", encoding="utf-8") as f:
              json.dump(parsed, f, indent=2)
          print(f"Saved {target_path} ({os.path.getsize(target_path)} bytes)")
          JSON_EOF

      - name: Configure Android Manifest and Permissions
        run: |
          cd prepwise_app
          python3 - << 'PY_MANIFEST'
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r", encoding="utf-8") as f:
              content = f.read()

          permissions = """
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.VIBRATE"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/>
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES"/>
              <uses-permission android:name="android.permission.PACKAGE_USAGE_STATS" tools:ignore="ProtectedPermissions"/>
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.BIND_ACCESSIBILITY_SERVICE" tools:ignore="ProtectedPermissions"/>
              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />
              <uses-feature android:name="android.hardware.microphone" android:required="false" />
          """

          fcm_and_services = """
                  <service
                      android:name="io.flutter.plugins.firebase.messaging.FlutterFirebaseMessagingBackgroundService"
                      android:permission="android.permission.BIND_JOB_SERVICE"
                      android:exported="false" />
                  <service
                      android:name="io.flutter.plugins.firebase.messaging.FlutterFirebaseMessagingService"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="com.google.firebase.MESSAGING_EVENT" />
                      </intent-filter>
                  </service>
                  <service
                      android:name=".PrepWiseAccessibilityService"
                      android:exported="true"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:label="PrepWise Focus Guard">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
          """

          if "android.permission.INTERNET" not in content:
              content = content.replace("<application", permissions + "\n    <application", 1)

          if "FlutterFirebaseMessagingBackgroundService" not in content:
              content = content.replace("</application>", fcm_and_services + "\n    </application>")

          with open(manifest_path, "w", encoding="utf-8") as f:
              f.write(content)
          print("AndroidManifest.xml successfully updated.")
          PY_MANIFEST

      - name: Patch Gradle Configurations (Google Services & Desugaring)
        run: |
          cd prepwise_app
          cat << 'PY_GRADLE' > update_gradle.py
          import re, os

          if os.path.exists("android/settings.gradle.kts"):
              with open("android/settings.gradle.kts", "r") as f:
                  s = f.read()
              plugin_line = '    id("com.google.gms.google-services") version "4.4.1" apply false\n'
              if "com.google.gms.google-services" not in s and "plugins {" in s:
                  s = s.replace("plugins {", "plugins {\n" + plugin_line, 1)
              with open("android/settings.gradle.kts", "w") as f:
                  f.write(s)
          elif os.path.exists("android/settings.gradle"):
              with open("android/settings.gradle", "r") as f:
                  s = f.read()
              plugin_line = "    id 'com.google.gms.google-services' version '4.4.1' apply false\n"
              if "com.google.gms.google-services" not in s and "plugins {" in s:
                  s = s.replace("plugins {", "plugins {\n" + plugin_line, 1)
              with open("android/settings.gradle", "w") as f:
                  f.write(s)

          if os.path.exists("android/app/build.gradle.kts"):
              with open("android/app/build.gradle.kts", "r") as f:
                  a = f.read()
              app_plugin = '    id("com.google.gms.google-services")\n'
              if "com.google.gms.google-services" not in a:
                  m = re.search(r'plugins\s*\{([^}]*)\}', a)
                  if m:
                      a = a[:m.end()-1] + app_plugin + a[m.end()-1:]
                  elif "plugins {" in a:
                      a = a.replace("plugins {", "plugins {\n" + app_plugin, 1)
              if "isCoreLibraryDesugaringEnabled" not in a:
                  a = a.replace("compileOptions {", "compileOptions {\n        isCoreLibraryDesugaringEnabled = true")
              if "coreLibraryDesugaring" not in a:
                  a += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
              a = a.replace("minSdk = flutter.minSdkVersion", "minSdk = 21")
              a = a.replace("minSdkVersion = flutter.minSdkVersion", "minSdkVersion = 21")
              a = re.sub(r'compileSdk\s*=\s*flutter\.compileSdkVersion', 'compileSdk = 36', a)
              a = re.sub(r'compileSdkVersion\s*=\s*flutter\.compileSdkVersion', 'compileSdkVersion = 36', a)
              a = re.sub(r'targetSdk\s*=\s*flutter\.targetSdkVersion', 'targetSdk = 34', a)
              a = re.sub(r'targetSdkVersion\s*=\s*flutter\.targetSdkVersion', 'targetSdkVersion = 34', a)
              with open("android/app/build.gradle.kts", "w") as f:
                  f.write(a)
          elif os.path.exists("android/app/build.gradle"):
              with open("android/app/build.gradle", "r") as f:
                  a = f.read()
              if "apply plugin: 'com.google.gms.google-services'" not in a:
                  a += "\napply plugin: 'com.google.gms.google-services'\n"
              if "coreLibraryDesugaringEnabled" not in a:
                  a = a.replace("compileOptions {", "compileOptions {\n        coreLibraryDesugaringEnabled true")
              if "coreLibraryDesugaring" not in a:
                  a += "\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'\n}\n"
              a = a.replace("minSdkVersion flutter.minSdkVersion", "minSdkVersion 21")
              a = re.sub(r'compileSdkVersion\s+flutter\.compileSdkVersion', 'compileSdkVersion 36', a)
              a = re.sub(r'targetSdkVersion\s+flutter\.targetSdkVersion', 'targetSdkVersion 34', a)
              with open("android/app/build.gradle", "w") as f:
                  f.write(a)

          if os.path.exists("android/build.gradle.kts"):
              with open("android/build.gradle.kts", "r") as f:
                  b = f.read()
              fix_kts = (
                  "\nsubprojects {\n"
                  "    afterEvaluate {\n"
                  "        val androidExt = project.extensions.findByName(\"android\")\n"
                  "        if (androidExt != null) {\n"
                  "            try {\n"
                  "                val m = androidExt.javaClass.getMethod(\"setCompileSdkVersion\", Int::class.javaPrimitiveType)\n"
                  "                m.invoke(androidExt, 36)\n"
                  "            } catch (e: Exception) {\n"
                  "                try {\n"
                  "                    val m2 = androidExt.javaClass.getMethod(\"compileSdkVersion\", Int::class.javaPrimitiveType)\n"
                  "                    m2.invoke(androidExt, 36)\n"
                  "                } catch (e2: Exception) {}\n"
                  "            }\n"
                  "        }\n"
                  "    }\n"
                  "}\n"
              )
              if "subprojects" not in b:
                  b += fix_kts
                  with open("android/build.gradle.kts", "w") as f:
                      f.write(b)

          if os.path.exists("android/build.gradle"):
              with open("android/build.gradle", "r") as f:
                  b = f.read()
              fix_groovy = (
                  "\nsubprojects {\n"
                  "    project.evaluationDependsOn(':app')\n"
                  "    afterEvaluate { project ->\n"
                  "        if (project.hasProperty('android')) {\n"
                  "            project.android {\n"
                  "                compileSdkVersion 36\n"
                  "            }\n"
                  "        }\n"
                  "    }\n"
                  "}\n"
              )
              if "compileSdkVersion 36" not in b:
                  b += fix_groovy
                  with open("android/build.gradle", "w") as f:
                      f.write(b)

          prop_path = "android/gradle.properties"
          if os.path.exists(prop_path):
              with open(prop_path, "a") as f:
                  f.write("\nandroid.useAndroidX=true\nandroid.enableJetifier=true\nandroid.suppressUnsupportedCompileSdk=34,35,36,37\n")
          print("Gradle patching done.")
          PY_GRADLE
          python3 update_gradle.py

      - name: Write Accessibility Service Config XML
        run: |
          mkdir -p prepwise_app/android/app/src/main/res/xml
          cat << 'EOF' > prepwise_app/android/app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackAllMask"
              android:accessibilityFlags="flagDefault"
              android:canRetrieveWindowContent="false"
              android:description="@string/accessibility_service_description"
              android:notificationTimeout="100"
              android:packageNames="" />
          EOF

          mkdir -p prepwise_app/android/app/src/main/res/values
          python3 - << 'PY_STRINGS'
          import os
          path = "prepwise_app/android/app/src/main/res/values/strings.xml"
          if os.path.exists(path):
              with open(path, "r") as f:
                  content = f.read()
              if "accessibility_service_description" not in content:
                  content = content.replace("</resources>",
                      '    <string name="accessibility_service_description">PrepWise Focus Guard monitors foreground apps during focus sessions to block distractions.</string>\n</resources>')
                  with open(path, "w") as f:
                      f.write(content)
          else:
              with open(path, "w") as f:
                  f.write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <string name="app_name">PrepWise</string>\n    <string name="accessibility_service_description">PrepWise Focus Guard monitors foreground apps during focus sessions to block distractions.</string>\n</resources>\n')
          print("strings.xml updated.")
          PY_STRINGS

      - name: Write Native Kotlin Files
        run: |
          mkdir -p prepwise_app/android/app/src/main/kotlin/com/prepwise/prepwise

          cat << 'EOF' > prepwise_app/android/app/src/main/kotlin/com/prepwise/prepwise/MainActivity.kt
          package com.prepwise.prepwise

          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.provider.Settings
          import android.widget.Toast
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import org.json.JSONArray
          import org.json.JSONObject

          class MainActivity : FlutterActivity() {
              private val CHANNEL_APPS = "com.prepwise/apps"
              private val CHANNEL_TOAST = "com.prepwise/toast"
              private val CHANNEL_OVERLAY = "com.prepwise/overlay"
              private val CHANNEL_ACCESSIBILITY = "com.prepwise/accessibility"

              override fun onNewIntent(intent: Intent) {
                  super.onNewIntent(intent)
                  setIntent(intent)
              }

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)

                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL_TOAST).setMethodCallHandler { call, result ->
                      if (call.method == "showToast") {
                          val msg = call.argument<String>("message") ?: ""
                          Toast.makeText(applicationContext, msg, Toast.LENGTH_SHORT).show()
                          result.success(true)
                      } else {
                          result.notImplemented()
                      }
                  }

                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL_APPS).setMethodCallHandler { call, result ->
                      if (call.method == "getInstalledApps") {
                          try {
                              val pm = packageManager
                              val intent = Intent(Intent.ACTION_MAIN, null)
                              intent.addCategory(Intent.CATEGORY_LAUNCHER)
                              val apps = pm.queryIntentActivities(intent, 0)
                              val jsonArray = JSONArray()
                              for (app in apps) {
                                  val obj = JSONObject()
                                  obj.put("name", app.loadLabel(pm).toString())
                                  obj.put("packageName", app.activityInfo.packageName)
                                  jsonArray.put(obj)
                              }
                              result.success(jsonArray.toString())
                          } catch (e: Exception) {
                              result.error("APPS_ERROR", e.message, null)
                          }
                      } else {
                          result.notImplemented()
                      }
                  }

                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL_OVERLAY).setMethodCallHandler { call, result ->
                      when (call.method) {
                          "canDrawOverlays" -> {
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                                  result.success(Settings.canDrawOverlays(this))
                              } else {
                                  result.success(true)
                              }
                          }
                          "requestOverlayPermission" -> {
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                                  if (!Settings.canDrawOverlays(this)) {
                                      val intent = Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName"))
                                      startActivity(intent)
                                  }
                              }
                              result.success(true)
                          }
                          else -> result.notImplemented()
                      }
                  }

                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL_ACCESSIBILITY).setMethodCallHandler { call, result ->
                      when (call.method) {
                          "isAccessibilityEnabled" -> {
                              val enabled = PrepWiseAccessibilityService.isServiceEnabled(this)
                              result.success(enabled)
                          }
                          "openAccessibilitySettings" -> {
                              startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                              result.success(true)
                          }
                          "setBlockedApps" -> {
                              val apps = call.argument<List<String>>("blockedApps") ?: emptyList()
                              PrepWiseAccessibilityService.setBlockedApps(apps)
                              result.success(true)
                          }
                          "setBlockingEnabled" -> {
                              val enabled = call.argument<Boolean>("enabled") ?: false
                              PrepWiseAccessibilityService.setBlockingEnabled(enabled)
                              result.success(true)
                          }
                          else -> result.notImplemented()
                      }
                  }
              }
          }
          EOF

          cat << 'EOF' > prepwise_app/android/app/src/main/kotlin/com/prepwise/prepwise/PrepWiseAccessibilityService.kt
          package com.prepwise.prepwise

          import android.accessibilityservice.AccessibilityService
          import android.content.Context
          import android.content.Intent
          import android.view.accessibility.AccessibilityEvent

          class PrepWiseAccessibilityService : AccessibilityService() {

              companion object {
                  private var blockedApps: List<String> = emptyList()
                  private var blockingEnabled: Boolean = false
                  private const val OUR_PACKAGE = "com.prepwise.prepwise"

                  fun setBlockedApps(apps: List<String>) {
                      blockedApps = apps
                  }

                  fun setBlockingEnabled(enabled: Boolean) {
                      blockingEnabled = enabled
                  }

                  fun isServiceEnabled(context: Context): Boolean {
                      val serviceName = "$OUR_PACKAGE/.PrepWiseAccessibilityService"
                      val enabledServices = android.provider.Settings.Secure.getString(
                          context.contentResolver,
                          android.provider.Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES
                      ) ?: return false
                      return enabledServices.contains(serviceName)
                  }
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  if (!blockingEnabled) return
                  if (event?.eventType != AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED) return

                  val packageName = event.packageName?.toString() ?: return

                  if (packageName == OUR_PACKAGE) return
                  if (packageName == "com.android.systemui") return
                  if (packageName == "com.android.launcher" || packageName.contains("launcher")) return

                  val isBlocked = blockedApps.isNotEmpty() && blockedApps.contains(packageName)
                  if (isBlocked) {
                      val launchIntent = packageManager.getLaunchIntentForPackage(OUR_PACKAGE)
                      if (launchIntent != null) {
                          launchIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_REORDER_TO_FRONT)
                          startActivity(launchIntent)
                      }
                  }
              }

              override fun onInterrupt() {}
          }
          EOF

      - name: Write Dart Services and Widgets
        run: |
          mkdir -p prepwise_app/lib/services
          mkdir -p prepwise_app/lib/widgets
          mkdir -p prepwise_app/lib/bridge
          mkdir -p prepwise_app/lib/screens

          cat << 'EOF' > prepwise_app/lib/services/app_toast.dart
          import 'package:flutter/services.dart';

          class AppToast {
            static const _channel = MethodChannel('com.prepwise/toast');
            static void show(String message) {
              try {
                _channel.invokeMethod('showToast', {'message': message});
              } catch (_) {}
            }
          }
          EOF

          cat << 'EOF' > prepwise_app/lib/services/wakelock_service.dart
          import 'package:wakelock_plus/wakelock_plus.dart';

          class WakelockService {
            static Future<void> enable() async {
              try { await WakelockPlus.enable(); } catch (_) {}
            }
            static Future<void> disable() async {
              try { await WakelockPlus.disable(); } catch (_) {}
            }
          }
          EOF

          cat << 'EOF' > prepwise_app/lib/services/google_auth_service.dart
          import 'package:flutter/foundation.dart';
          import 'package:google_sign_in/google_sign_in.dart';

          class GoogleAuthResult {
            final bool success;
            final String? idToken;
            final String? accessToken;
            final String? email;
            final String? displayName;
            final String? errorMessage;
            GoogleAuthResult({required this.success, this.idToken, this.accessToken, this.email, this.displayName, this.errorMessage});
          }

          class GoogleAuthService {
            static final GoogleAuthService _instance = GoogleAuthService._internal();
            factory GoogleAuthService() => _instance;
            GoogleAuthService._internal();

            final GoogleSignIn _googleSignIn = GoogleSignIn(scopes: ['email', 'profile', 'openid']);

            Future<GoogleAuthResult> signIn() async {
              try {
                await _googleSignIn.signOut();
                final GoogleSignInAccount? account = await _googleSignIn.signIn();
                if (account == null) {
                  return GoogleAuthResult(success: false, errorMessage: 'User cancelled');
                }
                final GoogleSignInAuthentication auth = await account.authentication;
                return GoogleAuthResult(success: true, idToken: auth.idToken, accessToken: auth.accessToken, email: account.email, displayName: account.displayName);
              } catch (e) {
                debugPrint('[GoogleAuthService] Error: $e');
                return GoogleAuthResult(success: false, errorMessage: e.toString());
              }
            }
          }
          EOF

          cat << 'EOF' > prepwise_app/lib/services/focus_session_service.dart
          import 'dart:async';
          import 'package:flutter/foundation.dart';
          import 'package:flutter_local_notifications/flutter_local_notifications.dart';

          class FocusSessionService {
            static final FocusSessionService _instance = FocusSessionService._internal();
            factory FocusSessionService() => _instance;
            FocusSessionService._internal();

            static const int notificationId = 8801;
            static const String channelId = 'prepwise_focus_live_timer';
            static const String channelName = 'Active Focus Session';

            final FlutterLocalNotificationsPlugin _notifications = FlutterLocalNotificationsPlugin();

            bool _isSessionActive = false;
            String _subject = 'General';
            String _mode = 'Study';
            Timer? _tickerTimer;
            String _camStatus = 'verified';
            int _elapsedSeconds = 0;

            bool get isSessionActive => _isSessionActive;
            final ValueNotifier<String> camStatusNotifier = ValueNotifier<String>('verified');
            final ValueNotifier<int> elapsedNotifier = ValueNotifier<int>(0);
            final ValueNotifier<bool> activeNotifier = ValueNotifier<bool>(false);

            Function()? onStopRequested;

            Future<void> initializeNotificationChannel() async {
              const AndroidNotificationChannel channel = AndroidNotificationChannel(
                channelId,
                channelName,
                description: 'Live continuous notification during active Focus Mode study sessions.',
                importance: Importance.low,
                playSound: false,
                enableVibration: false,
                showBadge: false,
              );
              await _notifications
                  .resolvePlatformSpecificImplementation<AndroidFlutterLocalNotificationsPlugin>()
                  ?.createNotificationChannel(channel);
            }

            Future<void> startSession({required String subject, required String mode, int? initialSeconds, Function()? onStopClicked}) async {
              _isSessionActive = true;
              _subject = subject.isNotEmpty ? subject : 'General';
              _mode = mode.isNotEmpty ? mode : 'Study';
              _elapsedSeconds = initialSeconds ?? 0;
              _camStatus = 'verified';
              onStopRequested = onStopClicked;
              activeNotifier.value = true;
              camStatusNotifier.value = 'verified';
              elapsedNotifier.value = _elapsedSeconds;
              await _updateNotification();
              _tickerTimer?.cancel();
              _tickerTimer = Timer.periodic(const Duration(seconds: 1), (timer) async {
                if (!_isSessionActive) { timer.cancel(); return; }
                _elapsedSeconds++;
                elapsedNotifier.value = _elapsedSeconds;
                await _updateNotification();
              });
            }

            void updateCamStatus(String status) {
              if (_camStatus != status) {
                _camStatus = status;
                camStatusNotifier.value = status;
              }
            }

            String _formatTime(int totalSeconds) {
              final int hours = totalSeconds ~/ 3600;
              final int minutes = (totalSeconds % 3600) ~/ 60;
              final int seconds = totalSeconds % 60;
              final String mStr = minutes.toString().padLeft(2, '0');
              final String sStr = seconds.toString().padLeft(2, '0');
              if (hours > 0) return "${hours.toString().padLeft(2, '0')}:$mStr:$sStr";
              return "$mStr:$sStr";
            }

            Future<void> _updateNotification() async {
              if (!_isSessionActive) return;
              final String timeStr = _formatTime(_elapsedSeconds);
              final String title = "PrepWise Focus Session";
              final String body = "$timeStr  |  Studying: $_subject | Mode: $_mode";
              final AndroidNotificationDetails androidDetails = AndroidNotificationDetails(
                channelId, channelName,
                channelDescription: 'Live count-up stopwatch for focus sessions.',
                importance: Importance.low,
                priority: Priority.low,
                ongoing: true,
                autoCancel: false,
                onlyAlertOnce: true,
                playSound: false,
                enableVibration: false,
                icon: '@mipmap/ic_launcher',
                actions: const <AndroidNotificationAction>[
                  AndroidNotificationAction('STOP_FOCUS_SESSION', 'Stop Focus Session', showsUserInterface: true, cancelNotification: false),
                ],
              );
              try {
