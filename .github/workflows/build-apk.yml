          import 'package:flutter/foundation.dart';
          import 'package:google_sign_in/google_sign_in.dart';

          class GoogleAuthResult {
            final bool success;
            final String? idToken;
            final String? accessToken;
            final String? email;
            final String? displayName;
            final String? photoUrl;
            final String? errorMessage;

            GoogleAuthResult({
              required this.success,
              this.idToken,
              this.accessToken,
              this.email,
              this.displayName,
              this.photoUrl,
              this.errorMessage,
            });
          }

          class GoogleAuthService {
            static final GoogleAuthService _instance = GoogleAuthService._internal();
            factory GoogleAuthService() => _instance;
            GoogleAuthService._internal();

            static String? get _serverClientId {
              const fromEnv = String.fromEnvironment('GOOGLE_SERVER_CLIENT_ID');
              final trimmed = fromEnv.trim();
              return trimmed.isNotEmpty ? trimmed : null;
            }

            final GoogleSignIn _googleSignIn = GoogleSignIn(
              scopes: ['email', 'profile', 'openid'],
              // serverClientId injected at build time from google-services.json (client_type 3 = web)
              serverClientId: _serverClientId,
            );

            /// Performs native Google Sign-In with account picker popup
            /// Returns ID Token & Access Token for Supabase signInWithIdToken
            Future<GoogleAuthResult> signIn() async {
              try {
                debugPrint('[GoogleAuthService] Launching native Google Account Picker with serverClientId: $_serverClientId');
                // Always sign out first to force account picker + fresh token
                await _googleSignIn.signOut();
                final GoogleSignInAccount? account = await _googleSignIn.signIn();
                if (account == null) {
                  debugPrint('[GoogleAuthService] User cancelled Google Account Picker.');
                  return GoogleAuthResult(
                    success: false,
                    errorMessage: 'User cancelled Google Sign-In',
                  );
                }

                final GoogleSignInAuthentication auth = await account.authentication;
                final String? idToken = auth.idToken;
                final String? accessToken = auth.accessToken;

                if (idToken == null || idToken.isEmpty) {
                  debugPrint('[GoogleAuthService] idToken is null. Check SHA-1 and Web Client ID in Firebase.');
                  return GoogleAuthResult(
                    success: false,
                    errorMessage: 'ID Token missing. Check SHA-1 and Web Client ID in Firebase.',
                  );
                }

                debugPrint('[GoogleAuthService] Success! Got ID Token for: ${account.email}');

                return GoogleAuthResult(
                  success: true,
                  idToken: idToken,
                  accessToken: accessToken,
                  email: account.email,
                  displayName: account.displayName,
                  photoUrl: account.photoUrl,
                );
              } catch (e) {
                debugPrint('[GoogleAuthService] Sign-In Error: $e');
                return GoogleAuthResult(
                  success: false,
                  errorMessage: e.toString(),
                );
              }
            }

            Future<void> signOut() async {
              try {
                await _googleSignIn.signOut();
              } catch (e) {
                debugPrint('[GoogleAuthService] Sign-Out Error: $e');
              }
            }
          }
          DART_AUTH_EOF

          python3 -c "import sys, textwrap; sys.stdout.write(textwrap.dedent(sys.stdin.read()))" << 'DART_FOCUS_EOF' > prepwise_app/lib/services/focus_session_service.dart
          import 'dart:async';
          import 'package:flutter/foundation.dart';

          /// FocusSessionService - Flutter UI state only.
          /// The actual notification + timer lives in FocusBlockerService (Kotlin foreground service),
          /// which keeps running reliably in background. This class only tracks UI state:
          /// the floating dot, cam status, and the in-app elapsed display (synced from Kotlin).
          class FocusSessionService {
            static final FocusSessionService _instance = FocusSessionService._internal();
            factory FocusSessionService() => _instance;
            FocusSessionService._internal();

            bool _isSessionActive = false;
            String _subject = 'General';
            String _mode = 'Study';
            String _camStatus = 'verified';
            int _elapsedSeconds = 0;

            // Paused state - cam lost or app in background
            bool _isPaused = false;
            Timer? _resumeTickerTimer;

            bool get isSessionActive => _isSessionActive;
            bool get isPaused => _isPaused;
            String get subject => _subject;
            String get mode => _mode;
            String get camStatus => _camStatus;
            int get elapsedSeconds => _elapsedSeconds;

            // UI notifiers
            final ValueNotifier<String> camStatusNotifier = ValueNotifier<String>('verified');
            final ValueNotifier<int> elapsedNotifier = ValueNotifier<int>(0);
            final ValueNotifier<bool> activeNotifier = ValueNotifier<bool>(false);
            final ValueNotifier<bool> pausedNotifier = ValueNotifier<bool>(false);

            // Callback triggered when stop is requested from notification (via Kotlin -> bridge)
            Function()? onStopRequested;

            /// Called by bridge when web app starts a focus session.
            /// [initialSeconds] = seconds already elapsed (e.g. resumed session).
            void startSession({
              required String subject,
              required String mode,
              int initialSeconds = 0,
              Function()? onStopClicked,
            }) {
              _isSessionActive = true;
              _isPaused = false;
              _subject = subject.isNotEmpty ? subject : 'General';
              _mode = mode.isNotEmpty ? mode : 'Study';
              _elapsedSeconds = initialSeconds;
              _camStatus = 'verified';
              onStopRequested = onStopClicked;

              activeNotifier.value = true;
              pausedNotifier.value = false;
              camStatusNotifier.value = 'verified';
              elapsedNotifier.value = _elapsedSeconds;

              // Local UI ticker - only increments when NOT paused.
              // Does NOT post any notification (Kotlin service owns that).
              _resumeTickerTimer?.cancel();
              _resumeTickerTimer = Timer.periodic(const Duration(seconds: 1), (_) {
                if (!_isSessionActive) return;
                if (_isPaused) return; // cam lost or background - do not count
                _elapsedSeconds++;
                elapsedNotifier.value = _elapsedSeconds;
              });

              debugPrint("[FocusSessionService] UI session started: $_subject ($_mode) from ${_elapsedSeconds}s");
            }

            /// Sync elapsed time from Kotlin service (called by bridge on resume/sync events).
            void syncElapsed(int seconds) {
              if (!_isSessionActive) return;
              _elapsedSeconds = seconds;
              elapsedNotifier.value = seconds;
            }

            /// Cam status update from web - pauses or resumes the UI timer.
            void updateCamStatus(String status) {
              if (_camStatus == status) return;
              _camStatus = status;
              camStatusNotifier.value = status;

              final lost = status != 'verified';
              if (_isPaused != lost) {
                _isPaused = lost;
                pausedNotifier.value = lost;
                debugPrint("[FocusSessionService] Session ${lost ? 'PAUSED' : 'RESUMED'} - cam: $status");
              }
            }

            /// Called when app goes to background - pause UI ticker (Kotlin keeps counting).
            void onBackground() {
              if (!_isSessionActive || _isPaused) return;
              _isPaused = true;
              pausedNotifier.value = true;
            }

            /// Called when app comes back to foreground.
            void onForeground(int syncedSeconds) {
              if (!_isSessionActive) return;
              _elapsedSeconds = syncedSeconds;
              elapsedNotifier.value = syncedSeconds;
              if (_camStatus == 'verified') {
                _isPaused = false;
                pausedNotifier.value = false;
              }
            }

            /// Stop session - clears all UI state.
            void stopSession() {
              _isSessionActive = false;
              _isPaused = false;
              _resumeTickerTimer?.cancel();
              _resumeTickerTimer = null;
              activeNotifier.value = false;
              pausedNotifier.value = false;
              elapsedNotifier.value = 0;
              _elapsedSeconds = 0;
              debugPrint("[FocusSessionService] Session stopped.");
            }

            /// No-op kept for compatibility with NotificationService init call.
            Future<void> initializeNotificationChannel() async {}
          }
          DART_FOCUS_EOF

          python3 -c "import sys, textwrap; sys.stdout.write(textwrap.dedent(sys.stdin.read()))" << 'DART_PDF_EOF' > prepwise_app/lib/services/pdf_download_service.dart
          import 'dart:io';
          import 'package:http/http.dart' as http;
          import 'package:path_provider/path_provider.dart';
          import 'package:open_filex/open_filex.dart';
          import 'package:url_launcher/url_launcher.dart';
          import 'app_toast.dart';
          import 'package:flutter/foundation.dart';

          class PdfDownloadService {
            static Future<void> downloadAndOpenPdf(String url, {String? customTitle}) async {
              try {
                final safeTitle = (customTitle != null && customTitle.trim().isNotEmpty)
                    ? customTitle.trim().replaceAll(RegExp(r'[^a-zA-Z0-9_\-\. ]'), '_')
                    : "NCERT_Resource_${DateTime.now().millisecondsSinceEpoch}";

                final filename = safeTitle.toLowerCase().endsWith('.pdf') ? safeTitle : "$safeTitle.pdf";

                AppToast.show("Loading NCERT: $filename...");

                final uri = Uri.parse(url);

                // Browser User-Agent and referer headers so ncert.nic.in allows download
                final response = await http.get(
                  uri,
                  headers: {
                    'User-Agent': 'Mozilla/5.0 (Linux; Android 14; Mobile) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36',
                    'Accept': 'application/pdf,application/octet-stream,*/*',
                    'Referer': 'https://ncert.nic.in/',
                  },
                ).timeout(const Duration(seconds: 30));

                if (response.statusCode != 200) {
                  throw Exception("Server returned HTTP ${response.statusCode}");
                }

                // Safe storage path that works on all Android versions (10, 11, 12, 13, 14, 15)
                Directory? targetDir;
                try {
                  final extDir = await getExternalStorageDirectory();
                  if (extDir != null) {
                    final ncertFolder = Directory("${extDir.path}/NCERT");
                    if (!await ncertFolder.exists()) {
                      await ncertFolder.create(recursive: true);
                    }
                    targetDir = ncertFolder;
                  }
                } catch (_) {}

                targetDir ??= await getApplicationDocumentsDirectory();

                final file = File("${targetDir.path}/$filename");
                await file.writeAsBytes(response.bodyBytes);

                AppToast.show("Opening NCERT Textbook...");

                // Open directly in native Android PDF viewer using OpenFilex
                final result = await OpenFilex.open(file.path);
                debugPrint("[PdfDownloadService] OpenFilex result: ${result.type} - ${result.message}");

                if (result.type != ResultType.done) {
                  // Fallback: launch external viewer directly if OpenFilex could not open
                  await launchUrl(Uri.parse(url), mode: LaunchMode.externalApplication);
                }
              } catch (e) {
                debugPrint("[PdfDownloadService] Download error: $e");
                AppToast.show("Opening NCERT in browser...");
                try {
                  await launchUrl(Uri.parse(url), mode: LaunchMode.externalApplication);
                } catch (err) {
                  AppToast.show("Could not open NCERT: $e");
                }
              }
            }
          }
          DART_PDF_EOF

          python3 -c "import sys, textwrap; sys.stdout.write(textwrap.dedent(sys.stdin.read()))" << 'DART_NOTIF_EOF' > prepwise_app/lib/services/notification_service.dart
          import 'dart:convert';
          import 'package:firebase_core/firebase_core.dart';
          import 'package:firebase_messaging/firebase_messaging.dart';
          import 'package:flutter_local_notifications/flutter_local_notifications.dart';
          import 'package:flutter/foundation.dart';
          import 'focus_session_service.dart';

          @pragma('vm:entry-point')
          Future<void> firebaseMessagingBackgroundHandler(RemoteMessage message) async {
            await Firebase.initializeApp();
            debugPrint("Handling background FCM message: ${message.messageId}");
          }

          class NotificationService {
            static final NotificationService _instance = NotificationService._internal();
            factory NotificationService() => _instance;
            NotificationService._internal();

            final FirebaseMessaging _fcm = FirebaseMessaging.instance;
            final FlutterLocalNotificationsPlugin _localNotifications = FlutterLocalNotificationsPlugin();

            String? _fcmToken;
            String? get fcmToken => _fcmToken;

            Function(String token)? onTokenReceived;
            Function(String payload)? onNotificationTapped;
            Function()? onFocusStopActionClicked;

            Future<void> initialize({
              Function(String token)? onTokenReady,
              Function(String payload)? onNotificationClick,
              Function()? onFocusStopAction,
            }) async {
              onTokenReceived = onTokenReady;
              onNotificationTapped = onNotificationClick;
              onFocusStopActionClicked = onFocusStopAction;

              // 1. Request Permission
              try {
                NotificationSettings settings = await _fcm.requestPermission(
                  alert: true,
                  badge: true,
                  sound: true,
                  provisional: false,
                );
                debugPrint('FCM Authorization Status: ${settings.authorizationStatus}');
              } catch (e) {
                debugPrint('FCM requestPermission error: $e');
              }

              // 2. Initialize Local Notifications
              const AndroidInitializationSettings androidSettings =
                  AndroidInitializationSettings('@mipmap/ic_launcher');
              const InitializationSettings initSettings =
                  InitializationSettings(android: androidSettings);

              await _localNotifications.initialize(
                initSettings,
                onDidReceiveNotificationResponse: (NotificationResponse response) {
                  debugPrint('[NotificationService] Response actionId: ${response.actionId}, payload: ${response.payload}');

                  // Handle Stop Focus Session action button click
                  if (response.actionId == 'STOP_FOCUS_SESSION' || response.payload == 'FOCUS_SESSION_STOP_ACTION') {
                    if (onFocusStopActionClicked != null) {
                      onFocusStopActionClicked!();
                    }
                    final focusService = FocusSessionService();
                    if (focusService.onStopRequested != null) {
                      focusService.onStopRequested!();
                    }
                    return;
                  }

                  if (response.payload != null && onNotificationTapped != null) {
                    onNotificationTapped!(response.payload!);
                  }
                },
              );

              // 3. Android High-Importance Broadcast Channel
              const AndroidNotificationChannel broadcastChannel = AndroidNotificationChannel(
                'prepwise_broadcast_channel',
                'PrepWise Notifications',
                description: 'Important study updates, broadcasts, and reminders.',
                importance: Importance.max,
                playSound: true,
                enableVibration: true,
              );

              await _localNotifications
                  .resolvePlatformSpecificImplementation<AndroidFlutterLocalNotificationsPlugin>()
                  ?.createNotificationChannel(broadcastChannel);

              // 4. Initialize Live Focus Session Channel
              await FocusSessionService().initializeNotificationChannel();

              // 5. Get and monitor FCM Device Token
              try {
                _fcmToken = await _fcm.getToken();
                debugPrint("FCM Device Token: $_fcmToken");
                if (_fcmToken != null && onTokenReceived != null) {
                  onTokenReceived!(_fcmToken!);
                }
              } catch (e) {
                debugPrint("Error fetching FCM token: $e");
              }

              _fcm.onTokenRefresh.listen((newToken) {
                _fcmToken = newToken;
                if (onTokenReceived != null) {
                  onTokenReceived!(newToken);
                }
              });

              // 6. Handle Foreground Push Messages
              FirebaseMessaging.onMessage.listen((RemoteMessage message) {
                RemoteNotification? notification = message.notification;
                AndroidNotification? android = message.notification?.android;

                if (notification != null && android != null && !kIsWeb) {
                  _localNotifications.show(
                    notification.hashCode,
                    notification.title,
                    notification.body,
                    NotificationDetails(
                      android: AndroidNotificationDetails(
                        broadcastChannel.id,
                        broadcastChannel.name,
                        channelDescription: broadcastChannel.description,
                        icon: '@mipmap/ic_launcher',
                        importance: Importance.max,
                        priority: Priority.high,
                        playSound: true,
                      ),
                    ),
                    payload: jsonEncode(message.data),
                  );
                }
              });

              FirebaseMessaging.onMessageOpenedApp.listen((RemoteMessage message) {
                debugPrint("FCM notification opened from background: ${message.data}");
                if (onNotificationTapped != null) {
                  onNotificationTapped!(jsonEncode(message.data));
                }
              });
            }
          }
          DART_NOTIF_EOF

          python3 -c "import sys, textwrap; sys.stdout.write(textwrap.dedent(sys.stdin.read()))" << 'DART_BLOCK_EOF' > prepwise_app/lib/services/app_blocker_service.dart
          import 'package:flutter/services.dart';
          import 'package:flutter/foundation.dart';
          import 'app_toast.dart';

          class AppBlockerService {
            static final AppBlockerService _instance = AppBlockerService._internal();
            factory AppBlockerService() => _instance;
            AppBlockerService._internal();

            // UsageStats permission check channel (stays in MainActivity)
            static const _channel = MethodChannel('com.prepwise/accessibility');
            // Overlay permission check channel
            static const _overlayChannel = MethodChannel('com.prepwise/overlay');
            // FocusBlockerService control channel
            static const _serviceChannel = MethodChannel('com.prepwise/focusblocker');

            bool _isStrictActive = false;

            bool get isStrictActive => _isStrictActive;

            Future<bool> canDrawOverlays() async {
              try {
                return await _overlayChannel.invokeMethod('canDrawOverlays') as bool? ?? false;
              } catch (_) {
                return false;
              }
            }

            Future<void> requestOverlayPermission() async {
              try {
                await _overlayChannel.invokeMethod('requestOverlayPermission');
              } catch (_) {}
            }

            Future<bool> isAccessibilityEnabled() async {
              try {
                return await _channel.invokeMethod('hasUsagePermission') as bool? ?? false;
              } catch (_) {
                return false;
              }
            }

            Future<void> openAccessibilitySettings() async {
              try {
                await _channel.invokeMethod('openUsageSettings');
              } catch (_) {}
            }

            /// Starts the Android ForegroundService blocker.
            /// [allowedPackages] = packages user has whitelisted (PrepWise itself always allowed).
            Future<void> startStrictTimer(List<String> allowedPackages, {String subject = 'General', String mode = 'Study'}) async {
              _isStrictActive = true;

              final bool accessOk = await isAccessibilityEnabled();
              if (!accessOk) {
                AppToast.show("Tip: Grant 'Usage Access' in Settings for full app blocking.");
                // Don't force open settings - user can continue without it
              }

              try {
                final allInstalledRaw = await const MethodChannel('com.prepwise/apps').invokeMethod('getInstalledApps') as String;
                final List<dynamic> allApps = _parseJsonArray(allInstalledRaw);

                final Set<String> allowedSet = allowedPackages.toSet();
                allowedSet.add('com.prepwise.prepwise');
                allowedSet.add('com.android.systemui');
                allowedSet.add('com.android.launcher');
                allowedSet.add('com.android.launcher3');

                final List<String> blockedPackages = allApps
                    .map((a) => a['packageName']?.toString() ?? '')
                    .where((pkg) => pkg.isNotEmpty && !allowedSet.contains(pkg))
                    .toList();

                // Start the ForegroundService - it survives app minimize/close
                await _serviceChannel.invokeMethod('startFocusBlocker', {
                  'blockedApps': blockedPackages,
                  'subject': subject,
                  'mode': mode,
                });
                AppToast.show("Focus Mode Active! Distracting apps will be blocked.");
              } catch (e) {
                debugPrint('[AppBlockerService] Error starting blocker service: $e');
              }
            }

            Future<void> stopStrictTimer() async {
              _isStrictActive = false;
              try {
                await _serviceChannel.invokeMethod('stopFocusBlocker');
              } catch (e) {
                debugPrint('[AppBlockerService] Error stopping blocker service: $e');
              }
            }

            /// Update blocked apps list while session is running
            Future<void> updateBlockedApps(List<String> allowedPackages) async {
              if (!_isStrictActive) return;
              try {
                final allInstalledRaw = await const MethodChannel('com.prepwise/apps').invokeMethod('getInstalledApps') as String;
                final List<dynamic> allApps = _parseJsonArray(allInstalledRaw);
                final Set<String> allowedSet = allowedPackages.toSet();
                allowedSet.add('com.prepwise.prepwise');
                allowedSet.add('com.android.systemui');
                final List<String> blockedPackages = allApps
                    .map((a) => a['packageName']?.toString() ?? '')
                    .where((pkg) => pkg.isNotEmpty && !allowedSet.contains(pkg))
                    .toList();
                await _serviceChannel.invokeMethod('updateBlockedApps', {'blockedApps': blockedPackages});
              } catch (e) {
                debugPrint('[AppBlockerService] Error updating blocked apps: $e');
              }
            }

            void onAppExitedToBackground() {
              // FocusBlockerService handles everything in background - nothing to do here
              debugPrint('[AppBlockerService] App went to background. FocusBlockerService is running independently.');
            }

            List<dynamic> _parseJsonArray(String raw) {
              try {
                final trimmed = raw.trim();
                if (!trimmed.startsWith('[')) return [];
                final result = <Map<String, dynamic>>[];
                final itemPattern = RegExp(r'\{[^}]+\}');
                for (final match in itemPattern.allMatches(trimmed)) {
                  final item = match.group(0) ?? '';
                  final nameMatch = RegExp(r'"name"\s*:\s*"([^"]*)"').firstMatch(item);
                  final pkgMatch = RegExp(r'"packageName"\s*:\s*"([^"]*)"').firstMatch(item);
                  if (nameMatch != null && pkgMatch != null) {
                    result.add({'name': nameMatch.group(1), 'packageName': pkgMatch.group(1)});
                  }
                }
                return result;
              } catch (_) {
                return [];
              }
            }
          }
