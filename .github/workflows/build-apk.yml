                  if (isStopping) return
                  if (currentElapsedSeconds > 0 && startTimestampMs > 0L) {
                      // Save epoch-based timer state so restart can resume without resetting timer
                      val prefs = getSharedPreferences("PrepWisePrefs", Context.MODE_PRIVATE)
                      prefs.edit()
                          .putLong("focus_start_ts", startTimestampMs)
                          .putLong("focus_paused_duration", pausedDurationMs)
                          .putBoolean("focus_cam_paused", camPaused)
                          .putLong("focus_pause_start", if (camPaused && pauseStartMs > 0L) pauseStartMs else 0L)
                          .putBoolean("focus_was_running", true)
                          .apply()
                      val restartIntent = Intent(applicationContext, FocusBlockerService::class.java).apply {
                          action = ACTION_RESUME
                          putStringArrayListExtra(EXTRA_BLOCKED_APPS, ArrayList(blockedApps))
                          putExtra(EXTRA_SUBJECT, subject)
                          putExtra(EXTRA_MODE, mode)
                          putExtra(EXTRA_CAM_ENABLED, camEnabled)
                          putExtra(EXTRA_BLOCKER_ENABLED, blockerEnabled)
                      }
                      val pi = PendingIntent.getService(
                          applicationContext, 1, restartIntent,
                          PendingIntent.FLAG_ONE_SHOT or PendingIntent.FLAG_IMMUTABLE
                      )
                      val alarmMgr = getSystemService(Context.ALARM_SERVICE) as? android.app.AlarmManager
                      alarmMgr?.set(android.app.AlarmManager.ELAPSED_REALTIME_WAKEUP,
                          android.os.SystemClock.elapsedRealtime() + 500, pi)
                  }
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  val prefs = getSharedPreferences("PrepWisePrefs", Context.MODE_PRIVATE)

                  // Prevent zombie restart if service was intentionally stopped
                  if (intent == null) {
                      val shouldRun = prefs.getBoolean("is_service_running", false)
                      if (!shouldRun) {
                          stopForegroundSafely()
                          stopSelf()
                          return START_NOT_STICKY
                      }
                  }

                  when (intent?.action) {
                      ACTION_START -> {
                          if (isStopping) isStopping = false
                          blockedApps = intent.getStringArrayListExtra(EXTRA_BLOCKED_APPS) ?: emptyList()
                          subject = intent.getStringExtra(EXTRA_SUBJECT) ?: "General"
                          mode = intent.getStringExtra(EXTRA_MODE) ?: "Study"
                          camEnabled = intent.getBooleanExtra(EXTRA_CAM_ENABLED, false)
                          blockerEnabled = intent.getBooleanExtra(EXTRA_BLOCKER_ENABLED, false)

                          // Only reset timer if not already running (prevent double-start wipe)
                          if (startTimestampMs == 0L) {
                              startTimestampMs = System.currentTimeMillis()
                              pausedDurationMs = 0L
                              pauseStartMs = 0L
                              lastReportedSecond = -1
                              currentElapsedSeconds = 0
                              camPaused = false
                              camVerified = true
                              lastFaceSeenTimestamp = System.currentTimeMillis()
                          }

                          isRunning = true
                          currentSubject = subject
                          currentMode = mode
                          currentCamEnabled = camEnabled
                          currentBlockerEnabled = blockerEnabled

                          prefs.edit()
                              .putBoolean("is_service_running", true)
                              .putString("active_subject", subject)
                              .putString("active_mode", mode)
                              .putBoolean("active_cam_enabled", camEnabled)
                              .putBoolean("active_blocker_enabled", blockerEnabled)
                              .putLong("active_start_timestamp_ms", startTimestampMs)
                              .apply()

                          startForegroundSafely()
                          handler.removeCallbacks(tickRunnable)
                          handler.post(tickRunnable)

                          if (camEnabled) {
                              if (canDrawOverlay()) showFloatingDot()
                              if (!isCameraRunning) startNativeFaceTracker()
                          } else {
                              removeFloatingDot()
                              stopNativeFaceTracker()
                          }
                      }
                      ACTION_RESUME -> {
                          // Restore epoch-based timer from SharedPrefs after app was killed and restarted
                          if (isStopping) isStopping = false
                          blockedApps = intent?.getStringArrayListExtra(EXTRA_BLOCKED_APPS) ?: emptyList()
                          subject = intent?.getStringExtra(EXTRA_SUBJECT) ?: "General"
                          mode = intent?.getStringExtra(EXTRA_MODE) ?: "Study"
                          camEnabled = intent?.getBooleanExtra(EXTRA_CAM_ENABLED, false) ?: false
                          blockerEnabled = intent?.getBooleanExtra(EXTRA_BLOCKER_ENABLED, false) ?: false

                          val savedStart = prefs.getLong("focus_start_ts", 0L)
                          val savedPaused = prefs.getLong("focus_paused_duration", 0L)
                          val savedCamPaused = prefs.getBoolean("focus_cam_paused", false)
                          val savedPauseStart = prefs.getLong("focus_pause_start", 0L)
                          prefs.edit()
                              .remove("focus_start_ts").remove("focus_paused_duration")
                              .remove("focus_cam_paused").remove("focus_pause_start")
                              .remove("focus_was_running")
                              .putBoolean("is_service_running", true)
                              .putString("active_subject", subject)
                              .putString("active_mode", mode)
                              .putBoolean("active_cam_enabled", camEnabled)
                              .putBoolean("active_blocker_enabled", blockerEnabled)
                              .apply()

                          if (savedStart > 0L) {
                              startTimestampMs = savedStart
                              pausedDurationMs = savedPaused
                              camPaused = savedCamPaused
                              pauseStartMs = savedPauseStart
                              if (camPaused && pauseStartMs == 0L) pauseStartMs = System.currentTimeMillis()
                          } else {
                              startTimestampMs = System.currentTimeMillis()
                              pausedDurationMs = 0L
                              pauseStartMs = 0L
                              camPaused = false
                          }
                          camVerified = !camPaused
                          lastReportedSecond = -1
                          lastFaceSeenTimestamp = System.currentTimeMillis()
                          isRunning = true
                          currentSubject = subject
                          currentMode = mode
                          currentCamEnabled = camEnabled
                          currentBlockerEnabled = blockerEnabled

                          startForegroundSafely()
                          handler.removeCallbacks(tickRunnable)
                          handler.post(tickRunnable)

                          if (camEnabled) {
                              if (canDrawOverlay()) showFloatingDot()
                              if (!isCameraRunning) startNativeFaceTracker()
                          } else {
                              removeFloatingDot()
                              stopNativeFaceTracker()
                          }
                      }
                      ACTION_STOP_REQUEST -> {
                          if (!isStopping) {
                              // Kotlin handles ALL logging — web logging is fully disabled for this path
                              // sendStopRequestToWebApp() removed to prevent double-logging
                              // Web UI gets notified AFTER Kotlin logs, only to update display
                              directBackgroundStopAndLog()
                          }
                      }
                      ACTION_STOP -> {
                          if (isStopping) return START_NOT_STICKY
                          isStopping = true
                          cancelScheduledRestart()
                          handler.removeCallbacks(tickRunnable)
                          stopNativeFaceTracker()
                          removeOverlay()
                          removeFloatingDot()
                          startTimestampMs = 0L
                          currentElapsedSeconds = 0
                          isRunning = false

                          prefs.edit()
                              .putBoolean("is_service_running", false)
                              .remove("active_subject")
                              .remove("active_mode")
                              .remove("active_cam_enabled")
                              .remove("active_blocker_enabled")
                              .remove("active_start_timestamp_ms")
                              .remove("focus_start_ts")
                              .remove("focus_paused_duration")
                              .remove("focus_cam_paused")
                              .remove("focus_pause_start")
                              .remove("focus_was_running")
                              .apply()

                          stopForegroundSafely()
                          stopSelf()
                      }
                      ACTION_UPDATE_BLOCKED -> {
                          val apps = intent.getStringArrayListExtra(EXTRA_BLOCKED_APPS) ?: arrayListOf()
                          blockedApps = apps.toList()
                      }
                      ACTION_SET_CAM_STATUS -> {
                          val status = intent.getStringExtra(EXTRA_CAM_STATUS) ?: "verified"
                          val detected = (status == "verified")
                          if (detected) {
                              lastFaceSeenTimestamp = System.currentTimeMillis()
                          }
                          onFaceDetectionResult(detected)
                      }
                  }
                  return START_STICKY
              }

              private fun startForegroundSafely() {
                  val notif = buildNotification()
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      var fgsType = ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.UPSIDE_DOWN_CAKE) {
                          if (camEnabled && checkSelfPermission(Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED) {
                              fgsType = fgsType or ServiceInfo.FOREGROUND_SERVICE_TYPE_CAMERA
                          }
                      }
                      startForeground(NOTIF_ID, notif, fgsType)
                  } else {
                      startForeground(NOTIF_ID, notif)
                  }
              }

              // Native Camera2 Face Tracker
              private fun startNativeFaceTracker() {
                  if (isCameraRunning || !camEnabled) return
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      if (checkSelfPermission(Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) {
                          return
                      }
                  }

                  try {
                      val cameraManager = getSystemService(Context.CAMERA_SERVICE) as? CameraManager ?: return
                      var frontCamId: String? = null
                      for (id in cameraManager.cameraIdList) {
                          val chars = cameraManager.getCameraCharacteristics(id)
                          val facing = chars.get(CameraCharacteristics.LENS_FACING)
                          if (facing == CameraCharacteristics.LENS_FACING_FRONT) {
                              frontCamId = id
                              break
                          }
                      }
                      if (frontCamId == null) {
                          if (cameraManager.cameraIdList.isNotEmpty()) {
                              frontCamId = cameraManager.cameraIdList[0]
                          } else {
                              return
                          }
                      }

                      cameraThread = HandlerThread("PrepWiseCamTracker").apply { start() }
                      val cHandler = Handler(cameraThread!!.looper)
                      cameraHandler = cHandler

                      surfaceTexture = SurfaceTexture(42).apply {
                          setDefaultBufferSize(320, 240)
                      }
                      cameraSurface = Surface(surfaceTexture)

                      cameraManager.openCamera(frontCamId, object : CameraDevice.StateCallback() {
                          override fun onOpened(camera: CameraDevice) {
                              cameraDevice = camera
                              isCameraRunning = true
                              try {
                                  val surface = cameraSurface ?: return
                                  val surfaces = listOf(surface)
                                  camera.createCaptureSession(surfaces, object : CameraCaptureSession.StateCallback() {
                                      override fun onConfigured(session: CameraCaptureSession) {
                                          captureSession = session
                                          try {
                                              val requestBuilder = camera.createCaptureRequest(CameraDevice.TEMPLATE_PREVIEW)
                                              requestBuilder.addTarget(surface)

                                              val chars = cameraManager.getCameraCharacteristics(frontCamId)
                                              val fdModes = chars.get(CameraCharacteristics.STATISTICS_INFO_AVAILABLE_FACE_DETECT_MODES)
                                              val chosenMode = when {
                                                  fdModes?.contains(CameraCharacteristics.STATISTICS_FACE_DETECT_MODE_FULL) == true ->
                                                      CameraCharacteristics.STATISTICS_FACE_DETECT_MODE_FULL
                                                  fdModes?.contains(CameraCharacteristics.STATISTICS_FACE_DETECT_MODE_SIMPLE) == true ->
                                                      CameraCharacteristics.STATISTICS_FACE_DETECT_MODE_SIMPLE
                                                  else -> CameraCharacteristics.STATISTICS_FACE_DETECT_MODE_OFF
                                              }

                                              if (chosenMode != CameraCharacteristics.STATISTICS_FACE_DETECT_MODE_OFF) {
                                                  requestBuilder.set(CaptureRequest.STATISTICS_FACE_DETECT_MODE, chosenMode)
                                              }

                                              session.setRepeatingRequest(requestBuilder.build(), object : CameraCaptureSession.CaptureCallback() {
                                                  override fun onCaptureCompleted(
                                                      session: CameraCaptureSession,
                                                      request: CaptureRequest,
                                                      result: TotalCaptureResult
                                                  ) {
                                                      val faces = result.get(CaptureResult.STATISTICS_FACES)
                                                      val now = System.currentTimeMillis()
                                                      val hasFace = faces != null && faces.isNotEmpty()
                                                      if (hasFace) {
                                                          lastFaceSeenTimestamp = now
                                                          handler.post { onFaceDetectionResult(true) }
                                                      } else {
                                                          if (now - lastFaceSeenTimestamp > 2500) {
                                                              handler.post { onFaceDetectionResult(false) }
                                                          }
                                                      }
                                                  }
                                              }, cHandler)
                                          } catch (_: Exception) {}
                                      }

                                      override fun onConfigureFailed(session: CameraCaptureSession) {
                                          isCameraRunning = false
                                      }
                                  }, cHandler)
                              } catch (_: Exception) {
                                  isCameraRunning = false
                              }
                          }

                          override fun onDisconnected(camera: CameraDevice) {
                              camera.close()
                              cameraDevice = null
                              isCameraRunning = false
                          }

                          override fun onError(camera: CameraDevice, error: Int) {
                              try { camera.close() } catch (_: Exception) {}
                              cameraDevice = null
                              isCameraRunning = false
                          }
                      }, cHandler)
                  } catch (_: Exception) {
                      isCameraRunning = false
                  }
              }

              private fun stopNativeFaceTracker() {
                  try { captureSession?.stopRepeating(); captureSession?.close() } catch (_: Exception) {}
                  captureSession = null
                  try { cameraDevice?.close() } catch (_: Exception) {}
                  cameraDevice = null
                  try { cameraSurface?.release() } catch (_: Exception) {}
                  cameraSurface = null
                  try { surfaceTexture?.release() } catch (_: Exception) {}
                  surfaceTexture = null
                  try { cameraThread?.quitSafely() } catch (_: Exception) {}
                  cameraThread = null
                  cameraHandler = null
                  isCameraRunning = false
              }

              private fun onFaceDetectionResult(detected: Boolean) {
                  if (!camEnabled) return
                  val wasPaused = camPaused
                  camPaused = !detected
                  camVerified = detected

                  val now = System.currentTimeMillis()
                  if (!wasPaused && camPaused) {
                      pauseStartMs = now
                  } else if (wasPaused && !camPaused) {
                      pausedDurationMs += (now - pauseStartMs)
                  }

                  updateFloatingDotColor()
                  updateNotification()
              }

              // Core blocking logic
              private fun checkAndBlock() {
                  if (!blockerEnabled || !hasUsagePermission()) return
                  val foreground = getForegroundPackage() ?: return

                  if (foreground == packageName) {
                      if (overlayView != null) removeOverlay()
                      if (camEnabled && canDrawOverlay()) showDotView()
                      return
                  }

                  if (foreground == "com.android.systemui" || foreground == "com.android.launcher" ||
                      foreground.startsWith("com.google.android.inputmethod")) {
                      if (camEnabled) showDotView()
                      return
                  }

                  if (blockedApps.contains(foreground)) {
                      if (camEnabled) hideDotView()
                      if (canDrawOverlay()) {
                          showBlockingOverlay(foreground)
                      } else {
                          redirectToPrepWise()
                      }
                  } else {
                      if (overlayView != null) removeOverlay()
                      if (camEnabled) showDotView()
                  }
              }

              private fun canDrawOverlay(): Boolean =
                  Build.VERSION.SDK_INT < Build.VERSION_CODES.M || Settings.canDrawOverlays(this)

              private fun showBlockingOverlay(blockedPkg: String) {
                  if (overlayView != null && lastBlockedPkg == blockedPkg) return
                  removeOverlay()
                  lastBlockedPkg = blockedPkg

                  val wm = windowManager ?: return
                  val density = resources.displayMetrics.density

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setBackgroundColor(Color.parseColor("#0B0F19"))
                      setPadding((32 * density).toInt(), (48 * density).toInt(), (32 * density).toInt(), (48 * density).toInt())
                  }

                  val badge = TextView(this).apply {
                      text = "FOCUS MODE ACTIVE"
                      textSize = 11f
                      setTextColor(Color.parseColor("#10B981"))
                      gravity = Gravity.CENTER
                      setPadding((12 * density).toInt(), (4 * density).toInt(), (12 * density).toInt(), (4 * density).toInt())
                      background = android.graphics.drawable.GradientDrawable().apply {
                          setColor(Color.parseColor("#064E3B"))
                          cornerRadius = 20 * density
                      }
                  }
                  root.addView(badge, LinearLayout.LayoutParams(LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT).apply {
                      bottomMargin = (20 * density).toInt()
                  })

                  val title = TextView(this).apply {
                      text = "Stay Focused on Your Goal!"
                      textSize = 22f
                      setTextColor(Color.WHITE)
                      typeface = android.graphics.Typeface.DEFAULT_BOLD
                      gravity = Gravity.CENTER
                  }
                  root.addView(title, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT).apply {
                      bottomMargin = (12 * density).toInt()
                  })

                  val appName = getAppName(blockedPkg)
                  val msg = TextView(this).apply {
                      text = "$appName is blocked during this session.\nEvery minute counts towards your dream rank."
                      textSize = 14f
                      setTextColor(Color.parseColor("#94A3B8"))
                      gravity = Gravity.CENTER
                      setLineSpacing(4 * density, 1f)
                  }
                  root.addView(msg, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT).apply {
                      bottomMargin = (32 * density).toInt()
                  })

                  val btn = TextView(this).apply {
                      text = "Back to Study"
                      textSize = 15f
                      setTextColor(Color.WHITE)
                      typeface = android.graphics.Typeface.DEFAULT_BOLD
                      gravity = Gravity.CENTER
                      setPadding((28 * density).toInt(), (14 * density).toInt(), (28 * density).toInt(), (14 * density).toInt())
                      background = android.graphics.drawable.GradientDrawable().apply {
                          setColor(Color.parseColor("#2563EB"))
                          cornerRadius = 14 * density
                      }
                      setOnClickListener {
                          removeOverlay()
                          redirectToPrepWise()
                      }
                  }
                  root.addView(btn, LinearLayout.LayoutParams(LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT))

                  val layoutType = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                  } else {
                      @Suppress("DEPRECATION") WindowManager.LayoutParams.TYPE_PHONE
                  }

                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.MATCH_PARENT,
                      layoutType,
                      WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL or WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                      PixelFormat.TRANSLUCENT
                  )

                  try {
                      wm.addView(root, params)
                      overlayView = root
                      overlayDismissHandler.removeCallbacksAndMessages(null)
                      overlayDismissHandler.postDelayed({
                          removeOverlay()
                          redirectToPrepWise()
                      }, 5000)
                  } catch (_: Exception) {}
              }

              private fun removeOverlay() {
                  overlayDismissHandler.removeCallbacksAndMessages(null)
                  overlayView?.let { view ->
                      try { windowManager?.removeView(view) } catch (_: Exception) {}
                      overlayView = null
                      lastBlockedPkg = null
                  }
              }

              private fun redirectToPrepWise() {
                  try {
                      val intent = Intent(this, MainActivity::class.java).apply {
                          flags = Intent.FLAG_ACTIVITY_NEW_TASK or
                                  Intent.FLAG_ACTIVITY_SINGLE_TOP or
                                  Intent.FLAG_ACTIVITY_CLEAR_TOP
                      }
                      startActivity(intent)
                  } catch (_: Exception) {}
              }

              private fun hasUsagePermission(): Boolean {
                  val appOps = getSystemService(Context.APP_OPS_SERVICE) as? android.app.AppOpsManager ?: return false
                  val mode = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      appOps.unsafeCheckOpNoThrow(
                          android.app.AppOpsManager.OPSTR_GET_USAGE_STATS,
                          android.os.Process.myUid(),
                          packageName
                      )
                  } else {
                      @Suppress("DEPRECATION")
                      appOps.checkOpNoThrow(
                          android.app.AppOpsManager.OPSTR_GET_USAGE_STATS,
                          android.os.Process.myUid(),
                          packageName
                      )
                  }
                  return mode == android.app.AppOpsManager.MODE_ALLOWED
              }

              private fun getForegroundPackage(): String? {
                  val usm = getSystemService(Context.USAGE_STATS_SERVICE) as? UsageStatsManager ?: return null
                  val time = System.currentTimeMillis()
                  val stats = usm.queryUsageStats(UsageStatsManager.INTERVAL_DAILY, time - 1000 * 10, time)
                  return stats?.maxByOrNull { it.lastTimeUsed }?.packageName
              }

              private fun getAppName(pkg: String): String {
                  return try {
                      val pm = packageManager
                      val info = pm.getApplicationInfo(pkg, 0)
                      pm.getApplicationLabel(info).toString()
                  } catch (_: Exception) {
                      pkg
                  }
              }

              // Floating dot view building & handling
              private fun buildDotView(): View {
                  val density = resources.displayMetrics.density
                  val cardWidth = (260 * density).toInt()

                  val container = FrameLayout(this)

                  val compactCircle = FrameLayout(this).apply {
                      tag = "compact"
                      val px = (44 * density).toInt()
                      layoutParams = FrameLayout.LayoutParams(px, px)
                      background = android.graphics.drawable.GradientDrawable().apply {
                          shape = android.graphics.drawable.GradientDrawable.OVAL
                          setColor(if (camVerified) Color.parseColor("#10B981") else Color.parseColor("#EF4444"))
                          setStroke((3 * density).toInt(), Color.parseColor("#0F172A"))
                      }
                      val dotCenter = View(context).apply {
                          val dotPx = (14 * density).toInt()
                          layoutParams = FrameLayout.LayoutParams(dotPx, dotPx, Gravity.CENTER)
                          background = android.graphics.drawable.GradientDrawable().apply {
                              shape = android.graphics.drawable.GradientDrawable.OVAL
                              setColor(Color.WHITE)
                          }
                      }
                      addView(dotCenter)
                  }
                  container.addView(compactCircle)

                  val expandedCard = LinearLayout(this).apply {
                      tag = "expanded"
                      orientation = LinearLayout.VERTICAL
                      visibility = View.GONE
                      setPadding((16 * density).toInt(), (14 * density).toInt(), (16 * density).toInt(), (14 * density).toInt())
                      background = android.graphics.drawable.GradientDrawable().apply {
                          setColor(Color.parseColor("#0F172A"))
                          cornerRadius = 16 * density
                          setStroke((2 * density).toInt(), if (camVerified) Color.parseColor("#10B981") else Color.parseColor("#EF4444"))
                      }
                  }

                  val topRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }

                  val dotIndicator = View(this).apply {
                      tag = "cardDotIndicator"
                      val px = (10 * density).toInt()
                      layoutParams = LinearLayout.LayoutParams(px, px).apply { rightMargin = (8 * density).toInt() }
                      background = android.graphics.drawable.GradientDrawable().apply {
                          shape = android.graphics.drawable.GradientDrawable.OVAL
                          setColor(if (camVerified) Color.parseColor("#10B981") else Color.parseColor("#EF4444"))
                      }
                  }
                  topRow.addView(dotIndicator)

                  val titleTv = TextView(this).apply {
                      text = subject
                      textSize = 13f
                      setTextColor(Color.WHITE)
                      typeface = android.graphics.Typeface.DEFAULT_BOLD
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                  }
                  topRow.addView(titleTv)

                  val closeBtn = TextView(this).apply {
                      text = "\u2715"
                      textSize = 14f
                      setTextColor(Color.parseColor("#94A3B8"))
                      setPadding((8 * density).toInt(), 0, 0, 0)
                      setOnClickListener { collapseNativeDot() }
                  }
                  topRow.addView(closeBtn)
                  expandedCard.addView(topRow)

                  val timerTv = TextView(this).apply {
                      tag = "timerTv"
                      text = formatElapsed(currentElapsedSeconds)
                      textSize = 28f
                      setTextColor(Color.WHITE)
                      typeface = android.graphics.Typeface.MONOSPACE
                      gravity = Gravity.CENTER
                      setPadding(0, (10 * density).toInt(), 0, (6 * density).toInt())
                  }
                  expandedCard.addView(timerTv, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT))

                  val statusTv = TextView(this).apply {
                      tag = "statusTv"
                      text = if (camVerified) "\u2713 $mode - Face Detected (Live)" else "\u23F8 $mode - No Face Detected!"
                      textSize = 10f
                      setTextColor(if (camVerified) Color.parseColor("#10B981") else Color.parseColor("#EF4444"))
                      gravity = Gravity.CENTER
                      setPadding(0, 0, 0, (10 * density).toInt())
                  }
                  expandedCard.addView(statusTv, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT))

                  val stopBtn = TextView(this).apply {
                      text = "Stop Focus Mode"
                      textSize = 12f
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                      setPadding((16 * density).toInt(), (10 * density).toInt(), (16 * density).toInt(), (10 * density).toInt())
                      background = android.graphics.drawable.GradientDrawable().apply {
                          setColor(Color.parseColor("#DC2626"))
                          cornerRadius = 10 * density
                      }
                      typeface = android.graphics.Typeface.DEFAULT_BOLD
                      setOnClickListener {
                          // Kotlin handles ALL logging — no web logging call here
                          directBackgroundStopAndLog()
                      }
                  }
                  expandedCard.addView(stopBtn, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT))

                  val hintTv = TextView(this).apply {
                      text = "Drag anywhere"
                      textSize = 9f
                      setTextColor(Color.parseColor("#475569"))
                      gravity = Gravity.CENTER
                      setPadding(0, (6 * density).toInt(), 0, 0)
                  }
                  expandedCard.addView(hintTv, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT))

                  container.addView(expandedCard, FrameLayout.LayoutParams(cardWidth, FrameLayout.LayoutParams.WRAP_CONTENT))

                  return container
              }

              private fun formatElapsed(secs: Int): String {
                  val h = secs / 3600; val m = (secs % 3600) / 60; val s = secs % 60
                  return if (h > 0) String.format("%02d:%02d:%02d", h, m, s) else String.format("%02d:%02d", m, s)
              }

              private fun expandNativeDot() {
                  dotExpanded = true
                  val container = dotView ?: return
                  container.findViewWithTag<View>("compact")?.visibility = View.GONE
                  container.findViewWithTag<View>("expanded")?.visibility = View.VISIBLE
                  dotParams?.let { p ->
                      val density = resources.displayMetrics.density
                      p.width = (260 * density).toInt()
                      p.height = FrameLayout.LayoutParams.WRAP_CONTENT
                      p.flags = p.flags and WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE.inv()
                      try { windowManager?.updateViewLayout(container, p) } catch (_: Exception) {}
                  }
              }

              private fun collapseNativeDot() {
                  dotExpanded = false
                  val container = dotView ?: return
                  container.findViewWithTag<View>("compact")?.visibility = View.VISIBLE
                  container.findViewWithTag<View>("expanded")?.visibility = View.GONE
                  val px = (44 * resources.displayMetrics.density).toInt()
                  dotParams?.let { p ->
                      p.width = px; p.height = px
                      p.flags = p.flags or WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                      try { windowManager?.updateViewLayout(container, p) } catch (_: Exception) {}
                  }
              }

              private fun showFloatingDot() {
                  if (dotView != null) return
                  val density = resources.displayMetrics.density
                  val px = (44 * density).toInt()

                  val dot = buildDotView()

                  var startX = 0f; var startY = 0f
                  var initialX = 0; var initialY = 0
                  var moved = false
                  dot.setOnTouchListener { _, event ->
                      val p = dotParams ?: return@setOnTouchListener false
                      when (event.action) {
                          android.view.MotionEvent.ACTION_DOWN -> {
                              startX = event.rawX; startY = event.rawY
                              initialX = p.x; initialY = p.y
                              moved = false; true
                          }
                          android.view.MotionEvent.ACTION_MOVE -> {
                              val dx = (event.rawX - startX).toInt()
                              val dy = (event.rawY - startY).toInt()
                              if (Math.abs(dx) > 8 || Math.abs(dy) > 8) moved = true
                              // Gravity.END: x is right-side margin, so horizontal drag is negated
                              p.x = initialX - dx; p.y = initialY + dy
                              try { windowManager?.updateViewLayout(dot, p) } catch (_: Exception) {}
                              true
                          }
                          android.view.MotionEvent.ACTION_UP -> {
                              if (!moved) {
                                  if (dotExpanded) collapseNativeDot() else expandNativeDot()
                              }
                              true
                          }
                          else -> false
                      }
                  }

                  val layoutType = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                  } else {
                      @Suppress("DEPRECATION") WindowManager.LayoutParams.TYPE_PHONE
                  }

                  val params = WindowManager.LayoutParams(
                      px, px,
                      layoutType,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.END
                      x = (16 * density).toInt()
                      y = (resources.displayMetrics.heightPixels / 4)
                  }

                  try {
                      windowManager?.addView(dot, params)
                      dotView = dot
                      dotParams = params
                      dotExpanded = false
                  } catch (_: Exception) {}
              }

              private fun showDotView() {
                  dotView?.visibility = View.VISIBLE
              }

              private fun hideDotView() {
                  dotView?.visibility = View.GONE
              }

              private fun removeFloatingDot() {
                  dotView?.let { dot ->
                      try { windowManager?.removeView(dot) } catch (_: Exception) {}
                      dotView = null
                      dotParams = null
                      dotExpanded = false
                  }
              }

              private fun updateFloatingDotColor() {
                  val container = dotView ?: return
                  val colorInt = if (camVerified) Color.parseColor("#10B981") else Color.parseColor("#EF4444")
                  val density = resources.displayMetrics.density

                  container.findViewWithTag<View>("compact")?.background = android.graphics.drawable.GradientDrawable().apply {
                      shape = android.graphics.drawable.GradientDrawable.OVAL
                      setColor(colorInt)
                      setStroke((3 * density).toInt(), Color.parseColor("#0F172A"))
                  }

                  container.findViewWithTag<View>("cardDotIndicator")?.background = android.graphics.drawable.GradientDrawable().apply {
                      shape = android.graphics.drawable.GradientDrawable.OVAL
                      setColor(colorInt)
                  }

                  container.findViewWithTag<TextView>("statusTv")?.apply {
                      text = if (camVerified) "\u2713 $mode - Face Detected (Live)" else "\u23F8 $mode - No Face Detected!"
                      setTextColor(colorInt)
                  }

                  container.findViewWithTag<View>("expanded")?.background = android.graphics.drawable.GradientDrawable().apply {
                      setColor(Color.parseColor("#0F172A"))
                      cornerRadius = 16 * density
                      setStroke((2 * density).toInt(), colorInt)
                  }
              }

              private fun updateDotTimer() {
                  val container = dotView ?: return
                  val formatted = formatElapsed(currentElapsedSeconds)
                  fun updateAll(v: android.view.ViewGroup) {
                      for (i in 0 until v.childCount) {
                          val child = v.getChildAt(i)
                          if (child is android.widget.TextView && child.tag == "timerTv") {
                              child.text = formatted
                          } else if (child is android.view.ViewGroup) {
                              updateAll(child)
                          }
                      }
                  }
                  if (container is android.view.ViewGroup) updateAll(container)
              }
              private fun createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(
                          CHANNEL_ID,
                          "Focus Session Active",
                          NotificationManager.IMPORTANCE_LOW
                      ).apply {
                          description = "Shows live focus session progress, face tracking state, and stop controls"
                          setShowBadge(false)
                          lockscreenVisibility = Notification.VISIBILITY_PUBLIC
                      }
                      val nm = getSystemService(NotificationManager::class.java)
                      nm.createNotificationChannel(channel)
                  }
              }

              private fun buildNotification(): Notification {
                  val m = currentElapsedSeconds / 60
                  val s = currentElapsedSeconds % 60
                  val timeStr = String.format("%02d:%02d", m, s)

                  val title = when {
                      camEnabled && !blockerEnabled -> "$timeStr - $subject"
                      !camEnabled && blockerEnabled -> "$timeStr - $subject - Focus Active"
                      camEnabled && blockerEnabled  -> "$timeStr - $subject - Focus Active"
                      else                          -> "$timeStr - $subject - Study Session"
                  }

                  val text = when {
                      camEnabled && !blockerEnabled ->
                          if (camPaused) "Face not detected - Timer paused" else "Face under detection - Timer running"
                      !camEnabled && blockerEnabled ->
                          "Focus Mode active - App blocking is ON"
                      camEnabled && blockerEnabled ->
                          (if (camPaused) "Face not detected" else "Face under detection") + " - App blocking is ON"
                      else ->
                          "Timer running - Stay focused on $subject"
                  }

                  val openIntent = Intent(this, MainActivity::class.java).apply {
                      flags = Intent.FLAG_ACTIVITY_SINGLE_TOP or Intent.FLAG_ACTIVITY_CLEAR_TOP
                  }
                  val pi = PendingIntent.getActivity(this, 0, openIntent, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)

                  val stopReqIntent = Intent(this, FocusBlockerService::class.java).apply { action = ACTION_STOP_REQUEST }
                  val stopPi = PendingIntent.getService(this, 1, stopReqIntent, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)

                  return NotificationCompat.Builder(this, CHANNEL_ID)
                      .setSmallIcon(android.R.drawable.ic_lock_idle_alarm)
                      .setContentTitle(title)
                      .setContentText(text)
                      .setContentIntent(pi)
                      .setOngoing(true)
                      .setSilent(true)
                      .setPriority(NotificationCompat.PRIORITY_LOW)
                      .setVisibility(NotificationCompat.VISIBILITY_PUBLIC)
                      .addAction(android.R.drawable.ic_menu_close_clear_cancel, "Stop Focus Mode", stopPi)
                      .build()
              }

              private fun updateNotification() {
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.notify(NOTIF_ID, buildNotification())
              }

              // Stop Request -> Web App & Direct Background Stop
              private fun sendStopRequestToWebApp() {
                  val intent = Intent("com.prepwise.ACTION_FOCUS_STOP_WEB_REQUEST")
                  intent.setPackage(packageName)
                  sendBroadcast(intent)
              }

              private fun cancelScheduledRestart() {
                  try {
                      val restartIntent = Intent(applicationContext, FocusBlockerService::class.java).apply { action = ACTION_START }
                      val pi = PendingIntent.getService(
                          applicationContext, 1, restartIntent,
                          PendingIntent.FLAG_ONE_SHOT or PendingIntent.FLAG_IMMUTABLE
                      )
                      val alarmMgr = getSystemService(Context.ALARM_SERVICE) as? android.app.AlarmManager
                      alarmMgr?.cancel(pi)
                  } catch (_: Exception) {}
              }

              private fun stopForegroundSafely() {
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.N) {
                          stopForeground(STOP_FOREGROUND_REMOVE)
                      } else {
                          @Suppress("DEPRECATION") stopForeground(true)
                      }
                      val nm = getSystemService(NotificationManager::class.java)
                      nm?.cancel(NOTIF_ID)
                  } catch (_: Exception) {}
              }

              private fun directBackgroundStopAndLog() {
                  if (isStopping) return
                  isStopping = true
                  cancelScheduledRestart()
                  handler.removeCallbacks(tickRunnable)
                  stopNativeFaceTracker()
                  removeOverlay()
                  removeFloatingDot()
                  // Bug 2 Fix: Always compute elapsed from epoch timestamps
                  // currentElapsedSeconds can be 0 right after ACTION_RESUME (tick hasn't fired yet)
                  val elapsed = if (startTimestampMs > 0L) {
                      val nowMs = System.currentTimeMillis()
                      val elapsedMs = if (camPaused && pauseStartMs > 0L) {
                          (pauseStartMs - startTimestampMs - pausedDurationMs)
                      } else {
                          (nowMs - startTimestampMs - pausedDurationMs)
                      }
                      Math.max(0, (elapsedMs / 1000).toInt())
                  } else {
                      currentElapsedSeconds // fallback if epoch not available
                  }
                  val snapSubject = subject
                  val snapMode = mode
                  val snapCam = camEnabled
                  val snapBlocker = blockerEnabled
                  val snapTimestamp = System.currentTimeMillis()
                  isRunning = false

                  val prefs = getSharedPreferences("PrepWisePrefs", Context.MODE_PRIVATE)
                  prefs.edit()
                      .putBoolean("is_service_running", false)
                      .remove("active_subject").remove("active_mode")
                      .remove("active_cam_enabled").remove("active_blocker_enabled")
                      .remove("active_start_timestamp_ms")
                      .remove("focus_start_ts").remove("focus_paused_duration")
                      .remove("focus_cam_paused").remove("focus_pause_start")
                      .remove("focus_was_running")
                      .apply()

                  // Show immediate Kotlin toast (works in background too)
                  val mins = elapsed / 60
                  val secs = elapsed % 60
                  val timeLabel = when {
                      mins > 0 && secs > 0 -> "${mins}m ${secs}s"
                      mins > 0 -> "${mins}m"
                      else -> "${secs}s"
                  }
                  Handler(Looper.getMainLooper()).post {
                      Toast.makeText(
                          applicationContext,
                          "✅ Session saved! $snapSubject · $snapMode · $timeLabel logged",
                          Toast.LENGTH_LONG
                      ).show()
                  }

                  // Log to Supabase directly from Kotlin on background thread
                  if (elapsed > 0) {
                      Thread {
                          try {
                              logSessionToSupabase(
                                  elapsed = elapsed,
                                  subject = snapSubject,
                                  mode = snapMode,
                                  camEnabled = snapCam,
                                  blockerEnabled = snapBlocker,
                                  timestamp = snapTimestamp
                              )
                          } catch (_: Exception) {
                              // Fallback: save as pending so app can retry on next open
                              prefs.edit()
                                  .putBoolean("has_pending_session", true)
                                  .putInt("pending_session_seconds", elapsed)
                                  .putString("pending_session_subject", snapSubject)
                                  .putString("pending_session_mode", snapMode)
                                  .putBoolean("pending_session_cam_enabled", snapCam)
                                  .putBoolean("pending_session_blocker_enabled", snapBlocker)
                                  .putLong("pending_session_timestamp", snapTimestamp)
                                  .apply()
                          }
                      }.start()
                  }

                  stopForegroundSafely()
                  currentElapsedSeconds = 0
                  startTimestampMs = 0L
                  stopSelf()
              }

              private fun logSessionToSupabase(
                  elapsed: Int, subject: String, mode: String,
                  camEnabled: Boolean, blockerEnabled: Boolean, timestamp: Long
              ) {
                  val supabaseUrl = "https://tvhgqdgwpjivwuiawdrf.supabase.co"
                  val anonKey = "sb_publishable_dkMHodPE0rD9hPSlq88kAw_SenHt33L"

                  // Read access token + user id from SharedPrefs (stored by web app)
                  val prefs = getSharedPreferences("PrepWisePrefs", Context.MODE_PRIVATE)
                  val accessToken = prefs.getString("supabase_access_token", null) ?: return
                  val userId = prefs.getString("supabase_user_id", null) ?: return

                  val addMins = Math.max(1, Math.round(elapsed / 60.0).toInt())
                  val todayStr = java.text.SimpleDateFormat("yyyy-MM-dd", java.util.Locale.getDefault())
                      .format(java.util.Date(timestamp))

                  val authHeaders = mapOf(
                      "apikey" to anonKey,
                      "Authorization" to "Bearer $accessToken",
                      "Content-Type" to "application/json"
                  )

                  // 1. Read existing daily_log
                  val getUrl = URL("$supabaseUrl/rest/v1/daily_logs?user_id=eq.$userId&log_date=eq.$todayStr&select=*")
                  val getConn = getUrl.openConnection() as HttpURLConnection
                  getConn.requestMethod = "GET"
                  authHeaders.forEach { (k, v) -> getConn.setRequestProperty(k, v) }
                  val existingJson = try {
                      if (getConn.responseCode == 200)
                          JSONArray(getConn.inputStream.bufferedReader().readText())
                      else JSONArray()
                  } catch (_: Exception) { JSONArray() } finally { getConn.disconnect() }

                  val existing = if (existingJson.length() > 0) existingJson.getJSONObject(0) else null
                  val totalStudy = (existing?.optInt("study_time_minutes", 0) ?: 0) + addMins
                  val totalTheory = (existing?.optInt("theory_minutes", 0) ?: 0) + if (mode == "Theory") addMins else 0
                  val totalPractice = (existing?.optInt("practice_minutes", 0) ?: 0) + if (mode == "Practice" || mode == "questions") addMins else 0
                  val totalRevision = (existing?.optInt("revision_minutes", 0) ?: 0) + if (mode == "Revision") addMins else 0
                  // verified_minutes: only increment when both cam AND blocker were ON (strict leaderboard hours)
                  val bothToggles = camEnabled && blockerEnabled
                  val totalVerified = (existing?.optInt("verified_minutes", 0) ?: 0) + if (bothToggles) addMins else 0

                  // 2. Upsert daily_log
                  val logBody = JSONObject().apply {
                      put("user_id", userId)
                      put("log_date", todayStr)
                      put("study_time_minutes", totalStudy)
                      put("theory_minutes", totalTheory)
                      put("practice_minutes", totalPractice)
                      put("revision_minutes", totalRevision)
                      put("verified_minutes", totalVerified)
                  }
                  val logConn = URL("$supabaseUrl/rest/v1/daily_logs").openConnection() as HttpURLConnection
                  logConn.requestMethod = "POST"
                  authHeaders.forEach { (k, v) -> logConn.setRequestProperty(k, v) }
                  logConn.setRequestProperty("Prefer", "resolution=merge-duplicates")
                  logConn.doOutput = true
                  OutputStreamWriter(logConn.outputStream).use { it.write(logBody.toString()) }
                  logConn.responseCode // trigger request
                  logConn.disconnect()

                  // 3. Insert focus_session
                  val startIso = java.text.SimpleDateFormat("yyyy-MM-dd'T'HH:mm:ss'Z'", java.util.Locale.getDefault())
                      .apply { timeZone = java.util.TimeZone.getTimeZone("UTC") }
                      .format(java.util.Date(timestamp - elapsed * 1000L))
                  val endIso = java.text.SimpleDateFormat("yyyy-MM-dd'T'HH:mm:ss'Z'", java.util.Locale.getDefault())
                      .apply { timeZone = java.util.TimeZone.getTimeZone("UTC") }
                      .format(java.util.Date(timestamp))

                  val sessionBody = JSONObject().apply {
                      put("user_id", userId)
                      put("started_at", startIso)
                      put("ended_at", endIso)
                      put("duration_seconds", elapsed)
                      put("counts_for_streak", elapsed >= 1200)
                      put("subject", subject)
                  }
                  val sessConn = URL("$supabaseUrl/rest/v1/focus_sessions").openConnection() as HttpURLConnection
                  sessConn.requestMethod = "POST"
                  authHeaders.forEach { (k, v) -> sessConn.setRequestProperty(k, v) }
                  sessConn.doOutput = true
                  OutputStreamWriter(sessConn.outputStream).use { it.write(sessionBody.toString()) }
                  sessConn.responseCode
                  sessConn.disconnect()
              }

              override fun onDestroy() {
                  handler.removeCallbacks(tickRunnable)
                  stopNativeFaceTracker()
                  overlayDismissHandler.removeCallbacksAndMessages(null)
                  removeOverlay()
                  removeFloatingDot()
                  currentElapsedSeconds = 0
                  isStopping = false
                  super.onDestroy()
              }
          }
