                    } catch (_) {}
                    break;

                  case 'downloadPdf':
                    final String? url = data['url'];
                    final String? title = data['title'];
                    if (url != null && url.isNotEmpty) {
                      await PdfDownloadService.downloadAndOpenPdf(url, customTitle: title);
                    }
                    break;

                  case 'startStrictTimer':
                    final List<String> allowed = (data['allowedApps'] as List<dynamic>?)?.map((e) => e.toString()).toList() ?? [];
                    await AppBlockerService().startStrictTimer(allowed);
                    break;

                  case 'stopStrictTimer':
                    await AppBlockerService().stopStrictTimer();
                    break;

                  case 'vibrate':
                    final String type = data['type'] ?? 'medium';
                    if (type == 'heavy') {
                      HapticFeedback.heavyImpact();
                    } else if (type == 'light') {
                      HapticFeedback.lightImpact();
                    } else {
                      HapticFeedback.mediumImpact();
                    }
                    break;

                  case 'toast':
                    final String msg = data['message'] ?? '';
                    if (msg.isNotEmpty) AppToast.show(msg);
                    break;

                  case 'requestHardwarePermissions':
                    await [Permission.camera, Permission.microphone, Permission.notification].request();
                    break;

                  case 'requestOverlayPermission':
                    AppToast.show("Please allow 'Display over other apps' to enable Face Verification");
                    await AppBlockerService().requestOverlayPermission();
                    break;

                  case 'checkOverlayPermission':
                    final bool granted = await AppBlockerService().canDrawOverlays();
                    await webViewController.runJavaScript("""
                      (function(){
